      font-size: 12px;

    .day {

      border-radius: 16px;

      padding: 13px 14px;

      box-shadow: var(--shadow);

    .day-top {

function renderPreview() {

  const container =
    document.getElementById(
      "dayList"
    );


  container.innerHTML =
    "";


  plan.days.forEach(
    (
      day,
      index
    ) => {


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "day";


      let activityHtml =
        "";


      if (
        day.activities.length === 0
      ) {

        activityHtml =
          `
            <span class="none">
              細節之後再補
            </span>
          `;

      }

      else {

        activityHtml =
          day.activities
            .map(
              item =>
                `

                  <span
                    class="pill ${
                      item.status === "已確認"
                      ? "confirmed"
                      : "tentative"
                    }"
                  >

                    ${
                      item.status === "已確認"
                      ? "✅"
                      : "🟡"
                    }

                    ${escapeHtml(item.title)}

                    ${
                      item.time
                      ? " · " + escapeHtml(item.time)
                      : ""
                    }

                  </span>

                `
            )
            .join("");

      }


      element.innerHTML =
        `

          <div class="day-top">

            <strong>
              Day ${day.day} · ${escapeHtml(day.title)}
            </strong>

            <span class="date">
              ${dates[index]}
            </span>

          </div>


          <div class="city">
            ${escapeHtml(day.city)}
          </div>


          <div class="activities">
            ${activityHtml}
          </div>

        `;


      container.appendChild(
        element
      );

    }
  );

}

    const oldData =
      localStorage.getItem(
        STORAGE_KEY

    if (oldData) {

        BACKUP_KEY,

function updateRestoreButton() {

  button.disabled =

function escapeHtml(
  text = ""
) {

  return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}
