<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <title>旅行預算｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --red-soft: #f3e3e1;
      --blue-soft: #e6edf3;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(950px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {

    }

    .save-status {
      color: var(--muted);

      font-size: 11px;
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;

      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .sync-banner {
      display: none;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .sync-banner.show {

    }

    .sync-banner.success {
      background: var(--green-soft);
    }

      background: var(--red-soft);
    }

    .summary {
      background: var(--dark);
      color: white;

      border-radius: 23px;

      box-shadow: var(--shadow);

      margin-bottom: 14px;
    }

    .summary-grid {
      display: grid;

      grid-template-columns: repeat(3,1fr);

    }

    .summary-item {
      padding: 5px 0;
    }

    .summary-item small {
      color: rgba(255,255,255,0.6);
    }

    .summary-item strong {
      display: block;

      margin-top: 4px;

      font-size: 23px;
    }

    .budget-settings {
      display: grid;

      grid-template-columns: 1fr 130px auto;

      gap: 9px;

      margin-top: 15px;
    }

    .dark-field {
      width: 100%;

      border: 1px solid rgba(255,255,255,0.14);

      border-radius: 12px;

      padding: 10px 11px;

      outline: none;

      background: rgba(255,255,255,0.09);

      color: white;
    }

    .dark-field option {
      color: black;
    }

    .add-button {
      border: 0;

      border-radius: 12px;

      padding: 10px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;
    }

    .currency-note {
      margin-top: 10px;

      color: rgba(255,255,255,0.68);

      font-size: 10px;
      line-height: 1.55;
    }

    .warning-box {
      display: none;

      margin-bottom: 14px;

      padding: 11px 13px;

      border-radius: 14px;

      background: var(--yellow-soft);

      color: #695d49;

      font-size: 11px;
      line-height: 1.55;
    }

    .warning-box.show {
      display: block;
    }

    .currency-box {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;

      margin-bottom: 14px;
    }

    .currency-chip {
      padding: 8px 11px;

      border-radius: 12px;

      background: white;

      box-shadow: var(--shadow);

      color: var(--muted);

      font-size: 11px;
    }

    .currency-chip strong {
      color: var(--text);
    }

    .expense-list {
      display: grid;
      gap: 11px;
    }

    .expense-card {
      background: white;

      border-radius: 20px;

      padding: 15px;

      box-shadow: var(--shadow);
    }

    .expense-top {
      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

      align-items: center;
    }

    .expense-title {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 17px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 20px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(3,1fr);

      gap: 8px;

      margin-top: 12px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    .field:disabled {
      opacity: 0.6;
      background: #efede9;
    }

    textarea.field {
      min-height: 65px;

      resize: vertical;

      line-height: 1.5;
    }

    .conversion-box {
      margin-top: 10px;

      padding: 11px 12px;

      border-radius: 13px;

      background: var(--blue-soft);

      font-size: 11px;

      line-height: 1.55;
    }

    .conversion-box.missing {
      background: var(--yellow-soft);
    }

    .conversion-box strong {
      font-size: 13px;
    }

    .actions {
      display: flex;

      gap: 7px;

      margin-top: 11px;
      padding-top: 11px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      margin-bottom: 8px;

      font-size: 40px;
    }

    .empty strong {
      display: block;

      margin-bottom: 5px;

      color: var(--text);
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      height: 72px;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 650px) {

      .summary-grid,
      .grid {
        grid-template-columns: 1fr;
      }

      .budget-settings {
        grid-template-columns: 1fr 110px;
      }

      .budget-settings .add-button {
        grid-column: 1 / -1;
      }

      .full {
        grid-column: auto;
      }

    }
  </style>
</head>

<main class="container">

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


/* =========================
   SETTINGS
========================= */

const STORAGE_KEY =
  "travelHubItaly2026Budget";


const MODULE_KEY =
  "budget";


let currentUser =
  null;


let budget =
  {
    totalBudget: "",
    currency: "TWD",
    expenses: []
  };


let cloudSaveTimer;


/* =========================
   HELPERS
========================= */

function makeId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function valueOf(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }


  return fallback;

}


function normalizeExpense(
  oldExpense = {}
) {

  return {

    ...oldExpense,

    id:
      valueOf(
        oldExpense,
        ["id"],
        makeId()
      ),

    title:
      valueOf(
        oldExpense,
        ["title", "name", "expense"]
      ),

    category:
      valueOf(
        oldExpense,
        ["category", "type"],
        "其他"
      ),

    date:
      valueOf(
        oldExpense,
        ["date"]
      ),

    amount:
      valueOf(
        oldExpense,
        ["amount", "price", "cost"]
      ),

    currency:
      valueOf(
        oldExpense,
        ["currency"],
        "TWD"
      ),

    rateToMain:
      valueOf(
        oldExpense,
        [
          "rateToMain",
          "exchangeRate",
          "rate"
        ],
        ""
      ),

    payment:
      valueOf(
        oldExpense,
        ["payment", "paymentMethod"]
      ),

    note:
      valueOf(
        oldExpense,
        ["note", "notes"]
      )

  };

}


function normalizeBudget(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return {
      totalBudget: "",
      currency: "TWD",
      expenses:
        data.map(normalizeExpense)
    };

  }


  if (!data) {

    return {
      totalBudget: "",
      currency: "TWD",
      expenses: []
    };

  }


  const source =
    data.budget &&
    typeof data.budget === "object"
      ? data.budget
      : data;


  const oldExpenses =
    valueOf(
      source,
      ["expenses", "items", "records"],
      []
    );


  return {

    totalBudget:
      valueOf(
        source,
        [
          "totalBudget",
          "budgetAmount",
          "total",
          "budget"
        ]
      ),

    currency:
      valueOf(
        source,
        [
          "currency",
          "mainCurrency"
        ],
        "TWD"
      ),

    expenses:
      Array.isArray(oldExpenses)
        ? oldExpenses.map(normalizeExpense)
        : []

  };

}


function newExpense() {

  return {

    id: makeId(),

    title: "",

    category: "其他",

    date: "",

    amount: "",

    currency:
      budget.currency || "TWD",

    rateToMain: "",

    payment: "",

    note: ""

  };

}


function numberValue(
  value
) {

  const number =
    Number(
      String(value || "")
        .replaceAll(",", "")
    );


  return Number.isFinite(number)
    ? number
    : 0;

}


function formatMoney(
  value
) {

  return Number(value)
    .toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits: 2
      }
    );

}


/* =========================
   CONVERSION
========================= */

function expenseRate(
  expense
) {

  if (
    expense.currency ===
    budget.currency
  ) {

    return 1;

  }


  const rate =
    numberValue(
      expense.rateToMain
    );


  if (
    rate <= 0
  ) {

    return null;

  }


  return rate;

}


function convertedExpenseAmount(
  expense
) {

  const amount =
    numberValue(
      expense.amount
    );


  const rate =
    expenseRate(
      expense
    );


  if (
    rate === null
  ) {

    return null;

  }


  return amount * rate;

}


/* =========================
   STATUS
========================= */

function setCloudStatus(
  text,
  type
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {
    dot.classList.add(type);
  }

}


function showBanner(
  text,
  type = "success"
) {

  const banner =
    document.getElementById(
      "syncBanner"
    );


  banner.textContent =
    text;


  banner.className =
    "sync-banner show " +
    type;


  setTimeout(
    () => {

      banner.className =
        "sync-banner";

    },
    5000
  );

}


/* =========================
   LOCAL
========================= */

function loadLocalBudget() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    return normalizeBudget(
      JSON.parse(raw)
    );

  }

  catch (
    error
  ) {

    console.error(error);

    return null;

  }

}


function saveLocalBudget() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(budget)
  );

}


/* =========================
   CLOUD
========================= */

async function loadCloudModule() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .select("data, updated_at")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function uploadBudgetNow() {

  if (!currentUser) {
    return;
  }


  saveLocalBudget();


  setCloudStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 2,
            budget: budget
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    console.error(error);


    setCloudStatus(
      "同步失敗",
      "error"
    );


    return;

  }


  setCloudStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleCloudSave() {

  saveLocalBudget();


  setCloudStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    cloudSaveTimer
  );


  cloudSaveTimer =
    setTimeout(
      uploadBudgetNow,
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initializeCloud() {

  setCloudStatus(
    "登入確認中…"
  );


  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    sessionData.session;


  if (!session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  const localBudget =
    loadLocalBudget();


  setCloudStatus(
    "讀取雲端…",
    "saving"
  );


  try {

    const cloudRow =
      await loadCloudModule();


    if (
      cloudRow &&
      cloudRow.data
    ) {

      budget =
        normalizeBudget(
          cloudRow.data
        );


      saveLocalBudget();


      setCloudStatus(
        "已同步 ☁️",
        "online"
      );


      showBanner(
        "☁️ 已載入旅行預算雲端資料。"
      );

    }

    else if (
      localBudget
    ) {

      budget =
        localBudget;


      await uploadBudgetNow();

    }

    else {

      budget =
        normalizeBudget(null);


      await uploadBudgetNow();

    }

  }

  catch (
    error
  ) {

    console.error(error);


    budget =
      localBudget ||
      normalizeBudget(null);


    setCloudStatus(
      "離線備份模式",
      "error"
    );

  }


  render();

}


/* =========================
   SUMMARY
========================= */

function updateSummary() {

  const mainCurrency =
    budget.currency || "TWD";


  const totalBudget =
    numberValue(
      budget.totalBudget
    );


  let spent =
    0;


  let missingRates =
    0;


  budget.expenses.forEach(
    expense => {

      const converted =
        convertedExpenseAmount(
          expense
        );


      if (
        converted === null
      ) {

        if (
          numberValue(
            expense.amount
          ) > 0
        ) {

          missingRates += 1;

        }

        return;

      }


      spent += converted;

    }
  );


  const remaining =
    totalBudget -
    spent;


  document.getElementById(
    "budgetDisplay"
  ).textContent =
    mainCurrency +
    " " +
    formatMoney(totalBudget);


  document.getElementById(
    "spentDisplay"
  ).textContent =
    mainCurrency +
    " " +
    formatMoney(spent);


  document.getElementById(
    "remainingDisplay"
  ).textContent =
    mainCurrency +
    " " +
    formatMoney(remaining);


  document.getElementById(
    "totalBudget"
  ).value =
    budget.totalBudget || "";


  document.getElementById(
    "mainCurrency"
  ).value =
    mainCurrency;


  const warning =
    document.getElementById(
      "rateWarning"
    );


  if (
    missingRates > 0
  ) {

    warning.className =
      "warning-box show";


    warning.textContent =
      "⚠️ 有 " +
      missingRates +
      " 筆外幣支出尚未填匯率，因此目前尚未計入上方「已花費 / 剩餘」。";

  }

  else {

    warning.className =
      "warning-box";

  }


  renderCurrencyTotals();

}


/* =========================
   ORIGINAL CURRENCY TOTALS
========================= */

function renderCurrencyTotals() {

  const totals = {};


  budget.expenses.forEach(
    expense => {

      const currency =
        expense.currency ||
        budget.currency ||
        "TWD";


      if (
        !totals[currency]
      ) {

        totals[currency] =
          0;

      }


      totals[currency] +=
        numberValue(
          expense.amount
        );

    }
  );


  const container =
    document.getElementById(
      "currencyTotals"
    );


  container.innerHTML =
    "";


  Object.entries(
    totals
  ).forEach(
    (
      [
        currency,
        value
      ]
    ) => {

      const chip =
        document.createElement(
          "div"
        );


      chip.className =
        "currency-chip";


      chip.innerHTML =
        `
          ${escapeHtml(currency)}
          <strong>
            ${formatMoney(value)}
          </strong>
        `;


      container.appendChild(
        chip
      );

    }
  );

}


/* =========================
   RENDER
========================= */

function render() {

  updateSummary();


  const container =
    document.getElementById(
      "expenseList"
    );


  container.innerHTML =
    "";


  if (
    budget.expenses.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          <div class="empty-icon">
            💰
          </div>

          <strong>
            還沒有支出
          </strong>

          按「＋ 新增支出」開始記帳。

        </div>
      `;


    return;

  }


  budget.expenses.forEach(
    (
      expense,
      index
    ) => {

      container.appendChild(
        createExpenseCard(
          expense,
          index
        )
      );

    }
  );

}


/* =========================
   EXPENSE CARD
========================= */

function createExpenseCard(
  expense,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "expense-card";


  const sameCurrency =
    expense.currency ===
    budget.currency;


  const converted =
    convertedExpenseAmount(
      expense
    );


  card.innerHTML =
    `

      <div class="expense-top">

        <input
          class="expense-title"
          placeholder="支出名稱"
          value="${escapeAttribute(expense.title)}"
        >


        <button
          class="delete-button"
        >
          ×
        </button>

      </div>


      <div class="grid">


        <div class="field-wrap">

          <label>
            分類
          </label>

          <select class="field category">
            ${categoryOptions(expense.category)}
          </select>

        </div>


        <div class="field-wrap">

          <label>
            日期
          </label>

          <input
            class="field date"
            type="date"
            value="${escapeAttribute(expense.date)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            付款方式
          </label>

          <input
            class="field payment"
            placeholder="現金 / 信用卡"
            value="${escapeAttribute(expense.payment)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            金額
          </label>

          <input
            class="field amount"
            inputmode="decimal"
            placeholder="0"
            value="${escapeAttribute(expense.amount)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            支出幣別
          </label>

          <select class="field currency">
            ${currencyOptions(expense.currency)}
          </select>

        </div>


        <div class="field-wrap">

          <label>
            ${
              sameCurrency
                ? "匯率（同幣別自動 = 1）"
                : "1 " +
                  escapeHtml(expense.currency) +
                  " = ? " +
                  escapeHtml(budget.currency)
            }
          </label>

          <input
            class="field rateToMain"
            inputmode="decimal"
            placeholder="${
              sameCurrency
                ? "1"
                : "例如：36"
            }"
            value="${
              sameCurrency
                ? "1"
                : escapeAttribute(expense.rateToMain)
            }"
            ${sameCurrency ? "disabled" : ""}
          >

        </div>


        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field note"
            placeholder="付款對象、訂單編號、分攤方式……"
          >${escapeHtml(expense.note)}</textarea>

        </div>

      </div>


      <div
        class="conversion-box ${
          converted === null
            ? "missing"
            : ""
        }"
      >

        ${
          converted === null
            ? `
              ⚠️ 請填匯率後才會計入總預算。
            `
            : `
              換算後：
              <strong>
                ${escapeHtml(budget.currency)}
                ${formatMoney(converted)}
              </strong>
            `
        }

      </div>


      <div class="actions">

        <button
          class="action-button moveUp"
        >
          ↑ 上移
        </button>


        <button
          class="action-button moveDown"
        >
          ↓ 下移
        </button>

      </div>

    `;


  bindInput(
    card,
    ".expense-title",
    expense,
    "title"
  );


  bindInput(
    card,
    ".date",
    expense,
    "date"
  );


  bindInput(
    card,
    ".payment",
    expense,
    "payment"
  );


  bindInput(
    card,
    ".note",
    expense,
    "note"
  );


  const amount =
    card.querySelector(
      ".amount"
    );


  amount.oninput =
    () => {

      expense.amount =
        amount.value;


      scheduleCloudSave();

      updateSummary();

      updateConversionBox(
        card,
        expense
      );

    };


  const category =
    card.querySelector(
      ".category"
    );


  category.onchange =
    () => {

      expense.category =
        category.value;


      scheduleCloudSave();

    };


  const currency =
    card.querySelector(
      ".currency"
    );


  currency.onchange =
    () => {

      expense.currency =
        currency.value;


      scheduleCloudSave();

      render();

    };


  const rate =
    card.querySelector(
      ".rateToMain"
    );


  rate.oninput =
    () => {

      expense.rateToMain =
        rate.value;


      scheduleCloudSave();

      updateSummary();

      updateConversionBox(
        card,
        expense
      );

    };


  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這筆支出嗎？"
        );


      if (!okay) {
        return;
      }


      budget.expenses.splice(
        index,
        1
      );


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveUp"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      [
        budget.expenses[index - 1],
        budget.expenses[index]
      ] =
      [
        budget.expenses[index],
        budget.expenses[index - 1]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveDown"
  ).onclick =
    () => {

      if (
        index ===
        budget.expenses.length - 1
      ) {
        return;
      }


      [
        budget.expenses[index],
        budget.expenses[index + 1]
      ] =
      [
        budget.expenses[index + 1],
        budget.expenses[index]
      ];


      scheduleCloudSave();

      render();

    };


  return card;

}


/* =========================
   CONVERSION BOX
========================= */

function updateConversionBox(
  card,
  expense
) {

  const box =
    card.querySelector(
      ".conversion-box"
    );


  const converted =
    convertedExpenseAmount(
      expense
    );


  if (
    converted === null
  ) {

    box.className =
      "conversion-box missing";


    box.innerHTML =
      "⚠️ 請填匯率後才會計入總預算。";

  }

  else {

    box.className =
      "conversion-box";


    box.innerHTML =
      `
        換算後：
        <strong>
          ${escapeHtml(budget.currency)}
          ${formatMoney(converted)}
        </strong>
      `;

  }

}


/* =========================
   BIND
========================= */

function bindInput(
  card,
  selector,
  object,
  key
) {

  const element =
    card.querySelector(
      selector
    );


  element.oninput =
    () => {

      object[key] =
        element.value;


      scheduleCloudSave();

    };

}


/* =========================
   MAIN BUDGET
========================= */

document.getElementById(
  "totalBudget"
).oninput =
  event => {

    budget.totalBudget =
      event.target.value;


    scheduleCloudSave();

    updateSummary();

  };


document.getElementById(
  "mainCurrency"
).onchange =
  event => {

    budget.currency =
      event.target.value;


    scheduleCloudSave();

    render();

  };


/* =========================
   ADD
========================= */

document.getElementById(
  "addExpense"
).onclick =
  () => {

    budget.expenses.push(
      newExpense()
    );


    scheduleCloudSave();

    render();

  };


/* =========================
   OPTIONS
========================= */

function categoryOptions(
  selected
) {

  const categories =
    [
      "住宿",
      "交通",
      "租車",
      "油資",
      "停車",
      "票券",
      "餐飲",
      "購物",
      "保險",
      "其他"
    ];


  if (
    selected &&
    !categories.includes(selected)
  ) {

    categories.push(selected);

  }


  return categories
    .map(
      category =>
        `
          <option
            value="${escapeAttribute(category)}"
            ${
              category === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(category)}
          </option>
        `
    )
    .join("");

}


function currencyOptions(
  selected
) {

  const currencies =
    [
      "TWD",
      "EUR",
      "USD",
      "GBP",
      "AUD",
      "JPY",
      "CNY"
    ];


  if (
    selected &&
    !currencies.includes(selected)
  ) {

    currencies.push(selected);

  }


  return currencies
    .map(
      currency =>
        `
          <option
            value="${escapeAttribute(currency)}"
            ${
              currency === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(currency)}
          </option>
        `
    )
    .join("");

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(
  text = ""
) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(
  text = ""
) {

  return escapeHtml(text);

}


/* =========================
   START
========================= */

initializeCloud();

</script>

</html>
