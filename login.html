<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>登入｜Travel Hub</title>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #827d75;
      --line: #e8e2d9;
      --accent: #9a7350;
      --accent-soft: #eee4d8;
      --dark: #2e2d29;
      --green-soft: #e7eee7;
      --red-soft: #f3e4e2;
      --shadow: 0 12px 40px rgba(52,45,36,0.08);
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: grid;
      place-items: center;

      padding: 24px;

      background:
        linear-gradient(
          rgba(244,241,235,0.82),
          rgba(244,241,235,0.92)
        ),
        url(
          "https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=1600&q=80"
        )
        center / cover;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    }

    input,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(430px, 100%);
    }

    .logo {
      width: 58px;
      height: 58px;

      margin: 0 auto 15px;

      display: grid;
      place-items: center;

      border-radius: 19px;

      background: white;

      box-shadow: var(--shadow);

      font-size: 28px;
    }

    .brand {
      margin-bottom: 20px;

      text-align: center;
    }

    .brand h1 {
      margin: 0 0 5px;

      font-size: 29px;
    }

    .brand p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
    }

    .card {
      background: rgba(255,255,255,0.96);

      border-radius: 27px;

      padding: 22px;

      box-shadow: var(--shadow);

      backdrop-filter: blur(16px);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel h2 {
      margin: 0 0 5px;

      font-size: 21px;
    }

    .panel-description {
      margin: 0 0 18px;

      color: var(--muted);

      font-size: 12px;

      line-height: 1.6;
    }

    .field-wrap {
      display: grid;

      gap: 5px;

      margin-top: 11px;
    }

    label {
      color: var(--muted);

      font-size: 11px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 14px;

      padding: 12px 13px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #bba58f;

      background: white;
    }

    .primary {
      width: 100%;

      margin-top: 15px;

      border: 0;

      border-radius: 14px;

      padding: 12px;

      background: var(--dark);

      color: white;

      font-weight: 750;
    }

    .secondary {
      width: 100%;

      margin-top: 8px;

      border: 0;

      border-radius: 14px;

      padding: 11px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 700;
    }

    .text-button {
      width: 100%;

      margin-top: 10px;

      border: 0;

      background: transparent;

      color: var(--muted);

      font-size: 12px;
    }

    button:disabled {
      opacity: 0.55;

      cursor: default;
    }

    .message {
      display: none;

      margin-top: 14px;

      padding: 11px 12px;

      border-radius: 13px;

      font-size: 12px;

      line-height: 1.55;
    }

    .message.success {
      display: block;

      background: var(--green-soft);

      color: #536755;
    }

    .message.error {
      display: block;

      background: var(--red-soft);

      color: #8b504b;
    }

    .account-box {
      margin-top: 15px;

      padding: 14px;

      border-radius: 15px;

      background: #f6f3ee;
    }

    .account-label {
      color: var(--muted);

      font-size: 10px;
    }

    .account-email {
      margin-top: 4px;

      word-break: break-all;

      font-size: 13px;

      font-weight: 700;
    }

    .hub-button {
      display: block;

      margin-top: 15px;

      padding: 12px;

      border-radius: 14px;

      text-align: center;

      background: var(--dark);

      color: white;

      font-weight: 750;

      font-size: 13px;
    }

    .security-note {
      margin-top: 15px;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.55;

      text-align: center;
    }

  </style>

</head>



<body>


<div class="shell">


  <div class="brand">

    <div class="logo">
      ✈️
    </div>

    <h1>
      Travel Hub
    </h1>

    <p>
      Italy 2026 · Private Travel Planner
    </p>

  </div>



  <div class="card">


    <!-- LOGIN -->

    <section
      class="panel active"
      id="loginPanel"
    >

      <h2>
        登入
      </h2>

      <p class="panel-description">
        使用你的 Travel Hub 帳號登入。
      </p>


      <div class="field-wrap">

        <label>
          Email
        </label>

        <input
          class="field"
          id="email"
          type="email"
          autocomplete="email"
          placeholder="你的 Email"
        >

      </div>


      <div class="field-wrap">

        <label>
          密碼
        </label>

        <input
          class="field"
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="你的密碼"
        >

      </div>


      <button
        class="primary"
        id="loginButton"
      >
        登入 Travel Hub
      </button>


      <button
        class="secondary"
        id="resetButton"
      >
        ✉️ 建立 / 重設密碼
      </button>


      <div
        class="message"
        id="loginMessage"
      ></div>

    </section>




    <!-- RECOVERY -->

    <section
      class="panel"
      id="recoveryPanel"
    >

      <h2>
        設定新密碼
      </h2>

      <p class="panel-description">
        Recovery 驗證成功。現在可以設定 Travel Hub 的登入密碼。
      </p>


      <div class="field-wrap">

        <label>
          新密碼
        </label>

        <input
          class="field"
          id="newPassword"
          type="password"
          autocomplete="new-password"
          placeholder="至少 8 個字元"
        >

      </div>


      <div class="field-wrap">

        <label>
          再輸入一次
        </label>

        <input
          class="field"
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="再次輸入新密碼"
        >

      </div>


      <button
        class="primary"
        id="savePasswordButton"
      >
        🔐 儲存新密碼
      </button>


      <div
        class="message"
        id="recoveryMessage"
      ></div>

    </section>




    <!-- LOGGED IN -->

    <section
      class="panel"
      id="accountPanel"
    >

      <h2>
        已登入 ✓
      </h2>

      <p class="panel-description">
        這個瀏覽器已經有 Travel Hub 登入狀態。
      </p>


      <div class="account-box">

        <div class="account-label">
          登入帳號
        </div>

        <div
          class="account-email"
          id="accountEmail"
        >
          -
        </div>

      </div>


      <a
        class="hub-button"
        href="index.html"
      >
        🏠 開啟 Travel Hub
      </a>


      <button
        class="secondary"
        id="changePasswordButton"
      >
        🔑 變更密碼
      </button>


      <button
        class="text-button"
        id="logoutButton"
      >
        登出
      </button>


      <div
        class="message"
        id="accountMessage"
      ></div>

    </section>


  </div>


  <div class="security-note">
    🔒 Travel Hub 使用 Supabase Authentication。<br>
    密碼不會儲存在 GitHub 網站程式碼中。
  </div>


</div>



<script>


const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const RECOVERY_REDIRECT =
  "https://10jleosvuess.github.io/travel-hub/login.html?mode=recovery";



const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );



const loginPanel =
  document.getElementById(
    "loginPanel"
  );


const recoveryPanel =
  document.getElementById(
    "recoveryPanel"
  );


const accountPanel =
  document.getElementById(
    "accountPanel"
  );



function showPanel(
  panel
) {

  loginPanel.classList.remove(
    "active"
  );

  recoveryPanel.classList.remove(
    "active"
  );

  accountPanel.classList.remove(
    "active"
  );


  panel.classList.add(
    "active"
  );

}



function setMessage(
  elementId,
  text,
  type = "success"
) {

  const element =
    document.getElementById(
      elementId
    );


  element.className =
    "message " +
    type;


  element.textContent =
    text;

}



function clearMessage(
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  element.className =
    "message";


  element.textContent =
    "";

}



function showAccount(
  user
) {

  document.getElementById(
    "accountEmail"
  ).textContent =
    user?.email ||
    "已登入";


  showPanel(
    accountPanel
  );

}



function showRecovery() {

  clearMessage(
    "recoveryMessage"
  );


  showPanel(
    recoveryPanel
  );


  setTimeout(
    () => {

      document.getElementById(
        "newPassword"
      ).focus();

    },
    100
  );

}



/* -------------------------
   LOGIN
------------------------- */


document.getElementById(
  "loginButton"
).onclick =
  async () => {

    clearMessage(
      "loginMessage"
    );


    const email =
      document.getElementById(
        "email"
      )
      .value
      .trim();


    const password =
      document.getElementById(
        "password"
      )
      .value;


    if (
      !email ||
      !password
    ) {

      setMessage(
        "loginMessage",
        "請輸入 Email 和密碼。",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;


    button.textContent =
      "登入中…";


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword(
          {
            email,
            password
          }
        );


    button.disabled =
      false;


    button.textContent =
      "登入 Travel Hub";


    if (error) {

      setMessage(
        "loginMessage",
        "登入失敗：" +
        error.message,
        "error"
      );

      return;

    }


    showAccount(
      data.user
    );

  };



/* -------------------------
   SEND RESET / SET PASSWORD
------------------------- */


document.getElementById(
  "resetButton"
).onclick =
  async () => {

    clearMessage(
      "loginMessage"
    );


    const email =
      document.getElementById(
        "email"
      )
      .value
      .trim();


    if (!email) {

      setMessage(
        "loginMessage",
        "先在上面輸入你剛剛邀請的 Email。",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "resetButton"
      );


    button.disabled =
      true;


    button.textContent =
      "寄送中…";


    const {
      error
    } =
      await supabaseClient
        .auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo:
              RECOVERY_REDIRECT
          }
        );


    button.disabled =
      false;


    button.textContent =
      "✉️ 建立 / 重設密碼";


    if (error) {

      setMessage(
        "loginMessage",
        "寄送失敗：" +
        error.message,
        "error"
      );

      return;

    }


    setMessage(
      "loginMessage",
      "✅ 已寄出設定密碼 Email。請去信箱點連結，再回到這個網站設定新密碼。",
      "success"
    );

  };



/* -------------------------
   SAVE NEW PASSWORD
------------------------- */


document.getElementById(
  "savePasswordButton"
).onclick =
  async () => {

    clearMessage(
      "recoveryMessage"
    );


    const password =
      document.getElementById(
        "newPassword"
      ).value;


    const confirm =
      document.getElementById(
        "confirmPassword"
      ).value;


    if (
      password.length <
      8
    ) {

      setMessage(
        "recoveryMessage",
        "密碼至少設定 8 個字元。",
        "error"
      );

      return;

    }


    if (
      password !==
      confirm
    ) {

      setMessage(
        "recoveryMessage",
        "兩次輸入的密碼不同。",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "savePasswordButton"
      );


    button.disabled =
      true;


    button.textContent =
      "儲存中…";


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .updateUser(
          {
            password
          }
        );


    button.disabled =
      false;


    button.textContent =
      "🔐 儲存新密碼";


    if (error) {

      setMessage(
        "recoveryMessage",
        "設定失敗：" +
        error.message,
        "error"
      );

      return;

    }


    history.replaceState(
      {},
      document.title,
      "login.html"
    );


    showAccount(
      data.user
    );


    setMessage(
      "accountMessage",
      "✅ 密碼設定完成。",
      "success"
    );

  };



/* -------------------------
   CHANGE PASSWORD
------------------------- */


document.getElementById(
  "changePasswordButton"
).onclick =
  () => {

    showRecovery();

  };



/* -------------------------
   LOGOUT
------------------------- */


document.getElementById(
  "logoutButton"
).onclick =
  async () => {

    await supabaseClient
      .auth
      .signOut();


    document.getElementById(
      "password"
    ).value =
      "";


    showPanel(
      loginPanel
    );

  };



/* -------------------------
   AUTH EVENTS
------------------------- */


supabaseClient
  .auth
  .onAuthStateChange(
    (
      event,
      session
    ) => {


      if (
        event ===
        "PASSWORD_RECOVERY"
      ) {

        showRecovery();

        return;

      }


      if (
        event ===
        "SIGNED_OUT"
      ) {

        showPanel(
          loginPanel
        );

      }

    }
  );



/* -------------------------
   INITIAL CHECK
------------------------- */


async function initialize() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const recoveryMode =
    params.get(
      "mode"
    ) ===
    "recovery";


  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    data.session;


  if (
    recoveryMode &&
    session
  ) {

    showRecovery();

    return;

  }


  if (session) {

    showAccount(
      session.user
    );

    return;

  }


  showPanel(
    loginPanel
  );

}



initialize();


</script>


</body>

</html>
