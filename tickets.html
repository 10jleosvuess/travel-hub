<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>票券｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --blue-soft: #e6edf3;
      --red-soft: #f3e3e1;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .page-head p {
      margin: 0;
      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .banner.show {
      display: block;
    }

    .banner.success {
      background: var(--green-soft);
    }

    .banner.error {
      background: var(--red-soft);
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;

      padding: 18px;

      border-radius: 23px;

      background: var(--dark);
      color: white;

      box-shadow: var(--shadow);
    }

    .summary small {
      color: rgba(255,255,255,0.65);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 11px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;

      white-space: nowrap;
    }

    .ticket-list {
      display: grid;
      gap: 14px;
    }

    .ticket-card {
      padding: 17px;

      border-radius: 22px;

      background: white;

      box-shadow: var(--shadow);
    }

    .ticket-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      gap: 11px;

      align-items: center;
    }

    .ticket-number {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;
    }

    .ticket-name {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;
    }

    .delete-ticket {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 21px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 9px;

      margin-top: 14px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 75px;

      resize: vertical;

      line-height: 1.5;
    }

    .section-title {
      grid-column: 1 / -1;

      margin-top: 5px;
      padding-top: 12px;

      border-top: 1px solid var(--line);

      font-size: 12px;
      font-weight: 800;
    }

    .private-files {
      grid-column: 1 / -1;

      display: grid;
      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .file-box {
      padding: 13px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: #f8f6f2;
    }

    .file-box strong {
      display: block;
      margin-bottom: 5px;

      font-size: 13px;
    }

    .file-status {
      min-height: 32px;

      margin-bottom: 9px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.5;

      word-break: break-word;
    }

    .file-input {
      display: block;

      width: 100%;

      font-size: 11px;
    }

    .file-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 9px;
    }

    .file-button {
      border: 0;

      border-radius: 9px;

      padding: 8px 10px;

      background: var(--blue-soft);

      font-size: 10px;
    }

    .file-button.delete {
      background: var(--red-soft);
      color: var(--danger);
    }

    .legacy {
      margin-top: 8px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.5;
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;
      padding-top: 12px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-button {
      background: var(--green-soft);
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .privacy {
      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 15px;

      background: var(--green-soft);

      color: #536553;

      font-size: 11px;
      line-height: 1.6;
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;
      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 650px) {

      .grid,
      .private-files {
        grid-template-columns: 1fr;
      }

      .full,
      .section-title,
      .private-files {
        grid-column: auto;
      }

    }
  </style>
</head>

<script>

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


const STORAGE_KEY =
  "travelHubItaly2026Tickets";


const MODULE_KEY =
  "tickets";


const BUCKET =
  "travel-private";


let currentUser =
  null;


let tickets =
  [];


let saveTimer =
  null;



/* =========================
   SAFE VALUES
========================= */

function text(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  if (
    typeof value === "object"
  ) {

    try {

      return JSON.stringify(
        value
      );

    }

    catch {

      return "";

    }

  }


  return String(value);

}


function first(
  object,
  keys,
  fallback = ""
) {

  if (!object) {
    return fallback;
  }


  for (
    const key of keys
  ) {

    if (
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }


  return fallback;

}


function makeId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function normalizeTicket(
  old
) {

  const source =
    (
      old &&
      typeof old === "object"
    )
      ? old
      : {};


  return {

    ...source,

    id:
      text(
        first(
          source,
          ["id"],
          makeId()
        )
      ),

    name:
      text(
        first(
          source,
          ["name","title","ticketName"]
        )
      ),

    location:
      text(
        first(
          source,
          ["location","place","city"]
        )
      ),

    date:
      text(
        first(
          source,
          ["date","visitDate"]
        )
      ),

    time:
      text(
        first(
          source,
          ["time","visitTime"]
        )
      ),

    people:
      text(
        first(
          source,
          ["people","persons","guests"]
        )
      ),

    status:
      text(
        first(
          source,
          ["status"],
          "已預訂"
        )
      ),

    payment:
      text(
        first(
          source,
          ["payment","paymentStatus"]
        )
      ),

    orderNo:
      text(
        first(
          source,
          [
            "orderNo",
            "order",
            "bookingNo",
            "confirmation"
          ]
        )
      ),

    amount:
      text(
        first(
          source,
          ["amount","price"]
        )
      ),

    currency:
      text(
        first(
          source,
          ["currency"],
          "EUR"
        )
      ) || "EUR",

    arriveEarly:
      text(
        first(
          source,
          [
            "arriveEarly",
            "early",
            "arrival"
          ]
        )
      ),

    maps:
      text(
        first(
          source,
          [
            "maps",
            "map",
            "mapLink"
          ]
        )
      ),

    note:
      text(
        first(
          source,
          [
            "note",
            "notes"
          ]
        )
      ),

    documentPath:
      text(
        first(
          source,
          ["documentPath"]
        )
      ),

    documentName:
      text(
        first(
          source,
          ["documentName"]
        )
      ),

    qrPath:
      text(
        first(
          source,
          ["qrPath"]
        )
      ),

    qrName:
      text(
        first(
          source,
          ["qrName"]
        )
      ),

    documentLink:
      text(
        first(
          source,
          [
            "documentLink",
            "pdf",
            "pdfLink"
          ]
        )
      ),

    qrLink:
      text(
        first(
          source,
          [
            "qrLink",
            "qr"
          ]
        )
      )

  };

}


function normalizeTickets(
  data
) {

  let list =
    [];


  if (
    Array.isArray(data)
  ) {

    list =
      data;

  }

  else if (
    data &&
    Array.isArray(data.tickets)
  ) {

    list =
      data.tickets;

  }


  return list.map(
    normalizeTicket
  );

}


function newTicket() {

  return normalizeTicket({
    id: makeId(),
    people: "4",
    currency: "EUR",
    status: "已預訂"
  });

}



/* =========================
   ESCAPE
========================= */

function escapeHtml(
  value
) {

  return text(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================
   STATUS
========================= */

function setStatus(
  message,
  type = ""
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    message;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {

    dot.classList.add(
      type
    );

  }

}


function showBanner(
  message,
  type = "success"
) {

  const box =
    document.getElementById(
      "banner"
    );


  box.textContent =
    message;


  box.className =
    "banner show " +
    type;


  setTimeout(
    () => {

      box.className =
        "banner";

    },
    5000
  );

}



/* =========================
   LOCAL
========================= */

function loadLocal() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    return normalizeTickets(
      JSON.parse(raw)
    );

  }

  catch {

    return null;

  }

}


function saveLocal() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tickets)
  );

}



/* =========================
   SUPABASE DATA
========================= */

async function loadCloud() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .select(
        "data"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function saveCloud() {

  if (!currentUser) {
    return;
  }


  saveLocal();


  setStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .upsert(
        {
          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 3,
            tickets: tickets
          },

          updated_at:
            new Date()
              .toISOString()
        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    setStatus(
      "同步失敗",
      "error"
    );


    throw error;

  }


  setStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleSave() {

  saveLocal();


  setStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      () => {

        saveCloud()
          .catch(
            error => {

              console.error(
                error
              );


              showBanner(
                "雲端同步失敗。",
                "error"
              );

            }
          );

      },
      650
    );

}



/* =========================
   START
========================= */

async function initialize() {

  try {

    setStatus(
      "登入確認中…"
    );


    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      !data.session
    ) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    setStatus(
      "讀取雲端…",
      "saving"
    );


    const local =
      loadLocal();


    const row =
      await loadCloud();


    if (
      row &&
      row.data
    ) {

      tickets =
        normalizeTickets(
          row.data
        );


      saveLocal();

    }

    else if (
      local
    ) {

      tickets =
        local;


      await saveCloud();

    }

    else {

      tickets =
        [];


      await saveCloud();

    }


    render();


    setStatus(
      "已同步 ☁️",
      "online"
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    const local =
      loadLocal();


    tickets =
      local ||
      [];


    try {

      render();

    }

    catch (
      renderError
    ) {

      console.error(
        renderError
      );

    }


    setStatus(
      "載入發生錯誤",
      "error"
    );


    showBanner(
      "⚠️ 頁面載入時發生錯誤，但原本票券資料沒有被刪除。",
      "error"
    );

  }

}



/* =========================
   OPTIONS
========================= */

function optionList(
  values,
  selected
) {

  const list =
    [...values];


  if (
    selected &&
    !list.includes(
      selected
    )
  ) {

    list.push(
      selected
    );

  }


  return list
    .map(
      value =>
        `
          <option
            value="${escapeHtml(value)}"
            ${
              value === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(value)}
          </option>
        `
    )
    .join("");

}



/* =========================
   RENDER
========================= */

function render() {

  document.getElementById(
    "ticketCount"
  ).textContent =
    tickets.length +
    " 張票券";


  const container =
    document.getElementById(
      "ticketList"
    );


  if (
    tickets.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">
          <div style="font-size:40px">
            🎫
          </div>

          <strong>
            還沒有票券
          </strong>

          <div>
            按上面的「＋ 新增票券」開始建立。
          </div>
        </div>
      `;


    return;

  }


  container.innerHTML =
    tickets
      .map(
        (
          ticket,
          index
        ) =>
          ticketHtml(
            ticket,
            index
          )
      )
      .join("");

}


function ticketHtml(
  ticket,
  index
) {

  return `

    <section
      class="ticket-card"
      data-index="${index}"
    >

      <div class="ticket-top">

        <div class="ticket-number">
          ${index + 1}
        </div>


        <input
          class="ticket-name"
          data-field="name"
          value="${escapeHtml(ticket.name)}"

/* =========================
   EDIT EVENTS
========================= */

const ticketList =
  document.getElementById(
    "ticketList"
  );


function eventTicket(
  target
) {

  const card =
    target.closest(
      ".ticket-card"
    );


  if (!card) {
    return null;
  }


  const index =
    Number(
      card.dataset.index
    );


  if (
    !Number.isInteger(index) ||
    !tickets[index]
  ) {

    return null;

  }


  return {
    card,
    index,
    ticket:
      tickets[index]
  };

}


ticketList.addEventListener(
  "input",
  event => {

    const field =
      event.target.dataset.field;


    if (!field) {
      return;
    }


    const info =
      eventTicket(
        event.target
      );


    if (!info) {
      return;
    }


    info.ticket[field] =
      event.target.value;


    scheduleSave();

  }
);


ticketList.addEventListener(
  "change",
  async event => {

    const field =
      event.target.dataset.field;


    if (field) {

      const info =
        eventTicket(
          event.target
        );


      if (info) {

        info.ticket[field] =
          event.target.value;


        scheduleSave();

      }


      return;

    }


    const kind =
      event.target.dataset.upload;


    if (!kind) {
      return;
    }


    const info =
      eventTicket(
        event.target
      );


    if (!info) {
      return;
    }


    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    await uploadPrivateFile(
      info.ticket,
      kind,
      file
    );

  }
);



/* =========================
   STORAGE
========================= */

function safeFileName(
  value
) {

  return text(value || "file")
    .replaceAll("/", "-")
    .replaceAll("\\", "-")
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


async function uploadPrivateFile(
  ticket,
  kind,
  file
) {

  try {

    setStatus(
      "檔案上傳中…",
      "saving"
    );


    const path =
      currentUser.id +
      "/tickets/" +
      ticket.id +
      "/" +
      kind +
      "/" +
      Date.now() +
      "-" +
      makeId() +
      "-" +
      safeFileName(
        file.name
      );


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            cacheControl: "3600"
          }
        );


    if (error) {
      throw error;
    }


    const oldPath =
      kind === "document"
        ?
        ticket.documentPath
        :
        ticket.qrPath;


    if (
      kind === "document"
    ) {

      ticket.documentPath =
        path;


      ticket.documentName =
        file.name;

    }

    else {

      ticket.qrPath =
        path;


      ticket.qrName =
        file.name;

    }


    await saveCloud();


    if (
      oldPath &&
      oldPath !== path
    ) {

      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .remove([
          oldPath
        ]);

    }


    render();


    showBanner(
      "🔒 私人檔案已成功上傳。"
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    setStatus(
      "檔案上傳失敗",
      "error"
    );


    showBanner(
      "⚠️ 檔案上傳失敗。",
      "error"
    );

  }

}


async function openPrivateFile(
  path
) {

  if (!path) {
    return false;
  }


  const newWindow =
    window.open(
      "about:blank",
      "_blank"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .createSignedUrl(
          path,
          600
        );


    if (error) {
      throw error;
    }


    if (
      newWindow
    ) {

      newWindow.location =
        data.signedUrl;

    }

    else {

      location.href =
        data.signedUrl;

    }


    return true;

  }

  catch (
    error
  ) {

    console.error(error);


    if (
      newWindow
    ) {

      newWindow.close();

    }


    showBanner(
      "⚠️ 無法開啟私人檔案。",
      "error"
    );


    return false;

  }

}


async function deletePrivateFile(
  ticket,
  kind
) {

  const path =
    kind === "document"
      ?
      ticket.documentPath
      :
      ticket.qrPath;


  if (!path) {

    showBanner(
      "目前沒有檔案。",
      "error"
    );


    return;

  }


  if (
    !confirm(
      "確定刪除這個私人檔案嗎？"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        BUCKET
      )
      .remove([
        path
      ]);


  if (error) {

    console.error(error);


    showBanner(
      "刪除失敗。",
      "error"
    );


    return;

  }


  if (
    kind === "document"
  ) {

    ticket.documentPath =
      "";

    ticket.documentName =
      "";

  }

  else {

    ticket.qrPath =
      "";

    ticket.qrName =
      "";

  }


  await saveCloud();


  render();

}



/* =========================
   BUTTON EVENTS
========================= */

ticketList.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if (!button) {
      return;
    }


    const info =
      eventTicket(
        button
      );


    if (!info) {
      return;
    }


    const {
      ticket,
      index
    } =
      info;


    const action =
      button.dataset.action;


    if (
      action === "map"
    ) {

      if (
        ticket.maps
      ) {

        window.open(
          ticket.maps,
          "_blank",
          "noopener"
        );


        return;

      }


      const query =
        ticket.location ||
        ticket.name;


      if (!query) {

        alert(
          "請先填地點。"
        );


        return;

      }


      window.open(
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query),
        "_blank",
        "noopener"
      );


      return;

    }


    if (
      action === "open-document"
    ) {

      if (
        ticket.documentPath
      ) {

        await openPrivateFile(
          ticket.documentPath
        );


        return;

      }


      if (
        ticket.documentLink
      ) {

        window.open(
          ticket.documentLink,
          "_blank",
          "noopener"
        );


        return;

      }


      alert(
        "還沒有電子票。"
      );


      return;

    }


    if (
      action === "open-qr"
    ) {

      if (
        ticket.qrPath
      ) {

        await openPrivateFile(
          ticket.qrPath
        );


        return;

      }


      if (
        ticket.qrLink
      ) {

        window.open(
          ticket.qrLink,
          "_blank",
          "noopener"
        );


        return;

      }


      alert(
        "還沒有 QR Code。"
      );


      return;

    }


    if (
      action === "delete-document"
    ) {

      await deletePrivateFile(
        ticket,
        "document"
      );


      return;

    }


    if (
      action === "delete-qr"
    ) {

      await deletePrivateFile(
        ticket,
        "qr"
      );


      return;

    }


    if (
      action === "up"
    ) {

      if (
        index === 0
      ) {
        return;
      }


      [
        tickets[index - 1],
        tickets[index]
      ] =
      [
        tickets[index],
        tickets[index - 1]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "down"
    ) {

      if (
        index >=
        tickets.length - 1
      ) {
        return;
      }


      [
        tickets[index],
        tickets[index + 1]
      ] =
      [
        tickets[index + 1],
        tickets[index]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "delete-ticket"
    ) {

      if (
        !confirm(
          "確定刪除這張票券嗎？"
        )
      ) {

        return;

      }


      const paths =
        [
          ticket.documentPath,
          ticket.qrPath
        ]
        .filter(Boolean);


      if (
        paths.length
      ) {

        await supabaseClient
          .storage
          .from(
            BUCKET
          )
          .remove(
            paths
          );

      }


      tickets.splice(
        index,
        1
      );


      await saveCloud();


      render();

    }

  }
);



/* =========================
   ADD
========================= */

document.getElementById(
  "addTicket"
).onclick =
  () => {

    tickets.push(
      newTicket()
    );


    scheduleSave();

    render();

  };



initialize();
