<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {

    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --blue-soft: #e6edf3;
      --red-soft: #f3e3e1;

    }

    body {
      margin: 0;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {

    }

    a {

      text-decoration: none;
    }

      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

    .back-icon {

      display: grid;
      place-items: center;

      background: white;

      border-radius: 14px;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {

    }

    .save-status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .page-head p {
      margin: 0;

    }

    .sync-banner {
      display: none;

      margin-bottom: 12px;
      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .sync-banner.show {
      display: block;
    }

    .sync-banner.success {
      background: var(--green-soft);
    }

    .sync-banner.error {
      background: var(--red-soft);
    }

    .summary {
      background: var(--dark);
      color: white;

      border-radius: 23px;

      padding: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;

      box-shadow: var(--shadow);
    }

    .summary small {
      color: rgba(255,255,255,0.65);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .add-button {
      border: 0;

      padding: 11px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;

      white-space: nowrap;
    }

    .ticket-list {
      display: grid;
      gap: 14px;
    }

    .ticket-card {
      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow: var(--shadow);
    }

    .ticket-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 11px;
    }

    .ticket-number {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;
    }

    .ticket-name {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 21px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 9px;

      margin-top: 14px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 10px;
      color: var(--muted);
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 75px;

      resize: vertical;

      line-height: 1.5;
    }

    .section-title {
      grid-column: 1 / -1;

      margin-top: 5px;
      padding-top: 12px;

      border-top: 1px solid var(--line);

      font-size: 12px;
      font-weight: 800;
    }

    .private-files {
      grid-column: 1 / -1;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;
    }

    .file-box {
      padding: 12px;

    }

    .file-box strong {

    }

    .file-status {
      min-height: 18px;

      margin-bottom: 8px;

      color: var(--muted);

      font-size: 10px;

      word-break: break-all;
    }

    .file-input {
      width: 100%;

      font-size: 11px;
    }

    .file-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 9px;
    }

    .file-button {
      border: 0;

      border-radius: 9px;

      padding: 7px 9px;

      background: var(--blue-soft);

      font-size: 10px;
    }

    .file-button.delete {
      background: var(--red-soft);
      color: var(--danger);
    }

    .legacy-note {
      margin-top: 7px;

      color: var(--muted);

      font-size: 10px;
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;
      padding-top: 12px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-button {
      background: var(--green-soft);
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .empty strong {
      display: block;

      margin-bottom: 5px;

      color: var(--text);
    }

    .privacy {
      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 15px;

      background: var(--green-soft);

      color: #536553;

      font-size: 11px;
      line-height: 1.6;
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);
      font-weight: 700;
    }

    @media (max-width: 650px) {
      .grid,
      .private-files {
        grid-template-columns: 1fr;
      }

      .full,
      .section-title {
        grid-column: auto;
      }

      .summary {
        align-items: flex-start;
      }
    }
  </style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


const STORAGE_BUCKET =
  "travel-private";


/* =========================
   SETTINGS
========================= */

const STORAGE_KEY =
  "travelHubItaly2026Tickets";


const MODULE_KEY =
  "tickets";


let currentUser =
  null;


let tickets =
  [];


let cloudSaveTimer;


/* =========================
   HELPERS
========================= */

function makeId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function valueOf(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }


  return fallback;

}


function normalizeTicket(
  oldTicket = {}
) {

  return {

    ...oldTicket,

    id:
      valueOf(
        oldTicket,
        ["id"],
        makeId()
      ),

    name:
      valueOf(
        oldTicket,
        ["name", "title", "ticketName"]
      ),

    location:
      valueOf(
        oldTicket,
        ["location", "place", "city"]
      ),

    date:
      valueOf(
        oldTicket,
        ["date", "visitDate"]
      ),

    time:
      valueOf(
        oldTicket,
        ["time", "visitTime"]
      ),

    people:
      valueOf(
        oldTicket,
        ["people", "persons", "guests"]
      ),

    status:
      valueOf(
        oldTicket,
        ["status"],
        "已預訂"
      ),

    payment:
      valueOf(
        oldTicket,
        ["payment", "paymentStatus"]
      ),

    orderNo:
      valueOf(
        oldTicket,
        [
          "orderNo",
          "order",
          "bookingNo",
          "confirmation"
        ]
      ),

    amount:
      valueOf(
        oldTicket,
        ["amount", "price"]
      ),

    currency:
      valueOf(
        oldTicket,
        ["currency"],
        "EUR"
      ),

    arriveEarly:
      valueOf(
        oldTicket,
        ["arriveEarly", "early", "arrival"]
      ),

    maps:
      valueOf(
        oldTicket,
        ["maps", "map", "mapLink"]
      ),

    note:
      valueOf(
        oldTicket,
        ["note", "notes"]
      ),

    documentPath:
      valueOf(
        oldTicket,
        ["documentPath"],
        ""
      ),

    documentName:
      valueOf(
        oldTicket,
        ["documentName"],
        ""
      ),

    qrPath:
      valueOf(
        oldTicket,
        ["qrPath"],
        ""
      ),

    qrName:
      valueOf(
        oldTicket,
        ["qrName"],
        ""
      ),

    documentLink:
      valueOf(
        oldTicket,
        [
          "documentLink",
          "pdf",
          "pdfLink"
        ],
        ""
      ),

    qrLink:
      valueOf(
        oldTicket,
        [
          "qrLink",
          "qr"
        ],
        ""
      )

  };

}


function normalizeTickets(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return data.map(
      normalizeTicket
    );

  }


  if (
    data &&
    Array.isArray(data.tickets)
  ) {

    return data.tickets.map(
      normalizeTicket
    );

  }


  return [];

}


function newTicket() {

  return normalizeTicket({
    id: makeId(),
    currency: "EUR",
    status: "已預訂"
  });

}


function sanitizeFileName(
  name
) {

  const clean =
    String(
      name ||
      "file"
    )
      .replaceAll("/", "-")
      .replaceAll("\\", "-")
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  return clean || "file";

}


/* =========================
   STATUS
========================= */

function setCloudStatus(
  text,
  type
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {
    dot.classList.add(type);
  }

}


function showBanner(
  text,
  type = "success"
) {

  const banner =
    document.getElementById(
      "syncBanner"
    );


  banner.textContent =
    text;


  banner.className =
    "sync-banner show " +
    type;


  setTimeout(
    () => {

      banner.className =
        "sync-banner";

    },
    5000
  );

}


/* =========================
   LOCAL
========================= */

function loadLocalTickets() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    return normalizeTickets(
      JSON.parse(raw)
    );

  }

  catch (
    error
  ) {

    console.error(error);

    return null;

  }

}


function saveLocalTickets() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tickets)
  );

}


/* =========================
   CLOUD DATA
========================= */

async function loadCloudModule() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .select("data")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function uploadTicketsNow() {

  if (!currentUser) {
    return;
  }


  saveLocalTickets();


  setCloudStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 2,
            tickets: tickets
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    console.error(error);

    setCloudStatus(
      "同步失敗",
      "error"
    );

    throw error;

  }


  setCloudStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleCloudSave() {

  saveLocalTickets();


  setCloudStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    cloudSaveTimer
  );


  cloudSaveTimer =
    setTimeout(
      () => {

        uploadTicketsNow()
          .catch(
            console.error
          );

      },
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initializeCloud() {

  setCloudStatus(
    "登入確認中…"
  );


  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    sessionData.session;


  if (!session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  const localTickets =
    loadLocalTickets();


  setCloudStatus(
    "讀取雲端…",
    "saving"
  );


  try {

    const cloudRow =
      await loadCloudModule();


    if (
      cloudRow &&
      cloudRow.data
    ) {

      tickets =
        normalizeTickets(
          cloudRow.data
        );


      saveLocalTickets();

    }

    else if (
      localTickets &&
      localTickets.length > 0
    ) {

      tickets =
        localTickets;


      await uploadTicketsNow();

    }

    else {

      tickets =
        [];


      await uploadTicketsNow();

    }


    render();


    setCloudStatus(
      "已同步 ☁️",
      "online"
    );

  }

  catch (
    error
  ) {

    console.error(error);


    tickets =
      localTickets || [];


    render();


    setCloudStatus(
      "離線備份模式",
      "error"
    );

  }

}


/* =========================
   PRIVATE STORAGE
========================= */

function ticketFolder(
  ticket,
  kind
) {

  return (
    currentUser.id +
    "/tickets/" +
    ticket.id +
    "/" +
    kind
  );

}


async function uploadPrivateFile(
  ticket,
  kind,
  file
) {

  if (!file) {
    return;
  }


  setCloudStatus(
    "檔案上傳中…",
    "saving"
  );


  const safeName =
    sanitizeFileName(
      file.name
    );


  const path =
    ticketFolder(
      ticket,
      kind
    ) +
    "/" +
    Date.now() +
    "-" +
    makeId() +
    "-" +
    safeName;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .upload(
        path,
        file,
        {
          upsert: false,
          cacheControl: "3600",
          contentType:
            file.type ||
            undefined
        }
      );


  if (error) {

    console.error(error);


    setCloudStatus(
      "檔案上傳失敗",
      "error"
    );


    alert(
      "檔案上傳失敗。"
    );


    return;
  }


  const oldPath =
    kind === "document"
      ? ticket.documentPath
      : ticket.qrPath;


  if (
    kind === "document"
  ) {

    ticket.documentPath =
      path;


    ticket.documentName =
      file.name;

  }

  else {

    ticket.qrPath =
      path;


    ticket.qrName =
      file.name;

  }


  await uploadTicketsNow();


  if (
    oldPath &&
    oldPath !== path
  ) {

    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .remove([
        oldPath
      ]);

  }


  render();


  showBanner(
    "🔒 私人檔案已上傳完成。"
  );

}


async function openPrivateFile(
  path
) {

  if (!path) {

    alert(
      "目前沒有檔案。"
    );

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .createSignedUrl(
        path,
        600
      );


  if (error) {

    console.error(error);


    alert(
      "目前無法開啟私人檔案。"
    );


    return;

  }


  window.open(
    data.signedUrl,
    "_blank",
    "noopener"
  );

}


async function deletePrivateFile(
  ticket,
  kind
) {

  const path =
    kind === "document"
      ? ticket.documentPath
      : ticket.qrPath;


  if (!path) {
    return;
  }


  const okay =
    confirm(
      "確定要刪除這個私人檔案嗎？"
    );


  if (!okay) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        STORAGE_BUCKET
      )
      .remove([
        path
      ]);


  if (error) {

    console.error(error);


    alert(
      "檔案刪除失敗。"
    );


    return;

  }


  if (
    kind === "document"
  ) {

    ticket.documentPath =
      "";

    ticket.documentName =
      "";

  }

  else {

    ticket.qrPath =
      "";

    ticket.qrName =
      "";

  }


  await uploadTicketsNow();


  render();

}


/* =========================
   RENDER
========================= */

function render() {

  document.getElementById(
    "ticketCount"
  ).textContent =
    tickets.length +
    " 張票券";


  const container =
    document.getElementById(
      "ticketList"
    );


  container.innerHTML =
    "";


  if (
    tickets.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          <div class="empty-icon">
            🎫
          </div>

          <strong>
            還沒有票券
          </strong>

          按「＋ 新增票券」開始建立。

        </div>
      `;


    return;

  }


  tickets.forEach(
    (
      ticket,
      index
    ) => {

      container.appendChild(
        createTicketCard(
          ticket,
          index
        )
      );

    }
  );

}


/* =========================
   CARD
========================= */

function createTicketCard(
  ticket,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "ticket-card";


  card.innerHTML =
    `

      <div class="ticket-top">

        <div class="ticket-number">
          ${index + 1}
        </div>


        <input
          class="ticket-name"
          placeholder="票券 / 景點名稱"
          value="${escapeAttribute(ticket.name)}"
        >


        <button
          class="delete-button"
        >
          ×
        </button>

      </div>


      <div class="grid">


        <div class="field-wrap">

          <label>
            地點
          </label>

          <input
            class="field location"
            value="${escapeAttribute(ticket.location)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            狀態
          </label>

          <select class="field status">
            ${statusOptions(ticket.status)}
          </select>

        </div>


        <div class="field-wrap">

          <label>
            日期
          </label>

          <input
            class="field date"
            type="date"
            value="${escapeAttribute(ticket.date)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            時間
          </label>

          <input
            class="field time"
            type="time"
            value="${escapeAttribute(ticket.time)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            人數
          </label>

          <input
            class="field people"
            value="${escapeAttribute(ticket.people)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            建議提早多久
          </label>

          <input
            class="field arriveEarly"
            value="${escapeAttribute(ticket.arriveEarly)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            訂單編號
          </label>

          <input
            class="field orderNo"
            value="${escapeAttribute(ticket.orderNo)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            付款狀態
          </label>

          <input
            class="field payment"
            value="${escapeAttribute(ticket.payment)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            金額
          </label>

          <input
            class="field amount"
            value="${escapeAttribute(ticket.amount)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            幣別
          </label>

          <select class="field currency">
            ${currencyOptions(ticket.currency)}
          </select>

        </div>


        <div class="field-wrap full">

          <label>
            Google Maps 分享連結
          </label>

          <input
            class="field maps"
            value="${escapeAttribute(ticket.maps)}"
          >

        </div>


        <div class="section-title">
          🔒 私人電子票 / QR
        </div>


        <div class="private-files">

          <div class="file-box">

            <strong>
              📄 電子票 / PDF
            </strong>

            <div class="file-status">
              ${
                ticket.documentPath
                  ? "已上傳：" +
                    escapeHtml(
                      ticket.documentName ||
                      "私人檔案"
                    )
                  : "尚未上傳私人檔案"
              }
            </div>

            <input
              class="file-input documentUpload"
              type="file"
              accept="application/pdf,image/*"
            >

            <div class="file-actions">

              <button
                class="file-button openDocument"
              >
                開啟
              </button>

              <button
                class="file-button delete deleteDocument"
              >
                刪除
              </button>

            </div>

            ${
              ticket.documentLink
                ? `
                  <div class="legacy-note">
                    仍保留舊的文件連結資料。
                  </div>
                `
                : ""
            }

          </div>


          <div class="file-box">

            <strong>
              ▦ QR Code
            </strong>

            <div class="file-status">
              ${
                ticket.qrPath
                  ? "已上傳：" +
                    escapeHtml(
                      ticket.qrName ||
                      "私人 QR"
                    )
                  : "尚未上傳私人 QR"
              }
            </div>

            <input
              class="file-input qrUpload"
              type="file"
              accept="image/*"
            >

            <div class="file-actions">

              <button
                class="file-button openQr"
              >
                開啟
              </button>

              <button
                class="file-button delete deleteQr"
              >
                刪除
              </button>

            </div>

          </div>

        </div>


        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field note"
          >${escapeHtml(ticket.note)}</textarea>

        </div>

      </div>


      <div class="actions">

        <button class="action-button map-button openMap">
          📍 Google Maps
        </button>

        <button class="action-button moveUp">
          ↑ 上移
        </button>

        <button class="action-button moveDown">
          ↓ 下移
        </button>

      </div>

    `;


  bindInput(
    card,
    ".ticket-name",
    ticket,
    "name"
  );


  bindInput(
    card,
    ".location",
    ticket,
    "location"
  );


  bindInput(
    card,
    ".date",
    ticket,
    "date"
  );


  bindInput(
    card,
    ".time",
    ticket,
    "time"
  );


  bindInput(
    card,
    ".people",
    ticket,
    "people"
  );


  bindInput(
    card,
    ".arriveEarly",
    ticket,
    "arriveEarly"
  );


  bindInput(
    card,
    ".orderNo",
    ticket,
    "orderNo"
  );


  bindInput(
    card,
    ".payment",
    ticket,
    "payment"
  );


  bindInput(
    card,
    ".amount",
    ticket,
    "amount"
  );


  bindInput(
    card,
    ".maps",
    ticket,
    "maps"
  );


  bindInput(
    card,
    ".note",
    ticket,
    "note"
  );


  const status =
    card.querySelector(
      ".status"
    );


  status.onchange =
    () => {

      ticket.status =
        status.value;


      scheduleCloudSave();

    };


  const currency =
    card.querySelector(
      ".currency"
    );


  currency.onchange =
    () => {

      ticket.currency =
        currency.value;


      scheduleCloudSave();

    };


  card.querySelector(
    ".documentUpload"
  ).onchange =
    async event => {

      const file =
        event.target.files[0];


      await uploadPrivateFile(
        ticket,
        "document",
        file
      );

    };


  card.querySelector(
    ".qrUpload"
  ).onchange =
    async event => {

      const file =
        event.target.files[0];


      await uploadPrivateFile(
        ticket,
        "qr",
        file
      );

    };


  card.querySelector(
    ".openDocument"
  ).onclick =
    () => {

      if (
        ticket.documentPath
      ) {

        openPrivateFile(
          ticket.documentPath
        );


        return;

      }


      if (
        ticket.documentLink
      ) {

        window.open(
          ticket.documentLink,
          "_blank",
          "noopener"
        );


        return;

      }


      alert(
        "還沒有電子票。"
      );

    };


  card.querySelector(
    ".openQr"
  ).onclick =
    () => {

      if (
        ticket.qrPath
      ) {

        openPrivateFile(
          ticket.qrPath
        );


        return;

      }


      if (
        ticket.qrLink
      ) {

        window.open(
          ticket.qrLink,
          "_blank",
          "noopener"
        );


        return;

      }


      alert(
        "還沒有 QR Code。"
      );

    };


  card.querySelector(
    ".deleteDocument"
  ).onclick =
    () => {

      deletePrivateFile(
        ticket,
        "document"
      );

    };


  card.querySelector(
    ".deleteQr"
  ).onclick =
    () => {

      deletePrivateFile(
        ticket,
        "qr"
      );

    };


  card.querySelector(
    ".openMap"
  ).onclick =
    () => {

      openMap(
        ticket
      );

    };


  card.querySelector(
    ".delete-button"
  ).onclick =
    async () => {

      const okay =
        confirm(
          "確定要刪除這張票券嗎？"
        );


      if (!okay) {
        return;
      }


      const paths =
        [
          ticket.documentPath,
          ticket.qrPath
        ]
        .filter(Boolean);


      if (
        paths.length > 0
      ) {

        await supabaseClient
          .storage
          .from(
            STORAGE_BUCKET
          )
          .remove(
            paths
          );

      }


      tickets.splice(
        index,
        1
      );


      await uploadTicketsNow();


      render();

    };


  card.querySelector(
    ".moveUp"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      [
        tickets[index - 1],
        tickets[index]
      ] =
      [
        tickets[index],
        tickets[index - 1]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveDown"
  ).onclick =
    () => {

      if (
        index ===
        tickets.length - 1
      ) {
        return;
      }


      [
        tickets[index],
        tickets[index + 1]
      ] =
      [
        tickets[index + 1],
        tickets[index]
      ];


      scheduleCloudSave();

      render();

    };


  return card;

}


/* =========================
   INPUT
========================= */

function bindInput(
  card,
  selector,
  object,
  key
) {

  const element =
    card.querySelector(
      selector
    );


  element.oninput =
    () => {

      object[key] =
        element.value;


      scheduleCloudSave();

    };

}


/* =========================
   ADD
========================= */

document.getElementById(
  "addTicket"
).onclick =
  () => {

    tickets.push(
      newTicket()
    );


    scheduleCloudSave();

    render();

  };


/* =========================
   MAP
========================= */

function openMap(
  ticket
) {

  if (
    ticket.maps &&
    ticket.maps.trim()
  ) {

    window.open(
      ticket.maps.trim(),
      "_blank",
      "noopener"
    );


    return;

  }


  const query =
    ticket.location?.trim() ||
    ticket.name?.trim();


  if (!query) {

    alert(
      "先填票券名稱或地點。"
    );


    return;

  }


  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query),
    "_blank",
    "noopener"
  );

}


/* =========================
   OPTIONS
========================= */

function statusOptions(
  selected
) {

  const options =
    [
      "想訂",
      "待搶票",
      "已預訂",
      "已付款",
      "已使用",
      "取消"
    ];


  if (
    selected &&
    !options.includes(selected)
  ) {

    options.push(selected);

  }


  return options
    .map(
      item =>
        `
          <option
            value="${escapeAttribute(item)}"
            ${
              item === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(item)}
          </option>
        `
    )
    .join("");

}


function currencyOptions(
  selected
) {

  const currencies =
    [
      "EUR",
      "TWD",
      "USD",
      "GBP",
      "JPY",
      "AUD",
      "CNY"
    ];


  if (
    selected &&
    !currencies.includes(selected)
  ) {

    currencies.push(
      selected
    );

  }


  return currencies
    .map(
      currency =>
        `
          <option
            value="${escapeAttribute(currency)}"
            ${
              currency === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(currency)}
          </option>
        `
    )
    .join("");

}


/* =========================
   START
========================= */

initializeCloud();

</script>

</body>
</html>
