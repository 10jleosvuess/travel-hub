<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>行李清單｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --red-soft: #f3e3e1;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      background: white;

      border-radius: 14px;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .sync-banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .sync-banner.show {
      display: block;
    }

    .sync-banner.success {
      background: var(--green-soft);
    }

    .sync-banner.error {
      background: var(--red-soft);
    }

    .summary {
      background: var(--dark);
      color: white;

      border-radius: 23px;

      padding: 18px;

      margin-bottom: 16px;

      box-shadow: var(--shadow);
    }

    .summary-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .summary small {
      color: rgba(255,255,255,0.65);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .progress-track {
      height: 8px;

      margin-top: 14px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255,255,255,0.14);
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      border-radius: inherit;

      background: white;

      transition: width 0.25s ease;
    }

    .progress-text {
      margin-top: 7px;

      color: rgba(255,255,255,0.7);

      font-size: 11px;
    }

    .add-category-button {
      border: 0;

      border-radius: 13px;

      padding: 10px 13px;

      background: white;
      color: var(--dark);

      font-weight: 800;

      white-space: nowrap;
    }

    .category-list {
      display: grid;
      gap: 14px;
    }

    .category-card {
      background: white;

      border-radius: 22px;

      padding: 16px;

      box-shadow: var(--shadow);
    }

    .category-head {
      display: grid;

      grid-template-columns: 1fr auto;

      gap: 10px;

      align-items: center;
    }

    .category-name {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;
    }

    .category-actions {
      display: flex;
      gap: 5px;
    }

    .tiny-button {
      width: 34px;
      height: 34px;

      border: 0;

      border-radius: 10px;

      background: #f1eee9;

      color: var(--text);
    }

    .tiny-button.delete {
      color: var(--danger);

      background: var(--red-soft);
    }

    .items {
      display: grid;
      gap: 8px;

      margin-top: 13px;
    }

    .item-row {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 10px;

      padding: 9px 10px;

      border: 1px solid var(--line);

      border-radius: 13px;

      background: #fbfaf8;
    }

    .check {
      width: 21px;
      height: 21px;

      accent-color: #6e7c68;
    }

    .item-input {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);
    }

    .item-row.done {
      opacity: 0.56;
    }

    .item-row.done .item-input {
      text-decoration: line-through;
    }

    .delete-item {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 18px;
    }

    .add-item-row {
      display: grid;

      grid-template-columns: 1fr auto;

      gap: 8px;

      margin-top: 11px;
    }

    .new-item-input {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      outline: none;

      background: #fbfaf8;
    }

    .new-item-input:focus {
      border-color: #baa48f;
      background: white;
    }

    .add-item-button {
      border: 0;

      border-radius: 12px;

      padding: 0 14px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;
    }

    .empty-category {
      padding: 15px 5px 4px;

      color: var(--muted);

      font-size: 12px;
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .empty strong {
      display: block;

      margin-bottom: 5px;

      color: var(--text);
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 600px) {
      .summary-top {
        align-items: flex-start;
      }
    }
  </style>
</head>

<nav>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


/* =========================
   SETTINGS
========================= */

const STORAGE_KEY =
  "travelHubItaly2026Packing";


const MODULE_KEY =
  "packing";


let currentUser =
  null;


let categories =
  [];


let cloudSaveTimer;


/* =========================
   HELPERS
========================= */

function makeId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function valueOf(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }

  return fallback;

}


function normalizeItem(
  oldItem = {}
) {

  if (
    typeof oldItem === "string"
  ) {

    return {
      id: makeId(),
      name: oldItem,
      done: false
    };

  }


  return {

    ...oldItem,

    id:
      valueOf(
        oldItem,
        ["id"],
        makeId()
      ),

    name:
      valueOf(
        oldItem,
        [
          "name",
          "text",
          "title",
          "item"
        ]
      ),

    done:
      Boolean(
        valueOf(
          oldItem,
          [
            "done",
            "checked",
            "completed"
          ],
          false
        )
      )

  };

}


function normalizeCategory(
  oldCategory = {},
  index = 0
) {

  if (
    typeof oldCategory === "string"
  ) {

    return {
      id: makeId(),
      name: oldCategory,
      items: []
    };

  }


  const oldItems =
    valueOf(
      oldCategory,
      ["items", "list"],
      []
    );


  return {

    ...oldCategory,

    id:
      valueOf(
        oldCategory,
        ["id"],
        makeId()
      ),

    name:
      valueOf(
        oldCategory,
        [
          "name",
          "title",
          "category"
        ],
        "分類 " + (index + 1)
      ),

    items:
      Array.isArray(oldItems)
        ? oldItems.map(normalizeItem)
        : []

  };

}


function normalizeCategories(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return data.map(
      normalizeCategory
    );

  }


  if (
    data &&
    Array.isArray(data.categories)
  ) {

    return data.categories.map(
      normalizeCategory
    );

  }


  if (
    data &&
    Array.isArray(data.packing)
  ) {

    return data.packing.map(
      normalizeCategory
    );

  }


  return [];

}


function newCategory() {

  return {
    id: makeId(),
    name: "新分類",
    items: []
  };

}


function newItem(
  name
) {

  return {
    id: makeId(),
    name: name,
    done: false
  };

}


/* =========================
   STATUS
========================= */

function setCloudStatus(
  text,
  type
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {
    dot.classList.add(type);
  }

}


function showBanner(
  text,
  type = "success"
) {

  const banner =
    document.getElementById(
      "syncBanner"
    );


  banner.textContent =
    text;


  banner.className =
    "sync-banner show " +
    type;


  setTimeout(
    () => {

      banner.className =
        "sync-banner";

    },
    5000
  );

}


/* =========================
   LOCAL
========================= */

function loadLocalPacking() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    const parsed =
      JSON.parse(raw);


    return normalizeCategories(
      parsed
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    return null;

  }

}


function saveLocalPacking() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      version: 1,
      categories: categories
    })
  );

}


/* =========================
   CLOUD
========================= */

async function loadCloudModule() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .select("data, updated_at")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function uploadPackingNow() {

  if (!currentUser) {
    return;
  }


  saveLocalPacking();


  setCloudStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 1,
            categories: categories
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    console.error(error);


    setCloudStatus(
      "同步失敗",
      "error"
    );


    return;

  }


  setCloudStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleCloudSave() {

  saveLocalPacking();


  setCloudStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    cloudSaveTimer
  );


  cloudSaveTimer =
    setTimeout(
      uploadPackingNow,
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initializeCloud() {

  setCloudStatus(
    "登入確認中…"
  );


  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    sessionData.session;


  if (!session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  const localCategories =
    loadLocalPacking();


  setCloudStatus(
    "讀取雲端…",
    "saving"
  );


  try {

    const cloudRow =
      await loadCloudModule();


    if (
      cloudRow &&
      cloudRow.data
    ) {

      categories =
        normalizeCategories(
          cloudRow.data
        );


      saveLocalPacking();


      setCloudStatus(
        "已同步 ☁️",
        "online"
      );


      showBanner(
        "☁️ 已載入行李清單雲端資料。"
      );

    }

    else if (
      localCategories &&
      localCategories.length > 0
    ) {

      categories =
        localCategories;


      await uploadPackingNow();


      showBanner(
        "☁️ 第一次同步完成：原本瀏覽器裡的行李清單已上傳到 Supabase。"
      );

    }

    else {

      categories =
        [];


      await uploadPackingNow();


      showBanner(
        "☁️ 已建立行李清單雲端資料。"
      );

    }

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    categories =
      localCategories || [];


    setCloudStatus(
      "離線備份模式",
      "error"
    );


    showBanner(
      "⚠️ Supabase 暫時無法連線，目前使用本機行李清單。",
      "error"
    );

  }


  render();

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

  let total =
    0;


  let done =
    0;


  categories.forEach(
    category => {

      category.items.forEach(
        item => {

          total += 1;


          if (item.done) {
            done += 1;
          }

        }
      );

    }
  );


  const percent =
    total === 0
      ? 0
      : Math.round(
          done / total * 100
        );


  document.getElementById(
    "progressCount"
  ).textContent =
    done +
    " / " +
    total;


  document.getElementById(
    "progressBar"
  ).style.width =
    percent +
    "%";


  document.getElementById(
    "progressText"
  ).textContent =
    total === 0
      ? "尚未建立打包項目"
      : "已完成 " + percent + "%";

}


/* =========================
   RENDER
========================= */

function render() {

  updateProgress();


  const container =
    document.getElementById(
      "categoryList"
    );


  container.innerHTML =
    "";


  if (
    categories.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          <div class="empty-icon">
            🧳
          </div>

          <strong>
            還沒有行李分類
          </strong>

          按「＋ 新增分類」開始建立清單。

        </div>
      `;


    return;

  }


  categories.forEach(
    (
      category,
      index
    ) => {

      container.appendChild(
        createCategoryCard(
          category,
          index
        )
      );

    }
  );

}


/* =========================
   CATEGORY CARD
========================= */

function createCategoryCard(
  category,
  categoryIndex
) {

  const card =
    document.createElement(
      "section"
    );


  card.className =
    "category-card";


  card.innerHTML =
    `

      <div class="category-head">

        <input
          class="category-name"
          value="${escapeAttribute(category.name)}"
          placeholder="分類名稱"
        >


        <div class="category-actions">

          <button
            class="tiny-button category-up"
            title="上移"
          >
            ↑
          </button>


          <button
            class="tiny-button category-down"
            title="下移"
          >
            ↓
          </button>


          <button
            class="tiny-button delete category-delete"
            title="刪除分類"
          >
            ×
          </button>

        </div>

      </div>


      <div class="items"></div>


      <div class="add-item-row">

        <input
          class="new-item-input"
          placeholder="新增物品，例如：充電器"
        >


        <button class="add-item-button">
          ＋
        </button>

      </div>

    `;


  const nameInput =
    card.querySelector(
      ".category-name"
    );


  nameInput.oninput =
    () => {

      category.name =
        nameInput.value;

      scheduleCloudSave();

    };


  const itemsContainer =
    card.querySelector(
      ".items"
    );


  renderItems(
    itemsContainer,
    category
  );


  const newItemInput =
    card.querySelector(
      ".new-item-input"
    );


  const addButton =
    card.querySelector(
      ".add-item-button"
    );


  function addNewItem() {

    const text =
      newItemInput.value.trim();


    if (!text) {
      return;
    }


    category.items.push(
      newItem(text)
    );


    scheduleCloudSave();

    render();

  }


  addButton.onclick =
    addNewItem;


  newItemInput.onkeydown =
    event => {

      if (
        event.key === "Enter"
      ) {

        addNewItem();

      }

    };


  card.querySelector(
    ".category-up"
  ).onclick =
    () => {

      if (
        categoryIndex === 0
      ) {
        return;
      }


      [
        categories[categoryIndex - 1],
        categories[categoryIndex]
      ] =
      [
        categories[categoryIndex],
        categories[categoryIndex - 1]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".category-down"
  ).onclick =
    () => {

      if (
        categoryIndex ===
        categories.length - 1
      ) {
        return;
      }


      [
        categories[categoryIndex],
        categories[categoryIndex + 1]
      ] =
      [
        categories[categoryIndex + 1],
        categories[categoryIndex]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".category-delete"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除「" +
          category.name +
          "」和裡面的所有項目嗎？"
        );


      if (!okay) {
        return;
      }


      categories.splice(
        categoryIndex,
        1
      );


      scheduleCloudSave();

      render();

    };


  return card;

}


/* =========================
   ITEMS
========================= */

function renderItems(
  container,
  category
) {

  container.innerHTML =
    "";


  if (
    category.items.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty-category">
          這個分類還沒有物品。
        </div>
      `;


    return;

  }


  category.items.forEach(
    (
      item,
      itemIndex
    ) => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "item-row" +
        (
          item.done
            ? " done"
            : ""
        );


      row.innerHTML =
        `

          <input
            class="check"
            type="checkbox"
            ${item.done ? "checked" : ""}
          >


          <input
            class="item-input"
            value="${escapeAttribute(item.name)}"
            placeholder="物品名稱"
          >


          <button
            class="delete-item"
            title="刪除"
          >
            ×
          </button>

        `;


      const checkbox =
        row.querySelector(
          ".check"
        );


      checkbox.onchange =
        () => {

          item.done =
            checkbox.checked;


          scheduleCloudSave();

          render();

        };


      const itemInput =
        row.querySelector(
          ".item-input"
        );


      itemInput.oninput =
        () => {

          item.name =
            itemInput.value;

          scheduleCloudSave();

        };


      row.querySelector(
        ".delete-item"
      ).onclick =
        () => {

          category.items.splice(
            itemIndex,
            1
          );


          scheduleCloudSave();

          render();

        };


      container.appendChild(
        row
      );

    }
  );

}


/* =========================
   ADD CATEGORY
========================= */

document.getElementById(
  "addCategory"
).onclick =
  () => {

    categories.push(
      newCategory()
    );


    scheduleCloudSave();

    render();

  };


/* =========================
   ESCAPE
========================= */

function escapeHtml(
  text = ""
) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}


/* =========================
   START
========================= */

initializeCloud();
