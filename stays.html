<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>住宿｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --blue-soft: #e6edf3;
      --red-soft: #f3e3e1;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      background: white;

      border-radius: 14px;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .sync-banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .sync-banner.show {
      display: block;
    }

    .sync-banner.success {
      background: var(--green-soft);
    }

    .sync-banner.error {
      background: var(--red-soft);
    }

    .summary {
      background: var(--dark);
      color: white;

      border-radius: 23px;

      padding: 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;

      box-shadow: var(--shadow);
    }

    .summary small {
      color: rgba(255,255,255,0.65);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 11px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;

      white-space: nowrap;
    }

    .stay-list {
      display: grid;
      gap: 14px;
    }

    .stay-card {
      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow: var(--shadow);
    }

    .stay-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 11px;
    }

    .stay-number {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;
    }

    .stay-name {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 21px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 9px;

      margin-top: 14px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 10px;
      color: var(--muted);
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 75px;

      resize: vertical;

      line-height: 1.5;
    }

    .section-title {
      grid-column: 1 / -1;

      margin-top: 5px;

      padding-top: 12px;

      border-top: 1px solid var(--line);

      font-size: 12px;
      font-weight: 800;
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;

      padding-top: 12px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-button {
      background: var(--green-soft);
    }

    .link-button {
      background: var(--blue-soft);
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .empty strong {
      display: block;

      margin-bottom: 5px;

      color: var(--text);
    }

    .privacy {
      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 15px;

      background: var(--yellow-soft);

      color: #675c4c;

      font-size: 11px;
      line-height: 1.6;
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full,
      .section-title {
        grid-column: auto;
      }

      .summary {
        align-items: flex-start;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="container topbar">

    <a class="back" href="index.html">

      <div class="back-icon">
        ←
      </div>

      <div>
        住宿
      </div>

    </a>


    <div class="right-header">

      <div
        class="cloud-dot"
        id="cloudDot"
      ></div>

      <div
        class="save-status"
        id="saveStatus"
      >
        連線中…
      </div>

    </div>

  </div>

</header>


<main class="container">

  <section class="page-head">

    <h1>
      🏨 住宿
    </h1>

    <p>
      飯店、民宿、入住時間、訂單與停車資訊
    </p>

  </section>


  <div
    class="sync-banner"
    id="syncBanner"
  ></div>


  <section class="summary">

    <div>

      <small>
        Italy 2026
      </small>

      <strong id="stayCount">
        0 間住宿
      </strong>

    </div>


    <button
      class="add-button"
      id="addStay"

      ＋ 新增住宿

  <div
    class="stay-list"
    id="stayList"

  <div class="privacy">
    🔒 住宿資料現在會存在你的 Supabase 帳號中。之後真正的訂房確認 PDF、QR Code 或含個資文件，我們會改放「私人 Supabase Storage」，不要上傳到公開 GitHub repository。
  </div>

</main>


<nav>

  <a
    class="nav-link"
    href="index.html"
  >
    <span class="nav-icon">🏠</span>
    今天
  </a>


  <a
    class="nav-link"
    href="itinerary.html"
  >
    <span class="nav-icon">📅</span>
    行程
  </a>


  <a
    class="nav-link"
    href="map.html"
  >
    <span class="nav-icon">🗺️</span>
    地圖
  </a>


  <a
    class="nav-link"

</nav>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


/* =========================
   SETTINGS
========================= */

const STORAGE_KEY =
  "travelHubItaly2026Stays";


const MODULE_KEY =
  "stays";


let currentUser =
  null;


let stays =
  [];


let cloudSaveTimer;


/* =========================
   HELPERS
========================= */

function valueOf(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }

  return fallback;

}


function normalizeStay(
  oldStay = {}
) {

  return {

    ...oldStay,

    id:
      valueOf(
        oldStay,
        ["id"],
        makeId()
      ),

    name:
      valueOf(
        oldStay,
        ["name", "hotelName", "title"]
      ),

    city:
      valueOf(
        oldStay,
        ["city", "area"]
      ),

    checkInDate:
      valueOf(
        oldStay,
        [
          "checkInDate",
          "checkIn",
          "checkin",
          "checkinDate"
        ]
      ),

    checkInTime:
      valueOf(
        oldStay,
        [
          "checkInTime",
          "checkinTime"
        ]
      ),

    checkOutDate:
      valueOf(
        oldStay,
        [
          "checkOutDate",
          "checkOut",
          "checkout",
          "checkoutDate"
        ]
      ),

    checkOutTime:
      valueOf(
        oldStay,
        [
          "checkOutTime",
          "checkoutTime"
        ]
      ),

    address:
      valueOf(
        oldStay,
        ["address"]
      ),

    maps:
      valueOf(
        oldStay,
        [
          "maps",
          "map",
          "mapLink"
        ]
      ),

    platform:
      valueOf(
        oldStay,
        [
          "platform",
          "bookingPlatform"
        ]
      ),

    bookingNo:
      valueOf(
        oldStay,
        [
          "bookingNo",
          "booking",
          "bookingNumber",
          "confirmation"
        ]
      ),

    paymentStatus:
      valueOf(
        oldStay,
        [
          "paymentStatus",
          "payment"
        ]
      ),

    amount:
      valueOf(
        oldStay,
        ["amount", "price"]
      ),

    currency:
      valueOf(
        oldStay,
        ["currency"],
        "EUR"
      ),

    phone:
      valueOf(
        oldStay,
        ["phone", "telephone"]
      ),

    parking:
      valueOf(
        oldStay,
        ["parking"]
      ),

    breakfast:
      valueOf(
        oldStay,
        ["breakfast"]
      ),

    documentLink:
      valueOf(
        oldStay,
        [
          "documentLink",
          "pdf",
          "pdfLink",
          "document"
        ]
      ),

    notes:
      valueOf(
        oldStay,
        ["notes", "note"]
      )

  };

}


function makeId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function newStay() {

  return normalizeStay({
    id: makeId(),
    currency: "EUR"
  });

}


/* =========================
   STATUS
========================= */

function setCloudStatus(
  text,
  type
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {
    dot.classList.add(type);
  }

}


function showBanner(
  text,
  type = "success"
) {

  const banner =
    document.getElementById(
      "syncBanner"
    );


  banner.textContent =
    text;


  banner.className =
    "sync-banner show " +
    type;


  setTimeout(
    () => {

      banner.className =
        "sync-banner";

    },
    5000
  );

}


/* =========================
   LOCAL STORAGE
========================= */

function loadLocalStays() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    const parsed =
      JSON.parse(raw);


    if (
      Array.isArray(parsed)
    ) {

      return parsed.map(
        normalizeStay
      );

    }


    if (
      parsed &&
      Array.isArray(parsed.stays)
    ) {

      return parsed.stays.map(
        normalizeStay
      );

    }

  }

  catch (
    error
  ) {

    console.error(
      error
    );

  }


  return null;

}


function saveLocalStays() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stays)
  );

}


/* =========================
   CLOUD
========================= */

async function loadCloudModule() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .select("data, updated_at")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


function cloudDataToStays(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return data.map(
      normalizeStay
    );

  }


  if (
    data &&
    Array.isArray(data.stays)
  ) {

    return data.stays.map(
      normalizeStay
    );

  }


  return [];

}


async function uploadStaysNow() {

  if (!currentUser) {
    return;
  }


  saveLocalStays();


  setCloudStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 1,
            stays: stays
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    console.error(
      error
    );


    setCloudStatus(
      "同步失敗",
      "error"
    );


    return;

  }


  setCloudStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleCloudSave() {

  saveLocalStays();


  setCloudStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    cloudSaveTimer
  );


  cloudSaveTimer =
    setTimeout(
      uploadStaysNow,
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initializeCloud() {

  setCloudStatus(
    "登入確認中…"
  );


  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    sessionData.session;


  if (!session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  const localStays =
    loadLocalStays();


  setCloudStatus(
    "讀取雲端…",
    "saving"
  );


  try {

    const cloudRow =
      await loadCloudModule();


    if (
      cloudRow &&
      cloudRow.data
    ) {

      stays =
        cloudDataToStays(
          cloudRow.data
        );


      saveLocalStays();


      setCloudStatus(
        "已同步 ☁️",
        "online"
      );


      showBanner(
        "☁️ 已載入住宿雲端資料。"
      );

    }

    else if (
      localStays &&
      localStays.length > 0
    ) {

      stays =
        localStays;


      await uploadStaysNow();


      showBanner(
        "☁️ 第一次同步完成：原本瀏覽器裡的住宿資料已上傳到 Supabase。"
      );

    }

    else {

      stays =
        [];


      await uploadStaysNow();


      showBanner(
        "☁️ 已建立住宿雲端資料。"
      );

    }

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    stays =
      localStays || [];


    setCloudStatus(
      "離線備份模式",
      "error"
    );


    showBanner(
      "⚠️ Supabase 暫時無法連線，目前使用本機住宿備份。",
      "error"
    );

  }


  render();

}


/* =========================
   RENDER
========================= */

function render() {

  document.getElementById(
    "stayCount"
  ).textContent =
    stays.length +
    " 間住宿";


  const container =
    document.getElementById(
      "stayList"
    );


  container.innerHTML =
    "";


  if (
    stays.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          <div class="empty-icon">
            🏨
          </div>

          <strong>
            還沒有住宿
          </strong>

          按上面的「＋ 新增住宿」開始建立。

        </div>
      `;


    return;

  }


  stays.forEach(
    (
      stay,
      index
    ) => {

      container.appendChild(
        createStayCard(
          stay,
          index
        )
      );

    }
  );

}


/* =========================
   STAY CARD
========================= */

function createStayCard(
  stay,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "stay-card";


  card.innerHTML =
    `

      <div class="stay-top">

        <div class="stay-number">
          ${index + 1}
        </div>


        <input
          class="stay-name"
          placeholder="飯店 / 民宿名稱"
          value="${escapeAttribute(stay.name)}"
        >


        <button
          class="delete-button"
          title="刪除"
        >
          ×
        </button>

      </div>


      <div class="grid">


        <div class="field-wrap">

          <label>
            城市 / 區域
          </label>

          <input
            class="field city"
            placeholder="例如：Florence"
            value="${escapeAttribute(stay.city)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            訂房平台
          </label>

          <input
            class="field platform"
            placeholder="Booking / Airbnb / 官網"
            value="${escapeAttribute(stay.platform)}"
          >

        </div>


        <div class="section-title">
          📅 入住 / 退房
        </div>


        <div class="field-wrap">

          <label>
            入住日期
          </label>

          <input
            class="field checkInDate"
            type="date"
            value="${escapeAttribute(stay.checkInDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            入住時間
          </label>

          <input
            class="field checkInTime"
            type="time"
            value="${escapeAttribute(stay.checkInTime)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            退房日期
          </label>

          <input
            class="field checkOutDate"
            type="date"
            value="${escapeAttribute(stay.checkOutDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            退房時間
          </label>

          <input
            class="field checkOutTime"
            type="time"
            value="${escapeAttribute(stay.checkOutTime)}"
          >

        </div>


        <div class="section-title">
          📍 地點
        </div>


        <div class="field-wrap full">

          <label>
            地址
          </label>

          <input
            class="field address"
            placeholder="住宿完整地址"
            value="${escapeAttribute(stay.address)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            Google Maps 分享連結
          </label>

          <input
            class="field maps"
            placeholder="https://maps.google.com/..."
            value="${escapeAttribute(stay.maps)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            電話
          </label>

          <input
            class="field phone"
            placeholder="+39 ..."
            value="${escapeAttribute(stay.phone)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            停車
          </label>

          <input
            class="field parking"
            placeholder="免費 / €20 / 無停車位"
            value="${escapeAttribute(stay.parking)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            早餐
          </label>

            class="field breakfast"
            placeholder="有 / 無 / 另加價"
            value="${escapeAttribute(stay.breakfast)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            訂單編號
          </label>

          <input
            class="field bookingNo"
            placeholder="Confirmation number"
            value="${escapeAttribute(stay.bookingNo)}"
          >

        </div>


        <div class="section-title">
          💳 金額 / 付款
        </div>


        <div class="field-wrap">

          <label>
            金額
          </label>

          <input
            class="field amount"
            inputmode="decimal"
            placeholder="4100"
            value="${escapeAttribute(stay.amount)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            幣別
          </label>

          <select class="field currency">

            ${currencyOptions(
              stay.currency
            )}

          </select>

        </div>


        <div class="field-wrap full">

          <label>
            付款狀態
          </label>

          <input
            class="field paymentStatus"
            placeholder="已付款 / 現場付款 / 可免費取消"
            value="${escapeAttribute(stay.paymentStatus)}"
          >

        </div>


        <div class="section-title">
          📄 文件 / 備註
        </div>


        <div class="field-wrap full">

          <label>
            私人文件連結
          </label>

          <input
            class="field documentLink"
            placeholder="之後可放 Supabase 私人文件連結"
            value="${escapeAttribute(stay.documentLink)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field notes"
            placeholder="入住方式、門鎖、行李寄放、ZTL、注意事項……"
          >${escapeHtml(stay.notes)}</textarea>

        </div>

      </div>


      <div class="actions">

        <button
          class="action-button map-button openMap"
        >
          📍 Google Maps
        </button>


        <button
          class="action-button link-button openDocument"
        >
          📄 開啟文件
        </button>


        <button
          class="action-button moveUp"
        >
          ↑ 上移
        </button>


        <button
          class="action-button moveDown"
        >
          ↓ 下移
        </button>

      </div>

    `;


  bindInput(
    card,
    ".stay-name",
    stay,
    "name"
  );


  bindInput(
    card,
    ".city",
    stay,
    "city"
  );


  bindInput(
    card,
    ".platform",
    stay,
    "platform"
  );


  bindInput(
    card,
    ".checkInDate",
    stay,
    "checkInDate"
  );


  bindInput(
    card,
    ".checkInTime",
    stay,
    "checkInTime"
  );


  bindInput(
    card,
    ".checkOutDate",
    stay,
    "checkOutDate"
  );


  bindInput(
    card,
    ".checkOutTime",
    stay,
    "checkOutTime"
  );


  bindInput(
    card,
    ".address",
    stay,
    "address"
  );


  bindInput(
    card,
    ".maps",
    stay,
    "maps"
  );


  bindInput(
    card,
    ".phone",
    stay,
    "phone"
  );


  bindInput(
    card,
    ".parking",
    stay,
    "parking"
  );


  bindInput(
    card,
    ".breakfast",
    stay,
    "breakfast"
  );


  bindInput(
    card,
    ".bookingNo",
    stay,
    "bookingNo"
  );


  bindInput(
    card,
    ".amount",
    stay,
    "amount"
  );


  bindInput(
    card,
    ".paymentStatus",
    stay,
    "paymentStatus"
  );


  bindInput(
    card,
    ".documentLink",
    stay,
    "documentLink"
  );


  bindInput(
    card,
    ".notes",
    stay,
    "notes"
  );


  const currency =
    card.querySelector(
      ".currency"
    );


  currency.onchange =
    () => {

      stay.currency =
        currency.value;

      scheduleCloudSave();

    };


  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這間住宿嗎？"
        );


      if (!okay) {
        return;
      }


      stays.splice(
        index,
        1
      );


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveUp"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      [
        stays[index - 1],
        stays[index]
      ] =
      [
        stays[index],
        stays[index - 1]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveDown"
  ).onclick =
    () => {

      if (
        index ===
        stays.length - 1
      ) {
        return;
      }


      [
        stays[index],
        stays[index + 1]
      ] =
      [
        stays[index + 1],
        stays[index]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".openMap"
  ).onclick =
    () => {

      openMap(
        stay
      );

    };


  card.querySelector(
    ".openDocument"
  ).onclick =
    () => {

      const url =
        stay.documentLink?.trim();


      if (!url) {

        alert(
          "這間住宿還沒有文件連結。"
        );

        return;

      }


      window.open(
        url,
        "_blank",
        "noopener"
      );

    };


  return card;

}


/* =========================
   INPUT
========================= */

function bindInput(
  card,
  selector,
  object,
  key
) {

  const element =
    card.querySelector(
      selector
    );


  element.oninput =
    () => {

      object[key] =
        element.value;

      scheduleCloudSave();

    };

}


/* =========================
   ADD
========================= */

document.getElementById(
  "addStay"
).onclick =
  () => {

    stays.push(
      newStay()
    );


    scheduleCloudSave();

    render();

  };


/* =========================
   MAP
========================= */

function openMap(
  stay
) {

  if (
    stay.maps &&
    stay.maps.trim()
  ) {

    window.open(
      stay.maps.trim(),
      "_blank",
      "noopener"
    );

    return;

  }


  const query =
    stay.address?.trim() ||
    stay.name?.trim();


  if (!query) {

    alert(
      "先填住宿名稱或地址。"
    );

    return;

  }


  window.open(
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(query),
    "_blank",
    "noopener"
  );

}


/* =========================
   OPTIONS
========================= */

function currencyOptions(
  selected
) {

  const currencies =
    [
      "EUR",
      "TWD",
      "USD",
      "JPY",
      "GBP",
      "AUD",
      "CNY"
    ];


  if (
    selected &&
    !currencies.includes(selected)
  ) {

    currencies.push(
      selected
    );

  }


  return currencies
    .map(
      currency =>
        `
          <option
            value="${escapeAttribute(currency)}"
            ${
              currency === selected
                ? "selected"
                : ""
            }
          >
            ${escapeHtml(currency)}
          </option>
        `
    )
    .join("");

}


/* =========================
   ESCAPE
========================= */

function escapeHtml(
  text = ""
) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}


/* =========================
   START
========================= */

initializeCloud();

</script>
