<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>住宿｜Travel Hub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #827d75;
      --line: #e8e2d9;
      --accent: #9a7350;
      --accent-soft: #eee4d8;
      --dark: #2e2d29;
      --danger: #a65a52;
      --green-soft: #e7eee7;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(950px, calc(100% - 24px));
      margin: auto;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(244,241,235,0.93);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      border-radius: 14px;
      background: white;

      display: grid;
      place-items: center;

      box-shadow: var(--shadow);
    }

    .save-status {
      font-size: 12px;
      color: var(--muted);
    }


    /* PAGE TITLE */

    .page-head {
      padding: 20px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }


    /* TOOLBAR */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 10px;

      margin: 12px 0 18px;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .add-button {
      border: 0;

      padding: 11px 15px;

      border-radius: 14px;

      background: var(--accent-soft);
      color: #72543b;

      font-weight: 700;
    }


    /* STAY CARD */

    .stay-list {
      display: grid;
      gap: 15px;
    }

    .stay-card {
      background: white;

      border-radius: 24px;

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .stay-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;

      margin-bottom: 15px;
    }

    .stay-number {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .stay-title {
      border: 0;
      outline: none;

      width: 100%;

      padding: 0;

      background: transparent;

      font-size: 22px;
      font-weight: 800;

      color: var(--text);
    }

    .stay-title::placeholder {
      color: #bbb3aa;
    }

    .city-input {
      border: 0;
      outline: none;

      width: 100%;

      padding: 0;
      margin-top: 5px;

      background: transparent;

      color: var(--muted);

      font-size: 13px;
    }

    .city-input::placeholder {
      color: #bdb5ac;
    }


    /* FORM */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .grid.three {
      grid-template-columns: repeat(3, 1fr);
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .field-wrap.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 11px;
      color: var(--muted);
      padding-left: 2px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 14px;

      padding: 11px 12px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      background: white;
      border-color: #bba58f;
    }

    textarea.field {
      resize: vertical;
      min-height: 85px;
      line-height: 1.55;
    }


    /* LINKS */

    .link-row {
      display: grid;
      grid-template-columns: 1fr auto;

      gap: 8px;
    }

    .open-button {
      border: 0;

      border-radius: 14px;

      padding: 0 14px;

      font-weight: 700;

      white-space: nowrap;

      background: var(--green-soft);
    }

    .pdf-button {
      background: #eee8f3;
    }

    .open-button:disabled {
      opacity: 0.35;
      cursor: default;
    }


    /* INFO */

    .info-row {
      margin-top: 13px;

      padding-top: 13px;

      border-top: 1px solid var(--line);
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }


    /* ACTIONS */

    .actions {
      display: flex;
      gap: 7px;

      margin-top: 15px;

      flex-wrap: wrap;
    }

    .action-button {
      border: 0;

      border-radius: 11px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 12px;
    }

    .delete-button {
      color: var(--danger);
      margin-left: auto;
    }


    /* EMPTY */

    .empty {
      padding: 45px 20px;

      text-align: center;

      border-radius: 24px;

      border: 1px dashed #cabdac;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .empty strong {
      display: block;
      color: var(--text);
      margin-bottom: 5px;
    }

    .empty p {
      margin: 0;
      font-size: 13px;
    }


    /* SAFETY */

    .safety {
      margin-top: 22px;

      padding: 15px;

      border-radius: 18px;

      background: #f4e7d6;

      font-size: 12px;
      line-height: 1.65;
    }

    .safety strong {
      display: block;
      margin-bottom: 3px;
    }


    /* NAV */

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;
      grid-template-columns: repeat(5, 1fr);

      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      align-items: center;
      justify-content: center;

      flex-direction: column;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);
      font-weight: 700;
    }


    /* MOBILE */

    @media (max-width: 650px) {

      .grid,
      .grid.three,
      .mini-grid {
        grid-template-columns: 1fr;
      }

      .link-row {
        grid-template-columns: 1fr;
      }

      .open-button {
        min-height: 44px;
      }

      .delete-button {
        margin-left: 0;
      }

      .stay-title {
        font-size: 20px;
      }

    }

  </style>
</head>


<body>


<header>

  <div class="container topbar">

    <a
      class="back"
      href="index.html"
    >

      <div class="back-icon">
        ←
      </div>

      <div>
        住宿
      </div>

    </a>


    <div
      class="save-status"
      id="saveStatus"
    >
      自動儲存
    </div>

  </div>

</header>



<main class="container">


  <section class="page-head">

    <h1>
      🏨 住宿
    </h1>

    <p>
      管理每一間住宿的入住資訊、地址與確認文件
    </p>

  </section>



  <div class="toolbar">

    <div
      class="count"
      id="stayCount"
    >
      0 間住宿
    </div>

    <button
      class="add-button"
      id="addStay"
    >
      ＋ 新增住宿
    </button>

  </div>



  <div
    class="stay-list"
    id="stayList"
  ></div>



  <div class="safety">

    <strong>
      🔐 關於住宿確認單
    </strong>

    目前這個 GitHub 網站是公開的，所以不要把含有私人姓名、電話、訂單編號或付款資訊的 PDF 直接上傳到公開 Repository。之後我們會把私人文件另外處理，再讓這裡的「查看確認單」按鈕連過去。

  </div>


</main>



<nav>

  <a
    class="nav-link"
    href="index.html"
  >
    <span class="nav-icon">
      🏠
    </span>
    今天
  </a>


  <a
    class="nav-link"
    href="itinerary.html"
  >
    <span class="nav-icon">
      📅
    </span>
    行程
  </a>


  <a
    class="nav-link"
    href="#"
  >
    <span class="nav-icon">
      🗺️
    </span>
    地圖
  </a>


  <a
    class="nav-link"
    href="#"
  >
    <span class="nav-icon">
      🎫
    </span>
    票券
  </a>


  <a
    class="nav-link active"
    href="stays.html"
  >
    <span class="nav-icon">
      🏨
    </span>
    住宿
  </a>

</nav>



<script>


const STORAGE_KEY =
  "travelHubItaly2026Stays";


let stays = [];



function loadData() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {
    stays = [];
    return;
  }


  try {

    stays =
      JSON.parse(saved);

  }

  catch {

    stays = [];

  }

}



function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stays)
  );


  const status =
    document.getElementById(
      "saveStatus"
    );


  status.textContent =
    "已儲存 ✓";


  clearTimeout(
    window.saveTimer
  );


  window.saveTimer =
    setTimeout(
      () => {

        status.textContent =
          "自動儲存";

      },
      1200
    );

}



function newStay() {

  return {

    name: "",
    city: "",

    checkInDate: "",
    checkOutDate: "",

    checkInTime: "",
    checkOutTime: "",

    address: "",
    maps: "",

    platform: "",
    bookingNumber: "",

    paymentStatus: "未設定",
    amount: "",
    currency: "EUR",

    phone: "",

    parking: "",
    breakfast: "",

    pdf: "",

    note: ""

  };

}



function render() {

  const container =
    document.getElementById(
      "stayList"
    );


  const count =
    document.getElementById(
      "stayCount"
    );


  count.textContent =
    stays.length +
    " 間住宿";


  container.innerHTML =
    "";


  if (
    stays.length === 0
  ) {

    container.innerHTML =
      `

        <div class="empty">

          <div class="empty-icon">
            🏨
          </div>

          <strong>
            還沒有加入住宿
          </strong>

          <p>
            按「＋ 新增住宿」建立第一間住宿。
          </p>

        </div>

      `;


    return;

  }



  stays.forEach(
    (
      stay,
      index
    ) => {

      container.appendChild(
        createStayCard(
          stay,
          index
        )
      );

    }
  );

}



function createStayCard(
  stay,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "stay-card";


  card.innerHTML =
    `

      <div class="stay-head">

        <div style="flex:1">

          <div class="stay-number">
            STAY ${index + 1}
          </div>

          <input
            class="stay-title stay-name"
            placeholder="住宿名稱"
            value="${escapeAttribute(stay.name)}"
          >

          <input
            class="city-input stay-city"
            placeholder="城市 / 地區"
            value="${escapeAttribute(stay.city)}"
          >

        </div>

      </div>



      <div class="grid">

        <div class="field-wrap">

          <label>
            Check-in 日期
          </label>

          <input
            class="field checkin-date"
            type="date"
            value="${escapeAttribute(stay.checkInDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            Check-out 日期
          </label>

          <input
            class="field checkout-date"
            type="date"
            value="${escapeAttribute(stay.checkOutDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            Check-in 時間
          </label>

          <input
            class="field checkin-time"
            placeholder="例如 15:00"
            value="${escapeAttribute(stay.checkInTime)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            Check-out 時間
          </label>

          <input
            class="field checkout-time"
            placeholder="例如 11:00"
            value="${escapeAttribute(stay.checkOutTime)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            地址
          </label>

          <input
            class="field address"
            placeholder="住宿完整地址"
            value="${escapeAttribute(stay.address)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            Google Maps
          </label>

          <div class="link-row">

            <input
              class="field maps"
              placeholder="貼上 Google Maps 連結"
              value="${escapeAttribute(stay.maps)}"
            >

            <button
              class="open-button maps-open"
            >
              📍 導航
            </button>

          </div>

        </div>

      </div>



      <div class="info-row">

        <div class="grid three">

          <div class="field-wrap">

            <label>
              訂房平台
            </label>

            <input
              class="field platform"
              placeholder="Booking / Airbnb..."
              value="${escapeAttribute(stay.platform)}"
            >

          </div>


          <div class="field-wrap">

            <label>
              訂房編號
            </label>

            <input
              class="field booking-number"
              placeholder="Booking reference"
              value="${escapeAttribute(stay.bookingNumber)}"
            >

          </div>


          <div class="field-wrap">

            <label>
              付款狀態
            </label>

            <select
              class="field payment-status"
            >

              ${paymentOptions(stay.paymentStatus)}

            </select>

          </div>


          <div class="field-wrap">

            <label>
              金額
            </label>

            <input
              class="field amount"
              inputmode="decimal"
              placeholder="0"
              value="${escapeAttribute(stay.amount)}"
            >

          </div>


          <div class="field-wrap">

            <label>
              幣別
            </label>

            <select
              class="field currency"
            >

              ${currencyOptions(stay.currency)}

            </select>

          </div>


          <div class="field-wrap">

            <label>
              聯絡電話
            </label>

            <input
              class="field phone"
              placeholder="+39..."
              value="${escapeAttribute(stay.phone)}"
            >

          </div>

        </div>

      </div>



      <div class="info-row">

        <div class="mini-grid">

          <div class="field-wrap">

            <label>
              🚗 停車
            </label>

            <input
              class="field parking"
              placeholder="免費 / 付費 / 無"
              value="${escapeAttribute(stay.parking)}"
            >

          </div>


          <div class="field-wrap">

            <label>
              🍳 早餐
            </label>

            <input
              class="field breakfast"
              placeholder="有 / 無 / 另付費"
              value="${escapeAttribute(stay.breakfast)}"
            >

          </div>


          <div class="field-wrap">

            <label>
              📄 住宿確認單
            </label>

            <div class="link-row">

              <input
                class="field pdf"
                placeholder="PDF 私人連結"
                value="${escapeAttribute(stay.pdf)}"
              >

              <button
                class="open-button pdf-button pdf-open"
              >
                查看
              </button>

            </div>

          </div>

        </div>

      </div>



      <div class="info-row">

        <div class="field-wrap">

          <label>
            備註
          </label>

          <textarea
            class="field note"
            placeholder="例如：鑰匙盒密碼、晚到入住方式、停車入口、洗衣機位置、住宿注意事項……"
          >${escapeHtml(stay.note)}</textarea>

        </div>

      </div>



      <div class="actions">

        <button
          class="action-button move-up"
        >
          ↑ 上移
        </button>


        <button
          class="action-button move-down"
        >
          ↓ 下移
        </button>


        <button
          class="action-button delete-button"
        >
          🗑 刪除住宿
        </button>

      </div>

    `;



  const fields = {

    name:
      card.querySelector(
        ".stay-name"
      ),

    city:
      card.querySelector(
        ".stay-city"
      ),

    checkInDate:
      card.querySelector(
        ".checkin-date"
      ),

    checkOutDate:
      card.querySelector(
        ".checkout-date"
      ),

    checkInTime:
      card.querySelector(
        ".checkin-time"
      ),

    checkOutTime:
      card.querySelector(
        ".checkout-time"
      ),

    address:
      card.querySelector(
        ".address"
      ),

    maps:
      card.querySelector(
        ".maps"
      ),

    platform:
      card.querySelector(
        ".platform"
      ),

    bookingNumber:
      card.querySelector(
        ".booking-number"
      ),

    paymentStatus:
      card.querySelector(
        ".payment-status"
      ),

    amount:
      card.querySelector(
        ".amount"
      ),

    currency:
      card.querySelector(
        ".currency"
      ),

    phone:
      card.querySelector(
        ".phone"
      ),

    parking:
      card.querySelector(
        ".parking"
      ),

    breakfast:
      card.querySelector(
        ".breakfast"
      ),

    pdf:
      card.querySelector(
        ".pdf"
      ),

    note:
      card.querySelector(
        ".note"
      )

  };



  Object.entries(
    fields
  ).forEach(
    (
      [
        key,
        element
      ]
    ) => {

      const event =
        element.tagName ===
        "SELECT"
        ? "change"
        : "input";


      element.addEventListener(
        event,
        () => {

          stay[key] =
            element.value;

          updateButtons();

          saveData();

        }
      );

    }
  );



  const mapsButton =
    card.querySelector(
      ".maps-open"
    );


  const pdfButton =
    card.querySelector(
      ".pdf-open"
    );



  function updateButtons() {

    mapsButton.disabled =
      !stay.maps.trim();


    pdfButton.disabled =
      !stay.pdf.trim();

  }



  mapsButton.onclick =
    () => {

      if (!stay.maps) {
        return;
      }


      window.open(
        stay.maps,
        "_blank",
        "noopener"
      );

    };



  pdfButton.onclick =
    () => {

      if (!stay.pdf) {
        return;
      }


      window.open(
        stay.pdf,
        "_blank",
        "noopener"
      );

    };



  card.querySelector(
    ".move-up"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      [
        stays[index - 1],
        stays[index]
      ] =
      [
        stays[index],
        stays[index - 1]
      ];


      saveData();

      render();

  };



  card.querySelector(
    ".move-down"
  ).onclick =
    () => {

      if (
        index ===
        stays.length - 1
      ) {
        return;
      }


      [
        stays[index],
        stays[index + 1]
      ] =
      [
        stays[index + 1],
        stays[index]
      ];


      saveData();

      render();

    };



  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這間住宿嗎？"
        );


      if (!okay) {
        return;
      }


      stays.splice(
        index,
        1
      );


      saveData();

      render();

    };


  updateButtons();


  return card;

}



function paymentOptions(
  selected
) {

  const options =
    [
      "未設定",
      "未付款",
      "部分付款",
      "已付款",
      "現場付款",
      "免費取消"
    ];


  return options
    .map(
      option =>
        `
          <option
            value="${option}"
            ${
              option === selected
              ? "selected"
              : ""
            }
          >
            ${option}
          </option>
        `
    )
    .join("");

}



function currencyOptions(
  selected
) {

  const options =
    [
      "EUR",
      "TWD",
      "USD",
      "AUD",
      "JPY",
      "GBP"
    ];


  return options
    .map(
      option =>
        `
          <option
            value="${option}"
            ${
              option === selected
              ? "selected"
              : ""
            }
          >
            ${option}
          </option>
        `
    )
    .join("");

}



document.getElementById(
  "addStay"
).onclick =
  () => {

    stays.push(
      newStay()
    );


    saveData();

    render();


    setTimeout(
      () => {

        const cards =
          document.querySelectorAll(
            ".stay-card"
          );


        const last =
          cards[
            cards.length - 1
          ];


        last
          ?.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });


        last
          ?.querySelector(
            ".stay-name"
          )
          ?.focus();

      },
      50
    );

  };



function escapeHtml(
  text = ""
) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}



loadData();

render();
