<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>住宿｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --blue-soft: #e6edf3;
      --red-soft: #f3e3e1;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      background: white;

      border-radius: 14px;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      font-size: 11px;
      color: var(--muted);

      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;

      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .banner.show {
      display: block;
    }

    .banner.success {
      background: var(--green-soft);
    }

    .banner.error {
      background: var(--red-soft);
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 17px;

      padding: 18px;

      border-radius: 23px;

      background: var(--dark);
      color: white;

      box-shadow: var(--shadow);
    }

    .summary small {
      color: rgba(255,255,255,0.65);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 11px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;
    }

    .stay-list {
      display: grid;
      gap: 14px;
    }

    .stay-card {
      padding: 17px;

      border-radius: 22px;

      background: white;

      box-shadow: var(--shadow);
    }

    .stay-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 11px;
    }

    .stay-number {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;
    }

    .stay-name {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 18px;
      font-weight: 800;
    }

    .delete-stay {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 21px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 9px;

      margin-top: 14px;
    }

    .field-wrap {
      display: grid;

      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 75px;

      resize: vertical;

      line-height: 1.5;
    }

    .section-title {
      grid-column: 1 / -1;

      margin-top: 5px;
      padding-top: 12px;

      border-top: 1px solid var(--line);

      font-size: 12px;
      font-weight: 800;
    }

    .private-file {
      grid-column: 1 / -1;

      padding: 13px;

      border: 1px solid var(--line);
      border-radius: 16px;

      background: #f8f6f2;
    }

    .private-file strong {
      display: block;

      margin-bottom: 5px;

      font-size: 13px;
    }

    .file-status {
      min-height: 24px;

      margin-bottom: 9px;

      color: var(--muted);

      font-size: 10px;
      line-height: 1.5;

      word-break: break-word;
    }

    .file-input {
      width: 100%;

      font-size: 11px;
    }

    .file-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-top: 9px;
    }

    .file-button {
      border: 0;

      border-radius: 9px;

      padding: 8px 10px;

      background: var(--blue-soft);

      font-size: 10px;
    }

    .file-button.delete {
      background: var(--red-soft);
      color: var(--danger);
    }

    .legacy-note {
      margin-top: 7px;

      color: var(--muted);

      font-size: 10px;
    }

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 13px;
      padding-top: 12px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-button {
      background: var(--green-soft);
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .privacy {
      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 15px;

      background: var(--green-soft);

      color: #536553;

      font-size: 11px;
      line-height: 1.6;
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      height: 72px;

      display: grid;
      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 650px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .full,
      .section-title,
      .private-file {
        grid-column: auto;
      }

    }
  </style>
</head>


<body>

<header>

  <div class="container topbar">

    <a class="back" href="index.html">

      <div class="back-icon">
        ←
      </div>

      <div>
        住宿
      </div>

    </a>


    <div class="right-header">

      <div
        class="cloud-dot"
        id="cloudDot"
      ></div>

      <div
        class="save-status"
        id="saveStatus"
      >
        連線中…
      </div>

    </div>

  </div>

</header>


<main class="container">

  <section class="page-head">

    <h1>
      🏨 住宿
    </h1>

    <p>
      飯店、民宿、入住資訊，以及登入後才能開啟的私人訂房文件
    </p>

  </section>


  <div
    class="banner"
    id="banner"
  ></div>


  <section class="summary">

    <div>

      <small>
        Italy 2026
      </small>

      <strong id="stayCount">
        0 間住宿
      </strong>

    </div>


    <button
      class="add-button"

  </div>

</main>


<nav>

  <a class="nav-link" href="index.html">
    <span class="nav-icon">🏠</span>
    今天

  <a class="nav-link" href="itinerary.html">

  <a class="nav-link" href="map.html">

</nav>


<script>

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const BUCKET =
  "travel-private";


const STORAGE_KEY =
  "travelHubItaly2026Stays";


const MODULE_KEY =
  "stays";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


let currentUser =
  null;


let stays =
  [];


let saveTimer =
  null;


/* =========================
   HELPERS
========================= */

function makeId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function text(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value);

}


function first(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }


  return fallback;

}


function normalizeStay(
  old = {}
) {

  return {

    ...old,

    id:
      text(
        first(
          old,
          ["id"],
          makeId()
        )
      ),

    name:
      text(
        first(
          old,
          [
            "name",
            "hotelName",
            "title"
          ]
        )
      ),

    city:
      text(
        first(
          old,
          ["city","area"]
        )
      ),

    platform:
      text(
        first(
          old,
          [
            "platform",
            "bookingPlatform"
          ]
        )
      ),

    checkInDate:
      text(
        first(
          old,
          [
            "checkInDate",
            "checkIn",
            "checkin"
          ]
        )
      ),

    checkInTime:
      text(
        first(
          old,
          [
            "checkInTime",
            "checkinTime"
          ]
        )
      ),

    checkOutDate:
      text(
        first(
          old,
          [
            "checkOutDate",
            "checkOut",
            "checkout"
          ]
        )
      ),

    checkOutTime:
      text(
        first(
          old,
          [
            "checkOutTime",
            "checkoutTime"
          ]
        )
      ),

    address:
      text(
        first(
          old,
          ["address"]
        )
      ),

    maps:
      text(
        first(
          old,
          [
            "maps",
            "map",
            "mapLink"
          ]
        )
      ),

    phone:
      text(
        first(
          old,
          ["phone"]
        )
      ),

    parking:
      text(
        first(
          old,
          ["parking"]
        )
      ),

    breakfast:
      text(
        first(
          old,
          ["breakfast"]
        )
      ),

    bookingNo:
      text(
        first(
          old,
          [
            "bookingNo",
            "booking",
            "bookingNumber",
            "confirmation"
          ]
        )
      ),

    amount:
      text(
        first(
          old,
          ["amount","price"]
        )
      ),

    currency:
      text(
        first(
          old,
          ["currency"],
          "EUR"
        )
      ) || "EUR",

    paymentStatus:
      text(
        first(
          old,
          [
            "paymentStatus",
            "payment"
          ]
        )
      ),

    notes:
      text(
        first(
          old,
          [
            "notes",
            "note"
          ]
        )
      ),

    documentPath:
      text(
        first(
          old,
          ["documentPath"]
        )
      ),

    documentName:
      text(
        first(
          old,
          ["documentName"]
        )
      ),

    documentLink:
      text(
        first(
          old,
          [
            "documentLink",
            "pdf",
            "pdfLink",
            "document"
          ]
        )
      )

  };

}


function normalizeStays(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return data.map(
      normalizeStay
    );

  }


  if (
    data &&
    Array.isArray(data.stays)
  ) {

    return data.stays.map(
      normalizeStay
    );

  }


  return [];

}


function newStay() {

  return normalizeStay({
    id: makeId(),
    currency: "EUR"
  });

}


function escapeHtml(
  value
) {

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   STATUS
========================= */

function setStatus(
  message,
  type = ""
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    message;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {

    dot.classList.add(
      type
    );

  }

}


function showBanner(
  message,
  type = "success"
) {

  const box =
    document.getElementById(
      "banner"
    );


  box.textContent =
    message;


  box.className =
    "banner show " +
    type;


  setTimeout(
    () => {

      box.className =
        "banner";

    },
    5000
  );

}


/* =========================
   LOCAL
========================= */

function loadLocal() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    return normalizeStays(
      JSON.parse(raw)
    );

  }

  catch {

    return null;

  }

}


function saveLocal() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(stays)
  );

}


/* =========================
   CLOUD DATA
========================= */

async function loadCloud() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .select(
        "data"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function saveCloud() {

  saveLocal();


  setStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 2,
            stays: stays
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {
    throw error;
  }


  setStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleSave() {

  saveLocal();


  setStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      () => {

        saveCloud()
          .catch(
            error => {

              console.error(error);


              setStatus(
                "同步失敗",
                "error"
              );

            }
          );

      },
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initialize() {

  try {

    setStatus(
      "登入確認中…"
    );


    const {
      data
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      !data.session
    ) {

      location.href =
        "login.html";

      return;

    }


    currentUser =
      data.session.user;


    setStatus(
      "讀取雲端…",
      "saving"
    );


    const local =
      loadLocal();


    const row =
      await loadCloud();


    if (
      row &&
      row.data
    ) {

      stays =
        normalizeStays(
          row.data
        );


      saveLocal();

    }

    else if (
      local
    ) {

      stays =
        local;


      await saveCloud();

    }

    else {

      stays =
        [];


      await saveCloud();

    }


    render();


    setStatus(
      "已同步 ☁️",
      "online"
    );

  }

  catch (
    error
  ) {

    console.error(error);


    stays =
      loadLocal() ||
      [];


    render();


    setStatus(
      "載入發生錯誤",
      "error"
    );

  }

}


/* =========================
   STORAGE
========================= */

function safeName(
  value
) {

  return text(value || "file")
    .replaceAll("/", "-")
    .replaceAll("\\", "-")
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


async function uploadDocument(
  stay,
  file
) {

  if (!file) {
    return;
  }


  try {

    setStatus(
      "檔案上傳中…",
      "saving"
    );


    const path =
      currentUser.id +
      "/stays/" +
      stay.id +
      "/document/" +
      Date.now() +
      "-" +
      makeId() +
      "-" +
      safeName(
        file.name
      );


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            cacheControl: "3600"
          }
        );


    if (error) {
      throw error;
    }


    const oldPath =
      stay.documentPath;


    stay.documentPath =
      path;


    stay.documentName =
      file.name;


    await saveCloud();


    if (
      oldPath &&
      oldPath !== path
    ) {

      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .remove([
          oldPath
        ]);

    }


    render();


    showBanner(
      "🔒 私人住宿文件已上傳完成。"
    );

  }

  catch (
    error
  ) {

    console.error(error);


    setStatus(
      "上傳失敗",
      "error"
    );


    showBanner(
      "⚠️ 文件上傳失敗。",
      "error"
    );

  }

}


async function openDocument(
  stay
) {

  if (
    stay.documentPath
  ) {

    const popup =
      window.open(
        "about:blank",
        "_blank"
      );


    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .createSignedUrl(
          stay.documentPath,
          600
        );


    if (error) {

      if (popup) {
        popup.close();
      }


      alert(
        "目前無法開啟私人文件。"
      );


      return;

    }


    if (popup) {

      popup.location =
        data.signedUrl;

    }


    return;

  }


  if (
    stay.documentLink
  ) {

    window.open(
      stay.documentLink,
      "_blank",
      "noopener"
    );


    return;

  }


  alert(
    "這間住宿還沒有文件。"
  );

}


async function deleteDocument(
  stay
) {

  if (
    !stay.documentPath
  ) {

    return;

  }


  if (
    !confirm(
      "確定要刪除這份私人住宿文件嗎？"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        BUCKET
      )
      .remove([
        stay.documentPath
      ]);


  if (error) {

    alert(
      "刪除失敗。"
    );


    return;

  }


  stay.documentPath =
    "";


  stay.documentName =
    "";


  await saveCloud();


  render();

}


/* =========================
   RENDER
========================= */

function render() {

  document.getElementById(
    "stayCount"
  ).textContent =
    stays.length +
    " 間住宿";


  const container =
    document.getElementById(
      "stayList"
    );


  if (
    stays.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">
          🏨<br><br>
          <strong>還沒有住宿</strong>
        </div>
      `;


    return;

  }


  container.innerHTML =
    stays
      .map(
        stayHtml
      )
      .join("");

}


function stayHtml(
  stay,
  index
) {

  return `

    <section
      class="stay-card"
      data-index="${index}"
    >

      <div class="stay-top">

        <div class="stay-number">
          ${index + 1}
        </div>


        <input
          class="stay-name"
          data-field="name"
          value="${escapeHtml(stay.name)}"
          placeholder="飯店 / 民宿名稱"
        >


        <button
          class="delete-stay"
          data-action="delete-stay"
        >
          ×
        </button>

      </div>


      <div class="grid">


        <div class="field-wrap">

          <label>城市 / 區域</label>

          <input
            class="field"
            data-field="city"
            value="${escapeHtml(stay.city)}"
          >

        </div>


        <div class="field-wrap">

          <label>訂房平台</label>

          <input
            class="field"

          >

        </div>


        <div class="section-title">

        </div>


        <div class="field-wrap">

          <label>入住日期</label>

          <input
            class="field"
            type="date"
            data-field="checkInDate"
            value="${escapeHtml(stay.checkInDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>入住時間</label>

          <input
            class="field"
            type="time"
            data-field="checkInTime"
            value="${escapeHtml(stay.checkInTime)}"
          >

        </div>


        <div class="field-wrap">

          <label>退房日期</label>

          <input
            class="field"
            type="date"
            data-field="checkOutDate"
            value="${escapeHtml(stay.checkOutDate)}"
          >

        </div>


        <div class="field-wrap">

          <label>退房時間</label>

          <input
            class="field"
            type="time"
            data-field="checkOutTime"
            value="${escapeHtml(stay.checkOutTime)}"
          >

        </div>


        <div class="section-title">
          📍 地點
        </div>


        <div class="field-wrap full">

          <label>地址</label>

          <input
            class="field"
            data-field="address"
            value="${escapeHtml(stay.address)}"
          >

        </div>


        <div class="field-wrap full">

          <label>Google Maps 分享連結</label>

          <input
            class="field"
            data-field="maps"
            value="${escapeHtml(stay.maps)}"
          >

        </div>


        <div class="field-wrap">

          <label>電話</label>

          <input
            class="field"
            data-field="phone"
            value="${escapeHtml(stay.phone)}"
          >

        </div>


        <div class="field-wrap">

          <label>停車</label>

          <input
            class="field"
            data-field="parking"
            value="${escapeHtml(stay.parking)}"
          >

        </div>


        <div class="field-wrap">

          <label>早餐</label>

          <input
            class="field"
            data-field="breakfast"
            value="${escapeHtml(stay.breakfast)}"
          >

        </div>


        <div class="field-wrap">

          <label>訂單編號</label>

          <input
            class="field"
            data-field="bookingNo"
            value="${escapeHtml(stay.bookingNo)}"
          >

        </div>


        <div class="section-title">
          💳 金額 / 付款
        </div>


        <div class="field-wrap">

          <label>金額</label>

          <input
            class="field"
            data-field="amount"
            value="${escapeHtml(stay.amount)}"
          >

        </div>


        <div class="field-wrap">

          <label>幣別</label>

        <div class="private-file">

          </strong>


          <div class="file-status">

            ${
              stay.documentPath
                ?

function currencyOptions(
  selected
) {

  const values =
    [
      "EUR",
      "TWD",
      "USD",
      "GBP",
      "AUD",
      "JPY",
      "CNY"
    ];


  return values
    .map(
      value =>
        `
          <option
            value="${value}"
            ${
              value === selected
                ? "selected"
                : ""
            }
          >
            ${value}
          </option>
        `
    )
    .join("");

}


/* =========================
   EVENTS
========================= */

const stayList =
  document.getElementById(
    "stayList"
  );


function getInfo(
  target
) {

  const card =
    target.closest(
      ".stay-card"
    );


  if (!card) {
    return null;
  }


  const index =
    Number(
      card.dataset.index
    );


  if (
    !Number.isInteger(index) ||
    !stays[index]
  ) {

    return null;
  }


  return {
    card,
    index,
    stay:
      stays[index]
  };

}


stayList.addEventListener(
  "input",
  event => {

    const field =
      event.target.dataset.field;


    if (!field) {
      return;
    }


    const info =
      getInfo(
        event.target
      );


    if (!info) {
      return;
    }


    info.stay[field] =
      event.target.value;


    scheduleSave();

  }
);


stayList.addEventListener(
  "change",
  async event => {

    const field =
      event.target.dataset.field;


    if (field) {

      const info =
        getInfo(
          event.target
        );


      if (info) {

        info.stay[field] =
          event.target.value;


        scheduleSave();

      }


      return;

    }


    if (
      event.target.dataset.upload ===
      "document"
    ) {

      const info =
        getInfo(
          event.target
        );


      const file =
        event.target.files &&
        event.target.files[0];


      if (
        info &&
        file
      ) {

        await uploadDocument(
          info.stay,
          file
        );

      }

    }

  }
);


stayList.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if (!button) {
      return;
    }


    const info =
      getInfo(
        button
      );


    if (!info) {
      return;
    }


    const {
      stay,
      index
    } =
      info;


    const action =
      button.dataset.action;


    if (
      action === "map"
    ) {

      if (
        stay.maps
      ) {

        window.open(
          stay.maps,
          "_blank",
          "noopener"
        );


        return;

      }


      const query =
        stay.address ||
        stay.name;


      if (!query) {

        alert(
          "請先填住宿名稱或地址。"
        );


        return;

      }


      window.open(
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(query),
        "_blank",
        "noopener"
      );


      return;

    }


    if (
      action === "open-document"
    ) {

      await openDocument(
        stay
      );


      return;

    }


    if (
      action === "delete-document"
    ) {

      await deleteDocument(
        stay
      );


      return;

    }


    if (
      action === "up"
    ) {

      if (
        index === 0
      ) {
        return;
      }


      [
        stays[index - 1],
        stays[index]
      ] =
      [
        stays[index],
        stays[index - 1]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "down"
    ) {

      if (
        index >=
        stays.length - 1
      ) {
        return;
      }


      [
        stays[index],
        stays[index + 1]
      ] =
      [
        stays[index + 1],
        stays[index]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "delete-stay"
    ) {

      if (
        !confirm(
          "確定要刪除這間住宿嗎？"
        )
      ) {

        return;

      }


      if (
        stay.documentPath
      ) {

        await supabaseClient
          .storage
          .from(
            BUCKET
          )
          .remove([
            stay.documentPath
          ]);

      }


      stays.splice(
        index,
        1
      );


      await saveCloud();


      render();

    }

  }
);


/* =========================
   ADD
========================= */

document.getElementById(
  "addStay"
).onclick =
  () => {

    stays.push(
      newStay()
    );


    scheduleSave();

    render();

  };


initialize();

</script>
