<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>每日行程｜Travel Hub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #827d75;
      --line: #e8e2d9;
      --accent: #9a7350;
      --accent-soft: #eee4d8;
      --dark: #2e2d29;
      --green-soft: #e6eee7;
      --yellow-soft: #f4eddc;
      --blue-soft: #e7edf3;
      --danger: #a65a52;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 24px));
      margin: auto;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);

      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      border-radius: 14px;

      background: white;

      display: grid;
      place-items: center;

      box-shadow: var(--shadow);
    }

    .save-status {
      color: var(--muted);
      font-size: 12px;
    }


    /* PAGE */

    .page-head {
      padding: 20px 0 9px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }


    /* DAYS */

    .day-scroll {
      position: sticky;

      top: 70px;

      z-index: 60;

      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding: 10px 0 14px;

      background: var(--bg);

      scrollbar-width: none;
    }

    .day-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-button {
      flex: 0 0 auto;

      min-width: 72px;

      border: 0;

      border-radius: 14px;

      padding: 9px 10px;

      background: white;

      color: var(--muted);

      box-shadow: var(--shadow);
    }

    .day-button strong {
      display: block;

      color: var(--text);

      font-size: 12px;
    }

    .day-button span {
      display: block;

      margin-top: 2px;

      font-size: 10px;
    }

    .day-button.active {
      background: var(--dark);
      color: white;
    }

    .day-button.active strong {
      color: white;
    }


    /* DAY INFO */

    .day-info {
      background: var(--dark);

      color: white;

      border-radius: 23px;

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .day-info-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 12px;
    }

    .day-date {
      color: rgba(255,255,255,0.62);
      font-size: 11px;
    }

    .day-info h2 {
      margin: 3px 0 0;

      font-size: 22px;
    }

    .map-link {
      border: 0;

      border-radius: 13px;

      padding: 10px 12px;

      background: white;

      color: var(--dark);

      font-weight: 750;

      white-space: nowrap;
    }

    .day-fields {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 15px;
    }

    .dark-field {
      width: 100%;

      border: 1px solid rgba(255,255,255,0.15);

      border-radius: 12px;

      padding: 10px 11px;

      background: rgba(255,255,255,0.09);

      color: white;

      outline: none;
    }

    .dark-field::placeholder {
      color: rgba(255,255,255,0.43);
    }

    textarea.dark-field {
      min-height: 70px;

      resize: vertical;

      line-height: 1.5;
    }

    .day-note-wrap {
      margin-top: 8px;
    }


    /* TOOLBAR */

    .toolbar {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin: 18px 0 11px;
    }

    .toolbar h3 {
      margin: 0;

      font-size: 18px;
    }

    .toolbar span {
      color: var(--muted);
      font-size: 11px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 10px 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 750;
    }


    /* ACTIVITY */

    .activity-list {
      display: grid;
      gap: 11px;
    }

    .activity-card {
      background: white;

      border-radius: 21px;

      padding: 15px;

      box-shadow: var(--shadow);
    }

    .activity-top {
      display: grid;

      grid-template-columns: 80px 1fr auto;

      gap: 9px;

      align-items: center;
    }

    .time-input {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 11px;

      padding: 9px;

      background: #fbfaf8;

      outline: none;

      text-align: center;

      font-weight: 750;
    }

    .activity-title {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 17px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 20px;
    }


    /* FIELDS */

    .grid {
      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 8px;

      margin-top: 12px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .field-wrap.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 68px;

      resize: vertical;

      line-height: 1.5;
    }

    .status-confirmed {
      background: var(--green-soft);
    }

    .status-tentative {
      background: var(--yellow-soft);
    }


    /* ACTIONS */

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 11px;

      padding-top: 11px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-button {
      background: var(--blue-soft);
    }


    /* EMPTY */

    .empty {
      padding: 38px 20px;

      text-align: center;

      border: 1px dashed #cbbeb0;

      border-radius: 21px;

      color: var(--muted);

      background: rgba(255,255,255,0.4);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 8px;
    }

    .empty strong {
      display: block;

      color: var(--text);

      margin-bottom: 4px;
    }


    /* NOTICE */

    .notice {
      margin-top: 18px;

      padding: 14px 15px;

      border-radius: 17px;

      background: var(--yellow-soft);

      font-size: 12px;
      line-height: 1.6;
    }

    .notice strong {
      display: block;
      margin-bottom: 3px;
    }


    /* NAV */

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      height: 72px;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);
      font-weight: 700;
    }


    @media (max-width: 650px) {

      .day-info-top {
        flex-direction: column;
      }

      .map-link {
        width: 100%;
      }

      .day-fields,
      .grid {
        grid-template-columns: 1fr;
      }

      .field-wrap.full {
        grid-column: auto;
      }

      .activity-top {
        grid-template-columns: 72px 1fr auto;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="container topbar">

    <a
      class="back"
      href="index.html"
    >

      <div class="back-icon">
        ←
      </div>

      <div>
        每日行程
      </div>

    </a>


    <div
      class="save-status"
      id="saveStatus"
    >
      自動儲存
    </div>

  </div>

</header>



<main class="container">


  <section class="page-head">

    <h1>
      📅 每日行程
    </h1>

    <p>
      這裡新增的地點，下一步會直接同步到旅行地圖
    </p>

  </section>



  <div
    class="day-scroll"
    id="dayScroll"
  ></div>



  <section class="day-info">

    <div class="day-info-top">

      <div>

        <div
          class="day-date"
          id="dayDate"
        >
          -
        </div>

        <h2 id="dayHeading">
          Day 1
        </h2>

      </div>


      <a
        class="map-link"
        href="map.html"
      >
        🗺️ 查看地圖
      </a>

    </div>


    <div class="day-fields">

      <input
        class="dark-field"
        id="dayTitle"
        placeholder="今天主題，例如：米蘭市區"
      >


      <input
        class="dark-field"
        id="dayCity"
        placeholder="城市 / 住宿區域"
      >

    </div>


    <div class="day-note-wrap">

      <textarea
        class="dark-field"
        id="dayNote"
        placeholder="這一天的整體備註……"
      ></textarea>

    </div>

  </section>



  <div class="toolbar">

    <div>

      <h3>
        今日行程
      </h3>

      <span id="activityCount">
        0 個
      </span>

    </div>


    <button
      class="add-button"
      id="addActivity"
    >
      ＋ 新增行程
    </button>

  </div>



  <div
    class="activity-list"
    id="activityList"
  ></div>



  <div class="notice">

    <strong>
      🔗 這版開始使用共用資料
    </strong>

    下一步把地圖頁也換成共用版後，你在這裡改景點名稱、地址、狀態或順序，地圖頁就會直接跟著變，不需要輸入兩次。

  </div>


</main>



<nav>

  <a
    class="nav-link"
    href="index.html"
  >
    <span class="nav-icon">🏠</span>
    今天
  </a>


  <a
    class="nav-link active"
    href="itinerary.html"
  >
    <span class="nav-icon">📅</span>

  <a

  <a

</nav>



<script>


const STORAGE_KEY =
  "travelHubItaly2026SharedPlanV1";


const START_DATE =
  new Date(
    "2026-10-01T00:00:00"
  );


let currentDay =
  1;


let plan =
  createEmptyPlan();



function createEmptyPlan() {

  return {

    version: 1,

    days:
      Array.from(
        {
          length: 21
        },
        (
          _,
          index
        ) => ({

          day:
            index + 1,

          title: "",

          city: "",

          note: "",

          activities: []

        })
      )

  };

}



function loadPlan() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {
    return;
  }


  try {

    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      Array.isArray(
        parsed.days
      ) &&
      parsed.days.length === 21
    ) {

      plan =
        parsed;

    }

  }

  catch {}

}



function savePlan() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(plan)
  );


  const status =
    document.getElementById(
      "saveStatus"
    );


  status.textContent =
    "已儲存 ✓";


  clearTimeout(
    window.saveTimer
  );


  window.saveTimer =
    setTimeout(
      () => {

        status.textContent =
          "自動儲存";

      },
      1200
    );

}



function getDateForDay(
  dayNumber
) {

  const date =
    new Date(
      START_DATE
    );


  date.setDate(
    date.getDate() +
    dayNumber -
    1
  );


  return date;

}



function formatDate(
  date
) {

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    month +
    "/" +
    day
  );

}



function currentDayData() {

  return plan.days[
    currentDay - 1
  ];

}



function renderDayButtons() {

  const container =
    document.getElementById(
      "dayScroll"
    );


  container.innerHTML =
    "";


  plan.days.forEach(
    dayData => {


      const date =
        getDateForDay(
          dayData.day
        );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "day-button" +
        (
          currentDay ===
          dayData.day
          ? " active"
          : ""
        );


      button.innerHTML =
        `

          <strong>
            Day ${dayData.day}
          </strong>

          <span>
            ${formatDate(date)}
          </span>

        `;


      button.onclick =
        () => {

          currentDay =
            dayData.day;

          render();

        };


      container.appendChild(
        button
      );

    }
  );

}



function renderDayInfo() {

  const day =
    currentDayData();


  const date =
    getDateForDay(
      currentDay
    );


  document.getElementById(
    "dayDate"
  ).textContent =
    "2026 / " +
    formatDate(date);


  document.getElementById(
    "dayHeading"
  ).textContent =
    "Day " +
    currentDay;


  const title =
    document.getElementById(
      "dayTitle"
    );


  const city =
    document.getElementById(
      "dayCity"
    );


  const note =
    document.getElementById(
      "dayNote"
    );


  title.value =
    day.title || "";


  city.value =
    day.city || "";


  note.value =
    day.note || "";


  title.oninput =
    () => {

      day.title =
        title.value;

      savePlan();

    };


  city.oninput =
    () => {

      day.city =
        city.value;

      savePlan();

    };


  note.oninput =
    () => {

      day.note =
        note.value;

      savePlan();

    };

}



function newActivity() {

  return {

    id:
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2),

    time: "",

    type: "景點",

    title: "",

    status: "暫定",

    place: "",

    maps: "",

    note: ""

  };

}



function renderActivities() {

  const container =
    document.getElementById(
      "activityList"
    );


  const activities =
    currentDayData()
      .activities;


  document.getElementById(
    "activityCount"
  ).textContent =
    activities.length +
    " 個";


  container.innerHTML =
    "";


  if (
    activities.length === 0
  ) {

    container.innerHTML =
      `

        <div class="empty">

          <div class="empty-icon">
            📅
          </div>

          <strong>
            這一天還沒有行程
          </strong>

          按「＋ 新增行程」開始安排。

        </div>

      `;


    return;

  }


  activities.forEach(
    (
      activity,
      index
    ) => {

      container.appendChild(
        createActivityCard(
          activity,
          index
        )
      );

    }
  );

}



function createActivityCard(
  activity,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "activity-card";


  card.innerHTML =
    `

      <div class="activity-top">

        <input
          class="time-input"
          placeholder="16:45"
          maxlength="5"
          value="${escapeAttribute(activity.time)}"
        >


        <input
          class="activity-title"
          placeholder="行程 / 景點名稱"
          value="${escapeAttribute(activity.title)}"
        >


        <button
          class="delete-button"
          title="刪除"
        >
          ×
        </button>

      </div>



      <div class="grid">


        <div class="field-wrap">

          <label>
            類型
          </label>

          <select
            class="field activity-type"
          >
            ${typeOptions(activity.type)}
          </select>

        </div>


        <div class="field-wrap">

          <label>
            狀態
          </label>

          <select
            class="field activity-status"
          >

            <option
              value="暫定"
              ${activity.status === "暫定" ? "selected" : ""}
            >
              🟡 暫定
            </option>

            <option
              value="已確認"
              ${activity.status === "已確認" ? "selected" : ""}
            >
              ✅ 已確認
            </option>

          </select>

        </div>


        <div class="field-wrap full">

          <label>
            地名 / 地址
          </label>

          <input
            class="field activity-place"
            placeholder="例如：Lago di Braies, Italy"
            value="${escapeAttribute(activity.place)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            Google Maps 分享連結（選填）
          </label>

          <input
            class="field activity-maps"
            placeholder="如果已經有 Maps 連結可以貼這裡"
            value="${escapeAttribute(activity.maps)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field activity-note"
            placeholder="門票、停車、交通、健行、注意事項……"
          >${escapeHtml(activity.note)}</textarea>

        </div>

      </div>



      <div class="actions">

        <button
          class="action-button map-button open-map"
        >
          📍 Google Maps
        </button>


        <button
          class="action-button move-up"
        >
          ↑ 上移
        </button>


        <button
          class="action-button move-down"
        >
          ↓ 下移
        </button>

      </div>

    `;



  const time =
    card.querySelector(
      ".time-input"
    );


  const title =
    card.querySelector(
      ".activity-title"
    );


  const type =
    card.querySelector(
      ".activity-type"
    );


  const status =
    card.querySelector(
      ".activity-status"
    );


  const place =
    card.querySelector(
      ".activity-place"
    );


  const maps =
    card.querySelector(
      ".activity-maps"
    );


  const note =
    card.querySelector(
      ".activity-note"
    );



  function updateStatusStyle() {

    status.classList.remove(
      "status-confirmed",
      "status-tentative"
    );


    if (
      status.value ===
      "已確認"
    ) {

      status.classList.add(
        "status-confirmed"
      );

    }

    else {

      status.classList.add(
        "status-tentative"
      );

    }

  }



  time.oninput =
    () => {

      let value =
        time.value
          .replace(
            /[^0-9:]/g,
            ""
          );


      if (
        /^\d{4}$/.test(value)
      ) {

        value =
          value.slice(
            0,
            2
          ) +
          ":" +
          value.slice(2);

      }


      time.value =
        value;


      activity.time =
        value;


      savePlan();

    };



  title.oninput =
    () => {

      activity.title =
        title.value;

      savePlan();

    };


  type.onchange =
    () => {

      activity.type =
        type.value;

      savePlan();

    };


  status.onchange =
    () => {

      activity.status =
        status.value;

      updateStatusStyle();

      savePlan();

    };


  place.oninput =
    () => {

      activity.place =
        place.value;

      savePlan();

    };


  maps.oninput =
    () => {

      activity.maps =
        maps.value;

      savePlan();

    };


  note.oninput =
    () => {

      activity.note =
        note.value;

      savePlan();

    };



  card.querySelector(
    ".open-map"
  ).onclick =
    () => {

      openMaps(
        activity
      );

    };



  card.querySelector(
    ".move-up"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      const activities =
        currentDayData()
          .activities;


      [
        activities[index - 1],
        activities[index]
      ] =
      [
        activities[index],
        activities[index - 1]
      ];


      savePlan();

      render();

    };



  card.querySelector(
    ".move-down"
  ).onclick =
    () => {

      const activities =
        currentDayData()
          .activities;


      if (
        index ===
        activities.length - 1
      ) {
        return;
      }


      [
        activities[index],
        activities[index + 1]
      ] =
      [
        activities[index + 1],
        activities[index]
      ];


      savePlan();

      render();

    };



  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這個行程嗎？"
        );


      if (!okay) {
        return;
      }


      currentDayData()
        .activities
        .splice(
          index,
          1
        );


      savePlan();

      render();

    };


  updateStatusStyle();


  return card;

}



function typeOptions(
  selected
) {

  const options = [

    ["景點","📍 景點"],

    ["交通","🚗 交通"],

    ["住宿","🏨 住宿"],

    ["門票","🎫 門票"],

    ["餐飲","🍝 餐飲"],

    ["停車","🅿️ 停車"],

    ["咖啡","☕ 咖啡"],

    ["購物","🛍️ 購物"],

    ["其他","📌 其他"]

  ];


  return options
    .map(
      option =>
        `

          <option
            value="${option[0]}"
            ${
              option[0] === selected
              ? "selected"
              : ""
            }
          >
            ${option[1]}
          </option>

        `
    )
    .join("");

}



function openMaps(
  activity
) {

  if (
    activity.maps &&
    activity.maps.trim()
  ) {

    window.open(
      activity.maps.trim(),
      "_blank",
      "noopener"
    );

    return;

  }


  const query =
    activity.place.trim() ||
    activity.title.trim();


  if (!query) {

    alert(
      "先填地點名稱或地址"
    );

    return;

  }


  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(
      query
    );


  window.open(
    url,
    "_blank",
    "noopener"
  );

}



document.getElementById(
  "addActivity"
).onclick =
  () => {

    currentDayData()
      .activities
      .push(
        newActivity()
      );


    savePlan();

    render();


    setTimeout(
      () => {

        const cards =
          document.querySelectorAll(
            ".activity-card"
          );


        const last =
          cards[
            cards.length - 1
          ];


        last
          ?.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });


        last
          ?.querySelector(
            ".activity-title"
          )
          ?.focus();

      },
      70
    );

  };



function render() {

  renderDayButtons();

  renderDayInfo();

  renderActivities();

}



function escapeHtml(
  text = ""
) {

  return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}



function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}



loadPlan();

render();


</script>
