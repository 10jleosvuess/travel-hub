  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #827d75;
      --line: #e8e2d9;
      --accent: #9a7350;
      --accent-soft: #eee4d8;
      --dark: #2e2d29;
      --danger: #a65a52;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(950px, calc(100% - 24px));
      margin: auto;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(244,241,235,0.92);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      border-radius: 14px;

      background: white;

      display: grid;
      place-items: center;

      box-shadow: var(--shadow);
    }

    .save-status {
      color: var(--muted);
      font-size: 12px;
    }


    /* DAY SELECTOR */

    .day-scroll {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding: 14px 0 10px;

      scrollbar-width: none;
    }

    .day-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-button {
      flex: 0 0 auto;

      min-width: 72px;

      border: 0;

      background: white;

      padding: 10px 12px;

      border-radius: 16px;

      box-shadow: var(--shadow);

      color: var(--muted);
    }

    .day-button strong {
      display: block;

      font-size: 14px;

      color: var(--text);

      margin-bottom: 3px;
    }

    .day-button span {
      font-size: 11px;
    }

    .day-button.active {
      background: var(--dark);
      color: rgba(255,255,255,0.72);
    }

    .day-button.active strong {
      color: white;
    }


    /* DAY HERO */

    .day-hero {
      margin-top: 10px;

      background: var(--dark);
      color: white;

      border-radius: 25px;

      padding: 22px;

      box-shadow: var(--shadow);
    }

    .day-number {
      color: rgba(255,255,255,0.65);
      font-size: 12px;

      margin-bottom: 7px;
    }

    .day-date {
      font-size: 13px;
      color: rgba(255,255,255,0.68);

      margin-bottom: 12px;
    }

    .hero-input {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;
      color: white;

      font-weight: 800;
      font-size: 27px;

      padding: 0;
    }

    .hero-input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .city-input {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: rgba(255,255,255,0.72);

      font-size: 14px;

      margin-top: 8px;
      padding: 0;
    }

    .city-input::placeholder {
      color: rgba(255,255,255,0.4);
    }


    /* SECTION */

    .section {
      margin-top: 22px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 11px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 19px;
    }

    .add-button {
      border: 0;

      padding: 9px 13px;

      border-radius: 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 700;
      font-size: 13px;
    }


    /* ACTIVITY */

    .activity-list {
      display: grid;
      gap: 12px;
    }

    .activity {
      background: white;

      border-radius: 22px;

      padding: 16px;

      box-shadow: var(--shadow);
    }

    .activity-top {
      display: grid;

      grid-template-columns:
        95px 120px 1fr;

      gap: 9px;
    }

    .field {
      border: 1px solid var(--line);

      border-radius: 13px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;

      width: 100%;
    }

    .field:focus {
      border-color: #bba58f;
      background: white;
    }

    .title-field {
      font-weight: 700;
    }

    textarea.field {
      resize: vertical;
      min-height: 72px;
      line-height: 1.55;
    }

    .activity-details {
      margin-top: 10px;

      display: grid;
      gap: 9px;
    }

    .map-row {
      display: grid;

      grid-template-columns:
        1fr auto;

      gap: 8px;
    }

    .map-button {
      border: 0;

      border-radius: 13px;

      padding: 0 14px;

      background: #e8efe7;

      font-weight: 700;

      white-space: nowrap;
    }

    .map-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .activity-actions {
      display: flex;
      gap: 7px;

      margin-top: 12px;

      flex-wrap: wrap;
    }

    .action-button {
      border: 0;

      border-radius: 11px;

      background: #f1eee9;

      padding: 8px 10px;

      font-size: 12px;
    }

    .delete-button {
      color: var(--danger);
      margin-left: auto;
    }


    /* EMPTY */

    .empty {
      text-align: center;

      padding: 40px 20px;

      border: 1px dashed #cabdac;

      border-radius: 22px;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 9px;
    }


    /* DAY NOTE */

    .note-card {
      background: white;

      border-radius: 22px;

      padding: 17px;

      box-shadow: var(--shadow);
    }

    .note-card textarea {
      width: 100%;

      min-height: 100px;

      border: 0;
      outline: none;

      resize: vertical;

      color: var(--text);

      line-height: 1.65;
    }


    /* RESET */

    .danger-zone {
      margin-top: 30px;

      border-top: 1px solid var(--line);

      padding-top: 20px;
    }

    .reset-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 12px;
    }


    /* NAV */

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);

      display: grid;
      grid-template-columns: repeat(5,1fr);
    }

    .nav-link {
      display: flex;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      gap: 3px;

      font-size: 11px;

      color: #79756e;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);
      font-weight: 700;
    }


    /* MOBILE */

      .activity-top {
        grid-template-columns: 85px 1fr;
      }

      .title-field {
        grid-column: 1 / -1;
      }

      .delete-button {
        margin-left: 0;
      }

    }

  </style>
</head>

let tripData;

let currentDay = 0;



function cloneDefaults() {

  return JSON.parse(
    JSON.stringify(defaultDays)
  );

}



function loadData() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (saved) {

    try {

      tripData =
        JSON.parse(saved);

    }

    catch {

      tripData =
        cloneDefaults();

    }

  }

  else {

    tripData =
      cloneDefaults();

  }

}



function saveData() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tripData)
  );


  const status =
    document.getElementById(
      "saveStatus"
    );


  status.textContent =
    "已儲存 ✓";


  clearTimeout(
    window.saveMessageTimer
  );


  window.saveMessageTimer =
    setTimeout(
      () => {

        status.textContent =
          "自動儲存";

      },
      1200
    );

}



function formatDate(
  dateString
) {

  const date =
    new Date(
      dateString +
      "T00:00:00"
    );


  const month =
    date.getMonth() + 1;


  const day =
    date.getDate();


  const weekday =
    [
      "日",
      "一",
      "二",
      "三",
      "四",
      "五",
      "六"
    ][
      date.getDay()
    ];


  return (
    month +
    "/" +
    day +
    "（" +
    weekday +
    "）"
  );

}

    (
      day,
      index
    ) => {


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "day-button" +
        (
          index === currentDay
          ? " active"
          : ""
        );


      button.innerHTML =
        `
          <strong>
            Day ${index + 1}
          </strong>

          <span>
            ${formatDate(day.date)}
          </span>
        `;


      button.onclick =
        () => {

          currentDay =
            index;

          render();

          setTimeout(
            () => {

              document
                .querySelector(
                  ".day-button.active"
                )
                ?.scrollIntoView({
                  behavior:
                    "smooth",
                  inline:
                    "center",
                  block:
                    "nearest"
                });

            },
            50
          );

        };


      container.appendChild(
        button
      );

    }
  );

}



function renderDayHeader() {

  const day =
    tripData[
      currentDay
    ];


  document.getElementById(
    "dayNumber"
  ).textContent =
    "DAY " +
    (
      currentDay +
      1
    );


  document.getElementById(
    "dayDate"
  ).textContent =
    formatDate(
      day.date
    );


  const title =
    document.getElementById(
      "dayTitle"
    );


  const city =
    document.getElementById(
      "dayCity"
    );


  const note =
    document.getElementById(
      "dayNote"
    );


  title.value =
    day.title || "";


  city.value =
    day.city || "";


  note.value =
    day.note || "";


  title.oninput =
    () => {

      day.title =
        title.value;

      saveData();

    };


  city.oninput =
    () => {

      day.city =
        city.value;

      saveData();

    };


  note.oninput =
    () => {

      day.note =
        note.value;

      saveData();

    };

}



function createActivityCard(
  activity,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "activity";


  card.innerHTML =
    `

      <div class="activity-top">

        <input
          class="field activity-time"
          type="time"
          value="${escapeAttribute(activity.time || "")}"
        >


        <select
          class="field activity-type"
        >

          ${buildTypeOptions(activity.type)}

        </select>


        <input
          class="field title-field activity-title"
          type="text"
          placeholder="景點 / 行程名稱"
          value="${escapeAttribute(activity.title || "")}"
        >

      </div>



      <div class="activity-details">

        <textarea
          class="field activity-note"
          placeholder="備註，例如：門票時間、停車、注意事項、交通方式……"
        >${escapeHtml(activity.note || "")}</textarea>


        <div class="map-row">

          <input
            class="field activity-map"
            type="url"
            placeholder="Google Maps 連結"
            value="${escapeAttribute(activity.map || "")}"
          >


          <button
            class="map-button"
          >
            📍 導航
          </button>

        </div>

      </div>



      <div class="activity-actions">

        <button
          class="action-button move-up"
        >
          ↑ 上移
        </button>


        <button
          class="action-button move-down"
        >
          ↓ 下移
        </button>


        <button
          class="action-button delete-button"
        >
          🗑 刪除
        </button>

      </div>

    `;



  const timeInput =
    card.querySelector(
      ".activity-time"
    );


  const typeInput =
    card.querySelector(
      ".activity-type"
    );


  const titleInput =
    card.querySelector(
      ".activity-title"
    );


  const noteInput =
    card.querySelector(
      ".activity-note"
    );


  const mapInput =
    card.querySelector(
      ".activity-map"
    );


  const mapButton =
    card.querySelector(
      ".map-button"
    );



  function update() {

    activity.time =
      timeInput.value;


    activity.type =
      typeInput.value;


    activity.title =
      titleInput.value;


    activity.note =
      noteInput.value;


    activity.map =
      mapInput.value;


    updateMapButton();

    saveData();

  }



  function updateMapButton() {

    mapButton.disabled =
      !mapInput.value.trim();

  }



  timeInput.oninput =
    update;


  typeInput.onchange =
    update;


  titleInput.oninput =
    update;


  noteInput.oninput =
    update;


  mapInput.oninput =
    update;



  mapButton.onclick =
    () => {

      const url =
        mapInput.value.trim();


      if (!url) {
        return;
      }


      window.open(
        url,
        "_blank",
        "noopener"
      );

    };



  card.querySelector(
    ".move-up"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      const list =
        tripData[
          currentDay
        ].activities;


      [
        list[index - 1],
        list[index]
      ] =
      [
        list[index],
        list[index - 1]
      ];


      saveData();

      renderActivities();

    };



  card.querySelector(
    ".move-down"
  ).onclick =
    () => {

      const list =
        tripData[
          currentDay
        ].activities;


      if (
        index ===
        list.length - 1
      ) {
        return;
      }


      [
        list[index],
        list[index + 1]
      ] =
      [
        list[index + 1],
        list[index]
      ];


      saveData();

      renderActivities();

    };



  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這個行程嗎？"
        );


      if (!okay) {
        return;
      }


      tripData[
        currentDay
      ].activities.splice(
        index,
        1
      );


      saveData();

      renderActivities();

    };


  updateMapButton();


  return card;

}



function buildTypeOptions(
  selected
) {

  const types =
    [
      "景點",
      "門票",
      "餐廳",
      "自駕",
      "交通",
      "航班",
      "住宿",
      "租車",
      "轉機",
      "購物",
      "其他"
    ];


  return types
    .map(
      type =>
        `
          <option
            value="${type}"
            ${
              type === selected
              ? "selected"
              : ""
            }
          >
            ${type}
          </option>
        `
    )
    .join("");

}



function renderActivities() {

  const container =
    document.getElementById(
      "activityList"
    );


  const activities =
    tripData[
      currentDay
    ].activities;


  container.innerHTML =
    "";


  if (
    activities.length === 0
  ) {

    container.innerHTML =
      `

        <div class="empty">

          <div class="empty-icon">
            🗓️
          </div>

          <strong>
            這天還沒有行程
          </strong>

          <p>
            按右上方「＋ 新增行程」開始安排。
          </p>

        </div>

      `;


    return;

  }


  activities.forEach(
    (
      activity,
      index
    ) => {

      container.appendChild(
        createActivityCard(
          activity,
          index
        )
      );

    }
  );

}



function render() {

  renderDayButtons();

  renderDayHeader();

  renderActivities();

}



document.getElementById(
  "addActivity"
).onclick =
  () => {

    tripData[
      currentDay
    ].activities.push(
      {
        time: "",
        type: "景點",
        title: "",
        note: "",
        map: ""
      }
    );


    saveData();

    renderActivities();


    setTimeout(
      () => {

        const cards =
          document.querySelectorAll(
            ".activity"
          );


        const lastCard =
          cards[
            cards.length - 1
          ];


        lastCard
          ?.scrollIntoView({
            behavior:
              "smooth",
            block:
              "center"
          });


        lastCard
          ?.querySelector(
            ".activity-title"
          )
          ?.focus();

      },
      50
    );

  };



document.getElementById(
  "resetDay"
).onclick =
  () => {

    const okay =
      confirm(
        "確定要把今天恢復成最初版本嗎？你自己修改的內容會消失。"
      );


    if (!okay) {
      return;
    }


    tripData[
      currentDay
    ] =
      JSON.parse(
        JSON.stringify(
          defaultDays[
            currentDay
          ]
        )
      );


    saveData();

    render();

  };



function escapeHtml(
  text
) {

  return String(text)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



function escapeAttribute(
  text
) {

  return escapeHtml(
    text
  );

}



loadData();

render();


</script>


</body>

</html>
