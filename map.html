<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>旅行地圖｜Travel Hub</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #827d75;
      --line: #e8e2d9;
      --accent: #9a7350;
      --accent-soft: #eee4d8;
      --dark: #2e2d29;
      --green-soft: #e6eee7;
      --yellow-soft: #f4eddc;
      --blue-soft: #e6edf3;
      --danger: #a65a52;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, calc(100% - 24px));
      margin: auto;
    }


    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);

      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 700;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      border-radius: 14px;

      background: white;

      display: grid;
      place-items: center;

      box-shadow: var(--shadow);
    }

    .save-status {
      color: var(--muted);
      font-size: 12px;
    }


    /* PAGE */

    .page-head {
      padding: 20px 0 9px;
    }

    .page-head h1 {
      margin: 0 0 5px;
      font-size: 28px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }


    /* DAYS */

    .day-scroll {
      position: sticky;

      top: 70px;

      z-index: 60;

      display: flex;

      gap: 7px;

      overflow-x: auto;

      padding: 10px 0 14px;

      background: var(--bg);

      scrollbar-width: none;
    }

    .day-scroll::-webkit-scrollbar {
      display: none;
    }

    .day-button {
      flex: 0 0 auto;

      min-width: 72px;

      border: 0;

      border-radius: 14px;

      padding: 9px 10px;

      background: white;

      color: var(--muted);

      box-shadow: var(--shadow);
    }

    .day-button strong {
      display: block;

      color: var(--text);

      font-size: 12px;
    }

    .day-button span {
      display: block;

      margin-top: 2px;

      font-size: 10px;
    }

    .day-button.active {
      background: var(--dark);
      color: white;
    }

    .day-button.active strong {
      color: white;
    }


    /* DAY HEADER */

    .day-card {
      background: var(--dark);

      color: white;

      padding: 18px;

      border-radius: 23px;

      box-shadow: var(--shadow);
    }

    .day-top {
      display: flex;

      justify-content: space-between;
      align-items: flex-start;

      gap: 15px;
    }

    .day-card small {
      color: rgba(255,255,255,0.62);
    }

    .day-card h2 {
      margin: 3px 0 0;

      font-size: 22px;
    }

    .day-city {
      margin-top: 5px;

      color: rgba(255,255,255,0.72);

      font-size: 12px;
    }

    .route-button {
      border: 0;

      border-radius: 13px;

      padding: 11px 13px;

      background: white;

      color: var(--dark);

      font-weight: 750;

      white-space: nowrap;
    }

    .route-button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .day-note {
      margin-top: 12px;

      padding-top: 12px;

      border-top: 1px solid rgba(255,255,255,0.12);

      color: rgba(255,255,255,0.72);

      font-size: 12px;
      line-height: 1.55;
    }


    /* MAP */

    .map-panel {
      margin-top: 13px;

      background: white;

      border-radius: 22px;

      padding: 12px;

      box-shadow: var(--shadow);
    }

    .map-title {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      padding: 3px 4px 11px;
    }

    .map-title strong {
      font-size: 14px;
    }

    .map-title span {
      color: var(--muted);
      font-size: 10px;
    }

    .map-frame {
      width: 100%;
      height: 350px;

      border: 0;

      border-radius: 17px;

      background: #ece8e2;
    }

    .map-empty {
      height: 250px;

      border-radius: 17px;

      background: #f4f1ec;

      display: grid;
      place-items: center;

      padding: 25px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }


    /* TOOLBAR */

    .toolbar {
      margin: 18px 0 11px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;
    }

    .toolbar strong {
      font-size: 18px;
    }

    .toolbar span {
      color: var(--muted);
      font-size: 11px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 10px 13px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 750;
    }


    /* ACTIVITY */

    .activity-list {
      display: grid;

      gap: 11px;
    }

    .activity-card {
      background: white;

      border-radius: 21px;

      padding: 15px;

      box-shadow: var(--shadow);
    }

    .activity-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      gap: 10px;

      align-items: center;
    }

    .activity-number {
      width: 35px;
      height: 35px;

      border-radius: 12px;

      display: grid;
      place-items: center;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 800;

      font-size: 12px;
    }

    .activity-title {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 17px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 20px;
    }


    /* FORM */

    .grid {
      display: grid;

      grid-template-columns: repeat(3,1fr);

      gap: 8px;

      margin-top: 12px;
    }

    .field-wrap {
      display: grid;

      gap: 5px;
    }

    .field-wrap.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;

      background: white;
    }

    textarea.field {
      min-height: 68px;

      resize: vertical;

      line-height: 1.5;
    }

    .status-confirmed {
      background: var(--green-soft);
    }

    .status-tentative {
      background: var(--yellow-soft);
    }


    /* ACTIONS */

    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;

      margin-top: 11px;

      padding-top: 11px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      padding: 8px 10px;

      border-radius: 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .map-action {
      background: var(--green-soft);
    }

    .preview-action {
      background: var(--blue-soft);
    }


    /* EMPTY */

    .empty {
      padding: 38px 20px;

      text-align: center;

      border: 1px dashed #cbbeb0;

      border-radius: 21px;

      color: var(--muted);

      background: rgba(255,255,255,0.4);
    }

    .empty-icon {
      font-size: 38px;

      margin-bottom: 8px;
    }

    .empty strong {
      display: block;

      margin-bottom: 4px;

      color: var(--text);
    }


    /* SYNC */

    .sync-box {
      margin-top: 18px;

      padding: 14px 15px;

      border-radius: 17px;

      background: var(--green-soft);

      font-size: 12px;
      line-height: 1.6;
    }

    .sync-box strong {
      display: block;

      margin-bottom: 3px;
    }


    /* NAV */

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      height: 72px;

      z-index: 100;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    .nav-link.active {
      color: var(--text);

      font-weight: 700;
    }


    @media (max-width: 700px) {

      .day-top {
        flex-direction: column;
      }

      .route-button {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field-wrap.full {
        grid-column: auto;
      }

      .map-frame {
        height: 280px;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="container topbar">

    <a
      class="back"
      href="index.html"
    >

      <div class="back-icon">
        ←
      </div>

      <div>
        旅行地圖
      </div>

    </a>


    <div
      class="save-status"
      id="saveStatus"
    >
      共用資料
    </div>

  </div>

</header>



<main class="container">


  <section class="page-head">

    <h1>
      🗺️ 旅行地圖
    </h1>

    <p>
      與每日行程共用同一份資料，這裡修改後行程頁也會一起更新
    </p>

  </section>



  <div
    class="day-scroll"
    id="dayScroll"
  ></div>



  <section class="day-card">

    <div class="day-top">

      <div>

        <small id="dayDate">
          -
        </small>

        <h2 id="dayTitle">
          Day 1
        </h2>

        <div
          class="day-city"
          id="dayCity"
        ></div>

      </div>


      <button
        class="route-button"
        id="openDayRoute"
      >
        🚙 開啟今日路線
      </button>

    </div>


    <div
      class="day-note"
      id="dayNote"
      style="display:none"
    ></div>

  </section>



  <section class="map-panel">

    <div class="map-title">

      <strong>
        📍 地圖預覽
      </strong>

      <span id="previewLabel">
        點地點的「預覽」
      </span>

    </div>


    <div id="mapContainer">

      <div class="map-empty">

        點下面任一地點的「🗺️ 預覽」，<br>
        這裡就會顯示 Google Maps。

      </div>

    </div>

  </section>



  <div class="toolbar">

    <div>

      <strong>
        今日地點 / 行程
      </strong>

      <span id="activityCount">
        0 個
      </span>

    </div>


    <button
      class="add-button"
      id="addActivity"
    >
      ＋ 新增地點
    </button>

  </div>



  <div
    class="activity-list"
    id="activityList"
  ></div>



  <div class="sync-box">

    <strong>
      🔗 已與每日行程同步
    </strong>

    這裡和「每日行程」現在讀的是同一份資料。你在任何一頁修改名稱、地址、狀態、備註或順序，另一頁重新打開後就會看到相同內容。

  </div>


</main>



<nav>

  <a
    class="nav-link"
    href="index.html"
  >
    <span class="nav-icon">🏠</span>
    今天
  </a>


  <a
    class="nav-link"
    href="itinerary.html"
  >
    <span class="nav-icon">📅</span>

  <a

    href="map.html"

    <span class="nav-icon">🗺️</span>

  <a

    票券

  <a
    class="nav-link"
    href="car.html"
  >
    <span class="nav-icon">🚗</span>
    租車
  </a>

</nav>



<script>


const STORAGE_KEY =
  "travelHubItaly2026SharedPlanV1";


const START_DATE =
  new Date(
    "2026-10-01T00:00:00"
  );


let currentDay =
  1;


let plan =
  createEmptyPlan();



function createEmptyPlan() {

  return {

    version: 1,

    days:
      Array.from(
        {
          length: 21
        },
        (
          _,
          index
        ) => ({

          day:
            index + 1,

          title: "",

          city: "",

          note: "",

          activities: []

        })
      )

  };

}



function loadPlan() {

  const saved =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!saved) {
    return;
  }


  try {

    const parsed =
      JSON.parse(saved);


    if (
      parsed &&
      Array.isArray(
        parsed.days
      ) &&
      parsed.days.length === 21
    ) {

      plan =
        parsed;

    }

  }

  catch {}

}



function savePlan() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(plan)
  );


  const status =
    document.getElementById(
      "saveStatus"
    );


  status.textContent =
    "已同步 ✓";


  clearTimeout(
    window.saveTimer
  );


  window.saveTimer =
    setTimeout(
      () => {

        status.textContent =
          "共用資料";

      },
      1200
    );

}



function getDateForDay(
  dayNumber
) {

  const date =
    new Date(
      START_DATE
    );


  date.setDate(
    date.getDate() +
    dayNumber -
    1
  );


  return date;

}



function formatDate(
  date
) {

  const month =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      date.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    month +
    "/" +
    day
  );

}



function currentDayData() {

  return plan.days[
    currentDay - 1
  ];

}



function renderDayButtons() {

  const container =
    document.getElementById(
      "dayScroll"
    );


  container.innerHTML =
    "";


  plan.days.forEach(
    dayData => {


      const date =
        getDateForDay(
          dayData.day
        );


      const button =
        document.createElement(
          "button"
        );


      button.className =
        "day-button" +
        (
          currentDay ===
          dayData.day
          ? " active"
          : ""
        );


      button.innerHTML =
        `

          <strong>
            Day ${dayData.day}
          </strong>

          <span>
            ${formatDate(date)}
          </span>

        `;


      button.onclick =
        () => {

          currentDay =
            dayData.day;


          clearPreview();

          render();

        };


      container.appendChild(
        button
      );

    }
  );

}



function renderDayHeader() {

  const day =
    currentDayData();


  const date =
    getDateForDay(
      currentDay
    );


  document.getElementById(
    "dayDate"
  ).textContent =
    "2026 / " +
    formatDate(date);


  document.getElementById(
    "dayTitle"
  ).textContent =
    day.title
    ? (
        "Day " +
        currentDay +
        " · " +
        day.title
      )
    : (
        "Day " +
        currentDay
      );


  const city =
    document.getElementById(
      "dayCity"
    );


  city.textContent =
    day.city || "";


  city.style.display =
    day.city
    ? "block"
    : "none";


  const note =
    document.getElementById(
      "dayNote"
    );


  note.textContent =
    day.note || "";


  note.style.display =
    day.note
    ? "block"
    : "none";


  const usablePlaces =
    day.activities.filter(
      hasMapLocation
    );


  document.getElementById(
    "openDayRoute"
  ).disabled =
    usablePlaces.length < 2;

}



function hasMapLocation(
  activity
) {

  return Boolean(
    (
      activity.place &&
      activity.place.trim()
    ) ||
    (
      activity.title &&
      activity.title.trim()
    )
  );

}



function newActivity() {

  return {

    id:
      Date.now().toString(36) +
      Math.random()
        .toString(36)
        .slice(2),

    time: "",

    type: "景點",

    title: "",

    status: "暫定",

    place: "",

    maps: "",

    note: ""

  };

}



function renderActivities() {

  const container =
    document.getElementById(
      "activityList"
    );


  const activities =
    currentDayData()
      .activities;


  document.getElementById(
    "activityCount"
  ).textContent =
    activities.length +
    " 個";


  container.innerHTML =
    "";


  if (
    activities.length === 0
  ) {

    container.innerHTML =
      `

        <div class="empty">

          <div class="empty-icon">
            📍
          </div>

          <strong>
            今天還沒有地點
          </strong>

          可以在這裡新增，也可以回每日行程新增。

        </div>

      `;


    return;

  }


  activities.forEach(
    (
      activity,
      index
    ) => {

      container.appendChild(
        createActivityCard(
          activity,
          index
        )
      );

    }
  );

}



function createActivityCard(
  activity,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "activity-card";


  card.innerHTML =
    `

      <div class="activity-top">

        <div class="activity-number">
          ${index + 1}
        </div>


        <input
          class="activity-title"
          placeholder="行程 / 地點名稱"
          value="${escapeAttribute(activity.title)}"
        >


        <button
          class="delete-button"
          title="刪除"
        >
          ×
        </button>

      </div>



      <div class="grid">


        <div class="field-wrap">

          <label>
            時間
          </label>

          <input
            class="field activity-time"
            placeholder="16:45"
            maxlength="5"
            value="${escapeAttribute(activity.time)}"
          >

        </div>



        <div class="field-wrap">

          <label>
            類型
          </label>

          <select
            class="field activity-type"
          >
            ${typeOptions(activity.type)}
          </select>

        </div>



        <div class="field-wrap">

          <label>
            狀態
          </label>

          <select
            class="field activity-status"
          >

            <option
              value="暫定"
              ${activity.status === "暫定" ? "selected" : ""}
            >
              🟡 暫定
            </option>

            <option
              value="已確認"
              ${activity.status === "已確認" ? "selected" : ""}
            >
              ✅ 已確認
            </option>

          </select>

        </div>



        <div class="field-wrap full">

          <label>
            地名 / 地址
          </label>

          <input
            class="field activity-place"
            placeholder="例如：Lago di Braies, Italy"
            value="${escapeAttribute(activity.place)}"
          >

        </div>



        <div class="field-wrap full">

          <label>
            Google Maps 分享連結（選填）
          </label>

          <input
            class="field activity-maps"
            placeholder="有 Maps 分享連結可以直接貼"
            value="${escapeAttribute(activity.maps)}"
          >

        </div>



        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field activity-note"
            placeholder="停車、門票、交通、健行、注意事項……"
          >${escapeHtml(activity.note)}</textarea>

        </div>


      </div>



      <div class="actions">

        <button
          class="action-button preview-action"
        >
          🗺️ 預覽
        </button>


        <button
          class="action-button map-action"
        >
          📍 Google Maps
        </button>


        <button
          class="action-button move-up"
        >
          ↑ 上移
        </button>


        <button
          class="action-button move-down"
        >
          ↓ 下移
        </button>

      </div>

    `;



  const title =
    card.querySelector(
      ".activity-title"
    );


  const time =
    card.querySelector(
      ".activity-time"
    );


  const type =
    card.querySelector(
      ".activity-type"
    );


  const status =
    card.querySelector(
      ".activity-status"
    );


  const place =
    card.querySelector(
      ".activity-place"
    );


  const maps =
    card.querySelector(
      ".activity-maps"
    );


  const note =
    card.querySelector(
      ".activity-note"
    );



  function updateStatusStyle() {

    status.classList.remove(
      "status-confirmed",
      "status-tentative"
    );


    if (
      status.value ===
      "已確認"
    ) {

      status.classList.add(
        "status-confirmed"
      );

    }

    else {

      status.classList.add(
        "status-tentative"
      );

    }

  }



  title.oninput =
    () => {

      activity.title =
        title.value;

      savePlan();

      renderDayHeader();

    };



  time.oninput =
    () => {

      let value =
        time.value.replace(
          /[^0-9:]/g,
          ""
        );


      if (
        /^\d{4}$/.test(value)
      ) {

        value =
          value.slice(
            0,
            2
          ) +
          ":" +
          value.slice(2);

      }


      time.value =
        value;


      activity.time =
        value;


      savePlan();

    };



  type.onchange =
    () => {

      activity.type =
        type.value;

      savePlan();

    };



  status.onchange =
    () => {

      activity.status =
        status.value;

      updateStatusStyle();

      savePlan();

    };



  place.oninput =
    () => {

      activity.place =
        place.value;

      savePlan();

      renderDayHeader();

    };



  maps.oninput =
    () => {

      activity.maps =
        maps.value;

      savePlan();

    };



  note.oninput =
    () => {

      activity.note =
        note.value;

      savePlan();

    };



  card.querySelector(
    ".preview-action"
  ).onclick =
    () => {

      previewActivity(
        activity
      );

    };



  card.querySelector(
    ".map-action"
  ).onclick =
    () => {

      openMaps(
        activity
      );

    };



  card.querySelector(
    ".move-up"
  ).onclick =
    () => {

      if (
        index === 0
      ) {
        return;
      }


      const activities =
        currentDayData()
          .activities;


      [
        activities[index - 1],
        activities[index]
      ] =
      [
        activities[index],
        activities[index - 1]
      ];


      savePlan();

      render();

    };



  card.querySelector(
    ".move-down"
  ).onclick =
    () => {

      const activities =
        currentDayData()
          .activities;


      if (
        index ===
        activities.length - 1
      ) {
        return;
      }


      [
        activities[index],
        activities[index + 1]
      ] =
      [
        activities[index + 1],
        activities[index]
      ];


      savePlan();

      render();

    };



  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這個行程嗎？行程頁也會一起刪除。"
        );


      if (!okay) {
        return;
      }


      currentDayData()
        .activities
        .splice(
          index,
          1
        );


      savePlan();

      clearPreview();

      render();

    };


  updateStatusStyle();


  return card;

}



function typeOptions(
  selected
) {

  const options = [

    ["景點","📍 景點"],

    ["交通","🚗 交通"],

    ["住宿","🏨 住宿"],

    ["門票","🎫 門票"],

    ["餐飲","🍝 餐飲"],

    ["停車","🅿️ 停車"],

    ["咖啡","☕ 咖啡"],

    ["購物","🛍️ 購物"],

    ["其他","📌 其他"]

  ];


  return options
    .map(
      option =>
        `

          <option
            value="${option[0]}"
            ${
              option[0] === selected
              ? "selected"
              : ""
            }
          >
            ${option[1]}
          </option>

        `
    )
    .join("");

}



document.getElementById(
  "addActivity"
).onclick =
  () => {

    currentDayData()
      .activities
      .push(
        newActivity()
      );


    savePlan();

    render();


    setTimeout(
      () => {

        const cards =
          document.querySelectorAll(
            ".activity-card"
          );


        const last =
          cards[
            cards.length - 1
          ];


        last
          ?.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });


        last
          ?.querySelector(
            ".activity-title"
          )
          ?.focus();

      },
      70
    );

  };



function activityQuery(
  activity
) {

  return (
    activity.place?.trim() ||
    activity.title?.trim() ||
    ""
  );

}



function previewActivity(
  activity
) {

  const query =
    activityQuery(
      activity
    );


  if (!query) {

    alert(
      "先填地點名稱或地址"
    );

    return;

  }


  const container =
    document.getElementById(
      "mapContainer"
    );


  container.innerHTML =
    `

      <iframe
        class="map-frame"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=${encodeURIComponent(query)}&output=embed"
      ></iframe>

    `;


  document.getElementById(
    "previewLabel"
  ).textContent =
    activity.title ||
    query;


  container.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}



function clearPreview() {

  document.getElementById(
    "mapContainer"
  ).innerHTML =
    `

      <div class="map-empty">

        點下面任一地點的「🗺️ 預覽」，<br>
        這裡就會顯示 Google Maps。

      </div>

    `;


  document.getElementById(
    "previewLabel"
  ).textContent =
    "點地點的「預覽」";

}



function openMaps(
  activity
) {

  if (
    activity.maps &&
    activity.maps.trim()
  ) {

    window.open(
      activity.maps.trim(),
      "_blank",
      "noopener"
    );

    return;

  }


  const query =
    activityQuery(
      activity
    );


  if (!query) {

    alert(
      "先填地點名稱或地址"
    );

    return;

  }


  const url =
    "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(
      query
    );


  window.open(
    url,
    "_blank",
    "noopener"
  );

}



document.getElementById(
  "openDayRoute"
).onclick =
  () => {

    const activities =
      currentDayData()
        .activities
        .filter(
          hasMapLocation
        );


    if (
      activities.length < 2
    ) {

      alert(
        "至少需要兩個有地點資料的行程"
      );

      return;

    }


    const places =
      activities.map(
        activity =>
          activityQuery(
            activity
          )
      );


    const origin =
      places[0];


    const destination =
      places[
        places.length - 1
      ];


    const middle =
      places.slice(
        1,
        -1
      );


    let url =
      "https://www.google.com/maps/dir/?api=1" +
      "&origin=" +
      encodeURIComponent(origin) +
      "&destination=" +
      encodeURIComponent(destination);


    if (
      middle.length > 0
    ) {

      url +=
        "&waypoints=" +
        encodeURIComponent(
          middle.join("|")
        );

    }


    url +=
      "&travelmode=driving";


    window.open(
      url,
      "_blank",
      "noopener"
    );

  };



function render() {

  renderDayButtons();

  renderDayHeader();

  renderActivities();

}



function escapeHtml(
  text = ""
) {

  return String(text)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}



function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}



loadPlan();

render();


</script>
