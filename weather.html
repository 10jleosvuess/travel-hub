    .topbar {

    .back-icon {

      box-shadow: var(--shadow);

    .right-header {

    }

    .status-dot {
      width: 9px;

    .search-row {

    .forecast {

    .day-card {
      padding: 14px;

      padding: 40px 20px;

    .loading-box.show {

    @media (max-width: 750px) {

  </style>

<script>

/* =========================
   LOGIN
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true

async function checkLogin() {

  const {
    data,
    error
  } =
    await supabaseClient
      .auth
      .getSession();


  if (
    error ||
    !data.session
  ) {

    location.replace(
      "login.html"
    );

    return false;

  }


  return true;

}


/* =========================
   STATUS
========================= */

function setStatus(
  text,
  type = ""
) {

  document.getElementById(
    "statusText"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "statusDot"
    );


  dot.className =
    "status-dot";


  if (type) {

    dot.classList.add(
      type
    );

  }

}


function showError(
  message
) {

  const box =
    document.getElementById(
      "errorBox"
    );


  box.textContent =
    message;


  box.className =
    "error-box show";

}


function clearError() {

  document.getElementById(
    "errorBox"
  ).className =
    "error-box";

}


/* =========================
   WEATHER CODE
========================= */

function weatherInfo(
  code
) {

  const map = {

    0: ["☀️","晴朗"],

    1: ["🌤️","大致晴朗"],

    2: ["⛅","局部多雲"],

    3: ["☁️","陰天"],

    45: ["🌫️","霧"],

    48: ["🌫️","霧凇"],

    51: ["🌦️","小毛雨"],

    53: ["🌦️","毛雨"],

    55: ["🌧️","較強毛雨"],

    56: ["🌧️","凍毛雨"],

    57: ["🌧️","強凍毛雨"],

    61: ["🌦️","小雨"],

    63: ["🌧️","中雨"],

    65: ["🌧️","大雨"],

    66: ["🌧️","凍雨"],

    67: ["🌧️","強凍雨"],

    71: ["🌨️","小雪"],

    73: ["🌨️","中雪"],

    75: ["❄️","大雪"],

    77: ["❄️","雪粒"],

    80: ["🌦️","陣雨"],

    81: ["🌧️","較強陣雨"],

    82: ["⛈️","強陣雨"],

    85: ["🌨️","陣雪"],

    86: ["❄️","強陣雪"],

    95: ["⛈️","雷雨"],

    96: ["⛈️","雷雨伴冰雹"],

    99: ["⛈️","強雷雨伴冰雹"]

  };


  return map[code] ||
    ["🌡️","天氣"];

}


/* =========================
   GEOCODING
========================= */

async function findCity(
  city
) {

  const url =
    "https://geocoding-api.open-meteo.com/v1/search" +
    "?name=" +
    encodeURIComponent(city) +
    "&count=1" +
    "&language=zh" +
    "&format=json";


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "城市搜尋失敗"
    );

  }


  const data =
    await response.json();


  if (
    !data.results ||
    data.results.length === 0
  ) {

    throw new Error(
      "找不到這個城市"
    );

  }


  return data.results[0];

}


/* =========================
   FORECAST
========================= */

async function fetchWeather(
  latitude,
  longitude
) {

  const params =
    new URLSearchParams({

      latitude:
        latitude,

      longitude:
        longitude,

      current:
        [
          "temperature_2m",
          "apparent_temperature",
          "precipitation",
          "rain",
          "weather_code",
          "wind_speed_10m"
        ].join(","),

      daily:
        [
          "weather_code",
          "temperature_2m_max",
          "temperature_2m_min",
          "precipitation_probability_max",
          "precipitation_sum",
          "sunrise",
          "sunset"
        ].join(","),

      timezone:
        "auto",

      forecast_days:
        "16"

    });


  const url =
    "https://api.open-meteo.com/v1/forecast?" +
    params.toString();


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      "天氣資料讀取失敗"
    );

  }


  return await response.json();

}


/* =========================
   FORMAT
========================= */

function formatDate(
  dateString
) {

  const date =
    new Date(
      dateString +
      "T12:00:00"
    );


  return (
    String(
      date.getMonth() + 1
    )
      .padStart(2,"0") +
    "/" +
    String(
      date.getDate()
    )
      .padStart(2,"0")
  );

}


function weekDay(
  dateString
) {

  const date =
    new Date(
      dateString +
      "T12:00:00"
    );


  return [
    "週日",
    "週一",
    "週二",
    "週三",
    "週四",
    "週五",
    "週六"
  ][
    date.getDay()
  ];

}


function timeOnly(
  dateTime
) {

  if (!dateTime) {
    return "--";
  }


  const parts =
    dateTime.split("T");


  return parts[1] || "--";

}


/* =========================
   RENDER CURRENT
========================= */

function renderCurrent(
  place,
  weather
) {

  const current =
    weather.current;


  const info =
    weatherInfo(
      current.weather_code
    );


  const country =
    place.country ||
    "";


  const admin =
    place.admin1 ||
    "";


  document.getElementById(
    "locationName"
  ).textContent =
    [
      place.name,
      admin,
      country
    ]
      .filter(Boolean)
      .join(" · ");


  document.getElementById(
    "weatherName"
  ).textContent =
    info[1];


  document.getElementById(
    "currentIcon"
  ).textContent =
    info[0];


  document.getElementById(
    "currentTemperature"
  ).textContent =
    Math.round(
      current.temperature_2m
    ) +
    "°C";


  document.getElementById(
    "feelsLike"
  ).textContent =
    "體感 " +
    Math.round(
      current.apparent_temperature
    ) +
    "°C";


  document.getElementById(
    "currentRain"
  ).textContent =
    Number(
      current.precipitation || 0
    )
      .toFixed(1) +
    " mm";


  document.getElementById(
    "currentWind"
  ).textContent =
    Math.round(
      current.wind_speed_10m || 0
    ) +
    " km/h";


  document.getElementById(
    "localTime"
  ).textContent =
    timeOnly(
      current.time
    );


  document.getElementById(
    "currentCard"
  ).className =
    "current-card show";

}


/* =========================
   RENDER DAILY
========================= */

function renderDaily(
  daily
) {

  const container =
    document.getElementById(
      "forecast"
    );


  container.innerHTML =
    "";


  daily.time.forEach(
    (
      date,
      index
    ) => {

      const info =
        weatherInfo(
          daily.weather_code[index]
        );


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "day-card";


      card.innerHTML =
        `

          <div class="day-date">
            ${formatDate(date)}
          </div>


          <div class="day-week">
            ${weekDay(date)}
          </div>


          <div class="day-icon">
            ${info[0]}
          </div>


          <div class="temp-range">
            ${
              Math.round(
                daily.temperature_2m_max[index]
              )
            }°
            /
            ${
              Math.round(
                daily.temperature_2m_min[index]
              )
            }°
          </div>


          <div class="weather-desc">
            ${info[1]}
          </div>


          <div class="day-details">

            <div class="detail-row">

              <span>
                ☔ 降雨機率
              </span>

              <strong>
                ${
                  daily.precipitation_probability_max[index]
                  ?? 0
                }%
              </strong>

            </div>


            <div class="detail-row">

              <span>
                💧 雨量
              </span>

              <strong>
                ${
                  Number(
                    daily.precipitation_sum[index] || 0
                  ).toFixed(1)
                } mm
              </strong>

            </div>


            <div class="detail-row">

              <span>
                🌅 日出
              </span>

              <strong>
                ${
                  timeOnly(
                    daily.sunrise[index]
                  )
                }
              </strong>

            </div>


            <div class="detail-row">

              <span>
                🌇 日落
              </span>

              <strong>
                ${
                  timeOnly(
                    daily.sunset[index]
                  )
                }
              </strong>

            </div>

          </div>

        `;


      container.appendChild(
        card
      );

    }
  );

}


/* =========================
   SEARCH
========================= */

async function searchWeather(
  city
) {

  const clean =
    city.trim();


  if (!clean) {
    return;
  }


  clearError();


  document.getElementById(
    "loadingBox"
  ).className =
    "loading-box show";


  document.getElementById(
    "currentCard"
  ).className =
    "current-card";


  document.getElementById(
    "forecast"
  ).innerHTML =
    "";


  setStatus(
    "讀取天氣…",
    "loading"
  );


  try {

    const place =
      await findCity(
        clean
      );


    const weather =
      await fetchWeather(
        place.latitude,
        place.longitude
      );


    renderCurrent(
      place,
      weather
    );


    renderDaily(
      weather.daily
    );


    setStatus(
      "已更新",
      "online"
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    showError(
      "⚠️ " +
      error.message
    );


    setStatus(
      "讀取失敗",
      "error"
    );

  }

  finally {

    document.getElementById(
      "loadingBox"
    ).className =
      "loading-box";

  }

}


/* =========================
   EVENTS
========================= */

document.getElementById(
  "searchButton"
).onclick =
  () => {

    searchWeather(
      document.getElementById(
        "cityInput"
      ).value
    );

  };


document.getElementById(
  "cityInput"
).onkeydown =
  event => {

    if (
      event.key === "Enter"
    ) {

      searchWeather(
        event.target.value
      );

    }

  };


document.querySelectorAll(
  ".city-button"
).forEach(
  button => {

    button.onclick =
      () => {

        const city =
          button.dataset.city;


        document.getElementById(
          "cityInput"
        ).value =
          city;


        searchWeather(
          city
        );

      };

  }
);


/* =========================
   START
========================= */

async function start() {

  const okay =
    await checkLogin();


  if (!okay) {
    return;
  }


  setStatus(
    "已登入",
    "online"
  );


  searchWeather(
    "Rome"
  );

}


start();

</script>
