<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>待辦事項｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --yellow-soft: #f4ecd9;
      --red-soft: #f3e3e1;
      --blue-soft: #e6edf3;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(900px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      color: var(--muted);

      font-size: 11px;

      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;

      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .sync-banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .sync-banner.show {
      display: block;
    }

    .sync-banner.success {
      background: var(--green-soft);
    }

    .sync-banner.error {
      background: var(--red-soft);
    }

    .summary {
      background: var(--dark);
      color: white;

      border-radius: 23px;

      padding: 18px;

      margin-bottom: 14px;

      box-shadow: var(--shadow);
    }

    .summary-top {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 14px;
    }

    .summary small {
      color: rgba(255,255,255,0.64);
    }

    .summary strong {
      display: block;

      margin-top: 3px;

      font-size: 24px;
    }

    .add-button {
      border: 0;

      border-radius: 13px;

      padding: 11px 14px;

      background: white;
      color: var(--dark);

      font-weight: 800;

      white-space: nowrap;
    }

    .progress-track {
      height: 8px;

      margin-top: 14px;

      border-radius: 999px;

      overflow: hidden;

      background: rgba(255,255,255,0.14);
    }

    .progress-bar {
      height: 100%;
      width: 0%;

      background: white;

      border-radius: inherit;

      transition: width 0.25s ease;
    }

    .progress-text {
      margin-top: 7px;

      color: rgba(255,255,255,0.7);

      font-size: 11px;
    }

    .filters {
      display: flex;
      gap: 7px;

      overflow-x: auto;

      margin-bottom: 14px;

      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-button {
      flex: 0 0 auto;

      border: 0;

      border-radius: 999px;

      padding: 9px 13px;

      background: white;

      color: var(--muted);

      box-shadow: var(--shadow);
    }

    .filter-button.active {
      background: var(--dark);
      color: white;
    }

    .todo-list {
      display: grid;
      gap: 11px;
    }

    .todo-card {
      background: white;

      border-radius: 20px;

      padding: 15px;

      box-shadow: var(--shadow);
    }

    .todo-card.done {
      opacity: 0.6;
    }

    .todo-card.done .todo-title {
      text-decoration: line-through;
    }

    .todo-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 10px;
    }

    .done-check {
      width: 22px;
      height: 22px;

      accent-color: #70816b;
    }

    .todo-title {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      color: var(--text);

      font-size: 17px;
      font-weight: 800;
    }

    .delete-button {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 20px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(3,1fr);

      gap: 8px;

      margin-top: 12px;
    }

    .field-wrap {
      display: grid;
      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      background: #fbfaf8;

      outline: none;
    }

    .field:focus {
      border-color: #baa48f;
      background: white;
    }

    textarea.field {
      min-height: 70px;

      resize: vertical;

      line-height: 1.5;
    }

    .priority-high {
      background: var(--red-soft);
    }

    .priority-medium {
      background: var(--yellow-soft);
    }

    .priority-low {
      background: var(--green-soft);
    }

    .actions {
      display: flex;
      gap: 7px;

      flex-wrap: wrap;

      margin-top: 11px;
      padding-top: 11px;

      border-top: 1px solid var(--line);
    }

    .action-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 11px;
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      margin-bottom: 8px;

      font-size: 40px;
    }

    .empty strong {
      display: block;

      margin-bottom: 5px;

      color: var(--text);
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      height: 72px;

      display: grid;

      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .summary-top {
        align-items: flex-start;
      }
    }
  </style>
</head>


<body>

<header>

  <div class="container topbar">

    <a class="back" href="index.html">

      <div class="back-icon">

      </div>

      <div>
        待辦事項
      </div>

    </a>


    <div class="right-header">

      <div
        class="cloud-dot"
        id="cloudDot"
      ></div>

      <div
        class="save-status"
        id="saveStatus"
      >
        連線中…
      </div>

    </div>

  </div>

</header>


<main class="container">

  <section class="page-head">

    <h1>
      ✅ 待辦事項
    </h1>

    <p>
      訂票、預約、文件、行前準備與出發前要完成的事情
    </p>

  </section>


  <div
    class="sync-banner"
    id="syncBanner"
  ></div>


  <section class="summary">

    <div class="summary-top">

      <div>

        <small>
          Italy 2026
        </small>

        <strong id="todoCount">

        </strong>

      </div>


      <button

      </button>

    </div>

  <div

  ></div>

</main>


<nav>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


/* =========================
   SETTINGS
========================= */

const STORAGE_KEY =
  "travelHubItaly2026Todos";


const MODULE_KEY =
  "todos";


let currentUser =
  null;


let todos =
  [];


let currentFilter =
  "all";


let cloudSaveTimer;


/* =========================
   HELPERS
========================= */

function makeId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function valueOf(
  object,
  keys,
  fallback = ""
) {

  for (
    const key of keys
  ) {

    if (
      object &&
      object[key] !== undefined &&
      object[key] !== null
    ) {

      return object[key];

    }

  }


  return fallback;

}


function normalizePriority(
  priority
) {

  const value =
    String(priority || "")
      .toLowerCase();


  if (
    value === "high" ||
    value === "高" ||
    value === "高優先"
  ) {

    return "高";

  }


  if (
    value === "low" ||
    value === "低" ||
    value === "低優先"
  ) {

    return "低";

  }


  return "中";

}


function normalizeTodo(
  oldTodo = {}
) {

  if (
    typeof oldTodo === "string"
  ) {

    return {
      id: makeId(),
      title: oldTodo,
      category: "",
      priority: "中",
      dueDate: "",
      note: "",
      done: false
    };

  }


  return {

    ...oldTodo,

    id:
      valueOf(
        oldTodo,
        ["id"],
        makeId()
      ),

    title:
      valueOf(
        oldTodo,
        [
          "title",
          "name",
          "text",
          "task"
        ]
      ),

    category:
      valueOf(
        oldTodo,
        [
          "category",
          "type"
        ]
      ),

    priority:
      normalizePriority(
        valueOf(
          oldTodo,
          ["priority"],
          "中"
        )
      ),

    dueDate:
      valueOf(
        oldTodo,
        [
          "dueDate",
          "due",
          "date",
          "deadline"
        ]
      ),

    note:
      valueOf(
        oldTodo,
        [
          "note",
          "notes"
        ]
      ),

    done:
      Boolean(
        valueOf(
          oldTodo,
          [
            "done",
            "completed",
            "checked"
          ],
          false
        )
      )

  };

}


function normalizeTodos(
  data
) {

  if (
    Array.isArray(data)
  ) {

    return data.map(
      normalizeTodo
    );

  }


  if (
    data &&
    Array.isArray(data.todos)
  ) {

    return data.todos.map(
      normalizeTodo
    );

  }


  if (
    data &&
    Array.isArray(data.tasks)
  ) {

    return data.tasks.map(
      normalizeTodo
    );

  }


  return [];

}


function newTodo() {

  return {
    id: makeId(),
    title: "",
    category: "",
    priority: "中",
    dueDate: "",
    note: "",
    done: false
  };

}


/* =========================
   STATUS
========================= */

function setCloudStatus(
  text,
  type
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    text;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (type) {
    dot.classList.add(type);
  }

}


function showBanner(
  text,
  type = "success"
) {

  const banner =
    document.getElementById(
      "syncBanner"
    );


  banner.textContent =
    text;


  banner.className =
    "sync-banner show " +
    type;


  setTimeout(
    () => {

      banner.className =
        "sync-banner";

    },
    5000
  );

}


/* =========================
   LOCAL STORAGE
========================= */

function loadLocalTodos() {

  const raw =
    localStorage.getItem(
      STORAGE_KEY
    );


  if (!raw) {
    return null;
  }


  try {

    const parsed =
      JSON.parse(raw);


    return normalizeTodos(
      parsed
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    return null;

  }

}


function saveLocalTodos() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      version: 1,
      todos: todos
    })
  );

}


/* =========================
   CLOUD
========================= */

async function loadCloudModule() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .select("data, updated_at")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function uploadTodosNow() {

  if (!currentUser) {
    return;
  }


  saveLocalTodos();


  setCloudStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from("travel_modules")
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 1,
            todos: todos
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    console.error(
      error
    );


    setCloudStatus(
      "同步失敗",
      "error"
    );


    return;

  }


  setCloudStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleCloudSave() {

  saveLocalTodos();


  setCloudStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    cloudSaveTimer
  );


  cloudSaveTimer =
    setTimeout(
      uploadTodosNow,
      650
    );

}


/* =========================
   INITIAL
========================= */

async function initializeCloud() {

  setCloudStatus(
    "登入確認中…"
  );


  const {
    data: sessionData
  } =
    await supabaseClient
      .auth
      .getSession();


  const session =
    sessionData.session;


  if (!session) {

    window.location.href =
      "login.html";

    return;

  }


  currentUser =
    session.user;


  const localTodos =
    loadLocalTodos();


  setCloudStatus(
    "讀取雲端…",
    "saving"
  );


  try {

    const cloudRow =
      await loadCloudModule();


    if (
      cloudRow &&
      cloudRow.data
    ) {

      todos =
        normalizeTodos(
          cloudRow.data
        );


      saveLocalTodos();


      setCloudStatus(
        "已同步 ☁️",
        "online"
      );


      showBanner(
        "☁️ 已載入待辦事項雲端資料。"
      );

    }

    else if (
      localTodos &&
      localTodos.length > 0
    ) {

      todos =
        localTodos;


      await uploadTodosNow();


      showBanner(
        "☁️ 第一次同步完成：原本瀏覽器裡的待辦事項已上傳到 Supabase。"
      );

    }

    else {

      todos =
        [];


      await uploadTodosNow();


      showBanner(
        "☁️ 已建立待辦事項雲端資料。"
      );

    }

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    todos =
      localTodos || [];


    setCloudStatus(
      "離線備份模式",
      "error"
    );


    showBanner(
      "⚠️ Supabase 暫時無法連線，目前使用本機待辦備份。",
      "error"
    );

  }


  render();

}


/* =========================
   PROGRESS
========================= */

function updateProgress() {

  const total =
    todos.length;


  const done =
    todos.filter(
      todo => todo.done
    ).length;


  const percent =
    total === 0
      ? 0
      : Math.round(
          done / total * 100
        );


  document.getElementById(
    "todoCount"
  ).textContent =
    done +
    " / " +
    total;


  document.getElementById(
    "progressBar"
  ).style.width =
    percent +
    "%";


  document.getElementById(
    "progressText"
  ).textContent =
    total === 0
      ? "尚未建立待辦"
      : "已完成 " +
        percent +
        "% · 還有 " +
        (total - done) +
        " 件";

}


/* =========================
   FILTER
========================= */

function filteredTodos() {

  if (
    currentFilter === "open"
  ) {

    return todos.filter(
      todo => !todo.done
    );

  }


  if (
    currentFilter === "done"
  ) {

    return todos.filter(
      todo => todo.done
    );

  }


  if (
    currentFilter === "high"
  ) {

    return todos.filter(
      todo =>
        todo.priority === "高"
    );

  }


  return todos;

}


document.querySelectorAll(
  ".filter-button"
).forEach(
  button => {

    button.onclick =
      () => {

        currentFilter =
          button.dataset.filter;


        document.querySelectorAll(
          ".filter-button"
        ).forEach(
          item => {

            item.classList.remove(
              "active"
            );

          }
        );


        button.classList.add(
          "active"
        );


        render();

      };

  }
);


/* =========================
   RENDER
========================= */

function render() {

  updateProgress();


  const container =
    document.getElementById(
      "todoList"
    );


  container.innerHTML =
    "";


  const visible =
    filteredTodos();


  if (
    visible.length === 0
  ) {

    container.innerHTML =
      `
        <div class="empty">

          <div class="empty-icon">
            ✅
          </div>

          <strong>
            目前沒有待辦
          </strong>

          可以新增訂票、預約或行前準備事項。

        </div>
      `;


    return;

  }


  visible.forEach(
    todo => {

      const originalIndex =
        todos.findIndex(
          item =>
            item.id === todo.id
        );


      container.appendChild(
        createTodoCard(
          todo,
          originalIndex
        )
      );

    }
  );

}


/* =========================
   TODO CARD
========================= */

function createTodoCard(
  todo,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "todo-card" +
    (
      todo.done
        ? " done"
        : ""
    );


  card.innerHTML =
    `

      <div class="todo-top">

        <input
          class="done-check"
          type="checkbox"
          ${todo.done ? "checked" : ""}
        >


        <input
          class="todo-title"
          placeholder="待辦事項"
          value="${escapeAttribute(todo.title)}"
        >


        <button
          class="delete-button"
          title="刪除"
        >
          ×
        </button>

      </div>


      <div class="grid">


        <div class="field-wrap">

          <label>
            分類
          </label>

          <input
            class="field category"
            placeholder="票券 / 住宿 / 文件"
            value="${escapeAttribute(todo.category)}"
          >

        </div>


        <div class="field-wrap">

          <label>
            優先度
          </label>

          <select class="field priority">

            <option
              value="高"
              ${todo.priority === "高" ? "selected" : ""}
            >
              🔴 高
            </option>

            <option
              value="中"
              ${todo.priority === "中" ? "selected" : ""}
            >
              🟡 中
            </option>

            <option
              value="低"
              ${todo.priority === "低" ? "selected" : ""}
            >
              🟢 低
            </option>

          </select>

        </div>


        <div class="field-wrap">

          <label>
            截止日期
          </label>

          <input
            class="field dueDate"
            type="date"
            value="${escapeAttribute(todo.dueDate)}"
          >

        </div>


        <div class="field-wrap full">

          <label>
            備註
          </label>

          <textarea
            class="field note"
            placeholder="網址、搶票時間、需要準備的資料……"
          >${escapeHtml(todo.note)}</textarea>

        </div>

      </div>


      <div class="actions">

        <button
          class="action-button moveUp"
        >
          ↑ 上移
        </button>


        <button
          class="action-button moveDown"
        >
          ↓ 下移
        </button>

      </div>

    `;


  const checkbox =
    card.querySelector(
      ".done-check"
    );


  checkbox.onchange =
    () => {

      todo.done =
        checkbox.checked;


      scheduleCloudSave();

      render();

    };


  bindInput(
    card,
    ".todo-title",
    todo,
    "title"
  );


  bindInput(
    card,
    ".category",
    todo,
    "category"
  );


  bindInput(
    card,
    ".dueDate",
    todo,
    "dueDate"
  );


  bindInput(
    card,
    ".note",
    todo,
    "note"
  );


  const priority =
    card.querySelector(
      ".priority"
    );


  function updatePriorityStyle() {

    priority.classList.remove(
      "priority-high",
      "priority-medium",
      "priority-low"
    );


    if (
      priority.value === "高"
    ) {

      priority.classList.add(
        "priority-high"
      );

    }

    else if (
      priority.value === "低"
    ) {

      priority.classList.add(
        "priority-low"
      );

    }

    else {

      priority.classList.add(
        "priority-medium"
      );

    }

  }


  priority.onchange =
    () => {

      todo.priority =
        priority.value;


      updatePriorityStyle();

      scheduleCloudSave();

    };


  updatePriorityStyle();


  card.querySelector(
    ".delete-button"
  ).onclick =
    () => {

      const okay =
        confirm(
          "確定要刪除這個待辦嗎？"
        );


      if (!okay) {
        return;
      }


      todos.splice(
        index,
        1
      );


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveUp"
  ).onclick =
    () => {

      if (
        index <= 0
      ) {
        return;
      }


      [
        todos[index - 1],
        todos[index]
      ] =
      [
        todos[index],
        todos[index - 1]
      ];


      scheduleCloudSave();

      render();

    };


  card.querySelector(
    ".moveDown"
  ).onclick =
    () => {

      if (
        index >=
        todos.length - 1
      ) {
        return;
      }


      [
        todos[index],
        todos[index + 1]
      ] =
      [
        todos[index + 1],
        todos[index]
      ];


      scheduleCloudSave();

      render();

    };


  return card;

}


/* =========================
   INPUT
========================= */

function bindInput(
  card,
  selector,
  object,
  key
) {

  const element =
    card.querySelector(
      selector
    );


  element.oninput =
    () => {

      object[key] =
        element.value;


      scheduleCloudSave();

    };

}


/* =========================
   ADD
========================= */

document.getElementById(
  "addTodo"
).onclick =
  () => {

    todos.push(
      newTodo()
    );


    currentFilter =
      "all";


    document.querySelectorAll(
      ".filter-button"
    ).forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.filter === "all"
        );

      }
    );


    scheduleCloudSave();

    render();

  };


/* =========================
   ESCAPE
========================= */

function escapeHtml(
  text = ""
) {

  return String(text)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(
  text = ""
) {

  return escapeHtml(
    text
  );

}


/* =========================
   START
========================= */

initializeCloud();

</script>

</body>
</html>
