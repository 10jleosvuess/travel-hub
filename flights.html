<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>航班資訊｜Travel Hub</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f1eb;
      --card: #ffffff;
      --text: #292824;
      --muted: #817b73;
      --line: #e7e0d7;
      --dark: #2e2d29;
      --accent: #8a7158;
      --accent-soft: #eee4d8;
      --green-soft: #e5eee6;
      --blue-soft: #e6edf3;
      --yellow-soft: #f4ecd9;
      --red-soft: #f3e3e1;
      --danger: #a95e57;
      --shadow: 0 8px 28px rgba(52,45,36,0.06);
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;

      padding-bottom: 95px;
    }

    input,
    textarea,
    select,
    button {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1050px, calc(100% - 24px));
      margin: auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 80;

      background: rgba(244,241,235,0.94);
      backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(0,0,0,0.04);
    }

    .topbar {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 12px;
    }

    .back {
      display: flex;
      align-items: center;
      gap: 10px;

      font-weight: 750;
    }

    .back-icon {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: white;

      box-shadow: var(--shadow);
    }

    .right-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cloud-dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }

    .cloud-dot.online {
      background: #6e9573;
    }

    .cloud-dot.saving {
      background: #c49a59;
    }

    .cloud-dot.error {
      background: #b7635c;
    }

    .save-status {
      color: var(--muted);

      font-size: 11px;
      white-space: nowrap;
    }

    .page-head {
      padding: 22px 0 12px;
    }

    .page-head h1 {
      margin: 0 0 5px;

      font-size: 29px;
    }

    .page-head p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.55;
    }

    .banner {
      display: none;

      margin-bottom: 12px;

      padding: 11px 13px;

      border-radius: 14px;

      font-size: 11px;
      line-height: 1.55;
    }

    .banner.show {
      display: block;
    }

    .banner.success {
      background: var(--green-soft);
    }

    .banner.error {
      background: var(--red-soft);
    }

    /* =========================
       HERO
    ========================= */

    .flight-hero {
      position: relative;

      overflow: hidden;

      margin-bottom: 16px;

      padding: 24px;

      border-radius: 26px;

      background:
        linear-gradient(
          135deg,
          #292824,
          #5a5045
        );

      color: white;

      box-shadow: var(--shadow);
    }

    .flight-hero::after {
      content: "✈";

      position: absolute;

      right: 24px;
      top: 5px;

      font-size: 110px;

      opacity: 0.07;

      transform: rotate(-10deg);
    }

    .hero-label {
      display: inline-block;

      margin-bottom: 17px;

      padding: 7px 10px;

      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;

      background: rgba(255,255,255,0.08);

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.08em;
    }

    .hero-route {
      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: center;

      gap: 15px;
    }

    .hero-airport {
      font-size: 42px;
      font-weight: 900;

      letter-spacing: 0.02em;
    }

    .hero-side:last-child {
      text-align: right;
    }

    .hero-city {
      margin-top: 3px;

      color: rgba(255,255,255,0.63);

      font-size: 12px;
    }

    .hero-plane {
      color: rgba(255,255,255,0.72);

      font-size: 25px;
    }

    .hero-details {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 18px;
    }

    .hero-chip {
      padding: 8px 11px;

      border-radius: 11px;

      background: rgba(255,255,255,0.09);

      color: rgba(255,255,255,0.9);

      font-size: 11px;
    }

    /* =========================
       PASSENGERS
    ========================= */

    .passenger-card {
      margin-bottom: 16px;

      padding: 17px;

      border-radius: 22px;

      background: white;

      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin-bottom: 13px;
    }

    .section-head h2 {
      margin: 0;

      font-size: 18px;
    }

    .section-head span {
      color: var(--muted);

      font-size: 10px;
    }

    .passenger-grid {
      display: grid;

      grid-template-columns: repeat(4,1fr);

      gap: 8px;
    }

    .passenger-box {
      padding: 11px;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: #fbfaf8;
    }

    .passenger-box label {
      display: block;

      margin-bottom: 5px;

      color: var(--muted);

      font-size: 10px;
    }

    .passenger-input {
      width: 100%;

      border: 0;
      outline: none;

      background: transparent;

      font-weight: 750;
    }

    /* =========================
       SEGMENTS
    ========================= */

    .segment-list {
      display: grid;
      gap: 15px;
    }

    .segment-card {
      padding: 17px;

      border-radius: 23px;

      background: white;

      box-shadow: var(--shadow);
    }

    .segment-top {
      display: grid;

      grid-template-columns: auto 1fr auto;

      align-items: center;

      gap: 11px;
    }

    .segment-number {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: var(--accent-soft);

      color: #72543b;

      font-weight: 850;
    }

    .segment-route-title {
      min-width: 0;
    }

    .segment-route-title strong {
      display: block;

      font-size: 18px;
    }

    .segment-route-title small {
      display: block;

      margin-top: 2px;

      color: var(--muted);
    }

    .delete-segment {
      border: 0;

      background: transparent;

      color: var(--danger);

      font-size: 22px;
    }

    .grid {
      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 9px;

      margin-top: 14px;
    }

    .three {
      grid-template-columns: repeat(3,1fr);
    }

    .field-wrap {
      display: grid;

      gap: 5px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);

      font-size: 10px;
    }

    .field {
      width: 100%;

      border: 1px solid var(--line);

      border-radius: 12px;

      padding: 10px 11px;

      outline: none;

      background: #fbfaf8;
    }

    .field:focus {
      border-color: #baa48f;

      background: white;
    }

    textarea.field {
      min-height: 70px;

      resize: vertical;

      line-height: 1.5;
    }

    .sub-title {
      grid-column: 1 / -1;

      margin-top: 5px;
      padding-top: 12px;

      border-top: 1px solid var(--line);

      font-size: 12px;
      font-weight: 850;
    }

    /* =========================
       ROUTE BOARD
    ========================= */

    .route-board {
      grid-column: 1 / -1;

      display: grid;

      grid-template-columns: 1fr auto 1fr;

      align-items: center;

      gap: 12px;

      padding: 15px;

      border-radius: 17px;

      background: var(--dark);
      color: white;
    }

    .route-board .right {
      text-align: right;
    }

    .route-code {
      font-size: 27px;
      font-weight: 900;
    }

    .route-city {
      margin-top: 2px;

      color: rgba(255,255,255,0.6);

      font-size: 10px;
    }

    .route-time {
      margin-top: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    .route-arrow {
      color: rgba(255,255,255,0.65);

      font-size: 20px;
    }

    /* =========================
       TICKETS
    ========================= */

    .tickets-title {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      margin: 17px 0 10px;

      padding-top: 14px;

      border-top: 1px solid var(--line);
    }

    .tickets-title strong {
      font-size: 14px;
    }

    .tickets-title span {
      color: var(--muted);

      font-size: 10px;
    }

    .ticket-grid {
      display: grid;

      grid-template-columns: repeat(2,1fr);

      gap: 9px;
    }

    .ticket-box {
      padding: 12px;

      border: 1px solid var(--line);
      border-radius: 15px;

      background: #f8f6f2;
    }

    .ticket-person {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 8px;

      margin-bottom: 7px;
    }

    .passenger-label {
      font-size: 12px;
      font-weight: 850;
    }

    .ticket-state {
      color: var(--muted);

      font-size: 9px;
    }

    .ticket-state.uploaded {
      color: #5f805f;
    }

    .ticket-file {
      width: 100%;

      font-size: 10px;
    }

    .file-name {
      min-height: 30px;

      margin: 7px 0;

      color: var(--muted);

      font-size: 9px;
      line-height: 1.45;

      word-break: break-word;
    }

    .ticket-actions {
      display: flex;

      gap: 5px;

      flex-wrap: wrap;
    }

    .small-button {
      border: 0;

      border-radius: 9px;

      padding: 7px 9px;

      background: var(--blue-soft);

      font-size: 9px;
    }

    .small-button.delete {
      background: var(--red-soft);

      color: var(--danger);
    }

    .segment-actions {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;

      margin-top: 13px;
      padding-top: 12px;

      border-top: 1px solid var(--line);
    }

    .soft-button {
      border: 0;

      border-radius: 10px;

      padding: 8px 10px;

      background: #f1eee9;

      font-size: 10px;
    }

    .manage-button {
      background: var(--green-soft);
    }

    .add-flight {
      width: 100%;

      margin-top: 14px;

      border: 1px dashed #bfae9b;
      border-radius: 18px;

      padding: 15px;

      background: rgba(255,255,255,0.45);

      color: #72543b;

      font-weight: 850;
    }

    .privacy {
      margin-top: 15px;

      padding: 12px 14px;

      border-radius: 15px;

      background: var(--green-soft);

      color: #536553;

      font-size: 10px;
      line-height: 1.6;
    }

    .empty {
      padding: 45px 20px;

      border: 1px dashed #cbbeb0;
      border-radius: 22px;

      text-align: center;

      color: var(--muted);

      background: rgba(255,255,255,0.45);
    }

    .empty-icon {
      margin-bottom: 8px;

      font-size: 40px;
    }

    nav {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      height: 72px;

      display: grid;
      grid-template-columns: repeat(5,1fr);

      background: rgba(255,255,255,0.94);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .nav-link {
      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      color: #79756e;

      font-size: 11px;
    }

    .nav-icon {
      font-size: 20px;
    }

    @media (max-width: 750px) {

      .passenger-grid {
        grid-template-columns: repeat(2,1fr);
      }

      .grid,
      .three,
      .ticket-grid {
        grid-template-columns: 1fr;
      }

      .full,
      .sub-title,
      .route-board {
        grid-column: auto;
      }

      .hero-airport {
        font-size: 31px;
      }

    }
  </style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://vexzdnyinfmzvcyotiuo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_XZqhHC1vRtMVo8-SexbZoA_vaOd8tfJ";


const BUCKET =
  "travel-private";


const MODULE_KEY =
  "flights";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true
      }
    }
  );


let currentUser =
  null;


let flightData =
  {
    passengers: [
      "乘客 1",
      "乘客 2",
      "乘客 3",
      "乘客 4"
    ],

    segments: []
  };


let saveTimer =
  null;


/* =========================
   HELPERS
========================= */

function makeId() {

  if (
    window.crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function text(
  value
) {

  if (
    value === undefined ||
    value === null
  ) {

    return "";

  }


  return String(value);

}


function escapeHtml(
  value
) {

  return text(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function safeFileName(
  value
) {

  return text(
    value || "ticket"
  )
    .replaceAll("/", "-")
    .replaceAll("\\", "-")
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


function newTicket(
  index
) {

  return {
    id:
      makeId(),

    passengerIndex:
      index,

    path:
      "",

    fileName:
      ""
  };

}


function normalizeTickets(
  tickets
) {

  const source =
    Array.isArray(tickets)
      ?
      tickets
      :
      [];


  return Array.from(
    {
      length: 4
    },
    (
      _,
      index
    ) => {

      const old =
        source[index] ||
        {};


      return {

        id:
          text(
            old.id ||
            makeId()
          ),

        passengerIndex:
          index,

        path:
          text(
            old.path ||
            old.ticketPath ||
            ""
          ),

        fileName:
          text(
            old.fileName ||
            old.ticketName ||
            ""
          )

      };

    }
  );

}


function newSegment() {

  return {

    id:
      makeId(),

    airline:
      "",

    flightNo:
      "",

    date:
      "",

    departureAirport:
      "",

    departureCity:
      "",

    departureTime:
      "",

    departureTerminal:
      "",

    arrivalAirport:
      "",

    arrivalCity:
      "",

    arrivalTime:
      "",

    arrivalTerminal:
      "",

    bookingRef:
      "",

    baggage:
      "",

    status:
      "已確認",

    manageUrl:
      "",

    note:
      "",

    tickets:
      [
        newTicket(0),
        newTicket(1),
        newTicket(2),
        newTicket(3)
      ]

  };

}


function normalizeSegment(
  segment = {}
) {

  return {

    ...segment,

    id:
      text(
        segment.id ||
        makeId()
      ),

    airline:
      text(
        segment.airline
      ),

    flightNo:
      text(
        segment.flightNo ||
        segment.flightNumber
      ),

    date:
      text(
        segment.date
      ),

    departureAirport:
      text(
        segment.departureAirport ||
        segment.fromAirport
      ),

    departureCity:
      text(
        segment.departureCity ||
        segment.fromCity
      ),

    departureTime:
      text(
        segment.departureTime
      ),

    departureTerminal:
      text(
        segment.departureTerminal
      ),

    arrivalAirport:
      text(
        segment.arrivalAirport ||
        segment.toAirport
      ),

    arrivalCity:
      text(
        segment.arrivalCity ||
        segment.toCity
      ),

    arrivalTime:
      text(
        segment.arrivalTime
      ),

    arrivalTerminal:
      text(
        segment.arrivalTerminal
      ),

    bookingRef:
      text(
        segment.bookingRef ||
        segment.bookingNo
      ),

    baggage:
      text(
        segment.baggage
      ),

    status:
      text(
        segment.status ||
        "已確認"
      ),

    manageUrl:
      text(
        segment.manageUrl ||
        segment.airlineUrl
      ),

    note:
      text(
        segment.note ||
        segment.notes
      ),

    tickets:
      normalizeTickets(
        segment.tickets
      )

  };

}


function normalizeData(
  data
) {

  const source =
    (
      data &&
      data.flights
    )
      ?
      data.flights
      :
      (
        data || {}
      );


  const rawPassengers =
    Array.isArray(
      source.passengers
    )
      ?
      source.passengers
      :
      [];


  const passengers =
    Array.from(
      {
        length: 4
      },
      (
        _,
        index
      ) =>
        text(
          rawPassengers[index] ||
          (
            "乘客 " +
            (index + 1)
          )
        )
    );


  const segments =
    Array.isArray(
      source.segments
    )
      ?
      source.segments.map(
        normalizeSegment
      )
      :
      [];


  return {
    passengers,
    segments
  };

}


/* =========================
   STATUS
========================= */

function setStatus(
  message,
  type = ""
) {

  document.getElementById(
    "saveStatus"
  ).textContent =
    message;


  const dot =
    document.getElementById(
      "cloudDot"
    );


  dot.className =
    "cloud-dot";


  if (
    type
  ) {

async function loadCloud() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .select(
        "data"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "module_key",
        MODULE_KEY
      )
      .maybeSingle();


  if (error) {
    throw error;
  }


  return data;

}


async function saveCloud() {

  if (
    !currentUser
  ) {
    return;
  }


  setStatus(
    "同步中…",
    "saving"
  );


  const {
    error
  } =
    await supabaseClient
      .from(
        "travel_modules"
      )
      .upsert(
        {

          user_id:
            currentUser.id,

          module_key:
            MODULE_KEY,

          data: {
            version: 1,
            flights:
              flightData
          },

          updated_at:
            new Date()
              .toISOString()

        },
        {
          onConflict:
            "user_id,module_key"
        }
      );


  if (error) {

    setStatus(
      "同步失敗",
      "error"
    );


    throw error;

  }


  setStatus(
    "已同步 ☁️",
    "online"
  );

}


function scheduleSave() {

  setStatus(
    "等待同步…",
    "saving"
  );


  clearTimeout(
    saveTimer
  );


  saveTimer =
    setTimeout(
      () => {

        saveCloud()
          .catch(
            error => {

              console.error(
                error
              );


              showBanner(
                "雲端同步失敗。",
                "error"
              );

            }
          );

      },
      650
    );

}

   PRIVATE TICKETS
========================= */

async function uploadTicket(
  segment,
  passengerIndex,
  file
) {

  if (!file) {
    return;
  }


  const ticket =
    segment.tickets[
      passengerIndex
    ];


  setStatus(
    "機票上傳中…",
    "saving"
  );


  try {

    const path =
      currentUser.id +
      "/flights/" +
      segment.id +
      "/passenger-" +
      (passengerIndex + 1) +
      "/" +
      Date.now() +
      "-" +
      makeId() +
      "-" +
      safeFileName(
        file.name
      );


    const {
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .upload(
          path,
          file,
          {
            upsert: false,
            cacheControl:
              "3600"
          }
        );


    if (error) {
      throw error;
    }


    const oldPath =
      ticket.path;


    ticket.path =
      path;


    ticket.fileName =
      file.name;


    await saveCloud();


    if (
      oldPath &&
      oldPath !== path
    ) {

      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .remove([
          oldPath
        ]);

    }


    render();


    showBanner(
      "🔒 私人機票已上傳完成。"
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    setStatus(
      "上傳失敗",
      "error"
    );


    showBanner(
      "⚠️ 機票上傳失敗。",
      "error"
    );

  }

}


async function openTicket(
  ticket
) {

  if (
    !ticket.path
  ) {

    alert(
      "這位乘客還沒有上傳機票。"
    );


    return;

  }


  const popup =
    window.open(
      "about:blank",
      "_blank"
    );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .storage
        .from(
          BUCKET
        )
        .createSignedUrl(
          ticket.path,
          600
        );


    if (error) {
      throw error;
    }


    if (
      popup
    ) {

      popup.location =
        data.signedUrl;

    }

    else {

      location.href =
        data.signedUrl;

    }

  }

  catch (
    error
  ) {

    console.error(error);


    if (
      popup
    ) {

      popup.close();

    }


    alert(
      "目前無法開啟這張私人機票。"
    );

  }

}


async function deleteTicket(
  ticket
) {

  if (
    !ticket.path
  ) {
    return;
  }


  if (
    !confirm(
      "確定要刪除這張私人機票嗎？"
    )
  ) {

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .storage
      .from(
        BUCKET
      )
      .remove([
        ticket.path
      ]);


  if (error) {

    alert(
      "刪除失敗。"
    );


    return;

  }


  ticket.path =
    "";


  ticket.fileName =
    "";


  await saveCloud();


  render();

}

/* =========================
   HERO
========================= */

function nextSegment() {

  if (
    flightData.segments.length === 0
  ) {

    return null;

  }


  const now =
    new Date();


  const future =
    flightData.segments
      .map(
        (
          segment,
          index
        ) => {

          let date =
            null;


          if (
            segment.date
          ) {

            const time =
              segment.departureTime ||
              "00:00";


            date =
              new Date(
                segment.date +
                "T" +
                time
              );

          }


          return {
            segment,
            index,
            date
          };

        }
      )
      .filter(
        item =>
          item.date &&
          item.date >= now
      )
      .sort(
        (
          a,
          b
        ) =>
          a.date - b.date
      );


  if (
    future.length > 0
  ) {

    return future[0].segment;

  }


  return flightData.segments[0];

}


function renderHero() {

  const segment =
    nextSegment();


  if (
    !segment
  ) {

    document.getElementById(

    segment.arrivalAirport ||

  const details =

  if (

    );

  }

  if (

      [
        segment.airline,

      ]

        .join(" ")
    );

  }


  if (
    segment.status
  ) {

    details.push(

    );

  }


  document.getElementById(
    "heroDetails"
  ).innerHTML =
    details
      .map(
        item =>
          `
            <div class="hero-chip">
              ${escapeHtml(item)}
            </div>
          `
      )
      .join("");

}

/* =========================
   FIELD EVENTS
========================= */

const segmentList =
  document.getElementById(
    "segmentList"
  );


function getSegmentInfo(
  target
) {

  const card =
    target.closest(
      ".segment-card"
    );


  if (!card) {
    return null;
  }


  const index =
    Number(
      card.dataset.index
    );


  if (
    !Number.isInteger(index) ||
    !flightData.segments[index]
  ) {

    return null;
  }


  return {

    card,

    index,

    segment:
      flightData.segments[index]

  };

}


segmentList.addEventListener(
  "input",
  event => {

    const field =
      event.target.dataset.field;


    if (!field) {
      return;
    }


    const info =
      getSegmentInfo(
        event.target
      );


    if (!info) {
      return;
    }


    info.segment[field] =
      event.target.value;


    scheduleSave();


    if (
      [
        "departureAirport",
        "departureCity",
        "departureTime",
        "arrivalAirport",
        "arrivalCity",
        "arrivalTime",
        "airline",
        "flightNo",
        "date",
        "status"
      ].includes(field)
    ) {

      renderHero();

    }

  }
);


segmentList.addEventListener(
  "change",
  async event => {

    const field =
      event.target.dataset.field;


    if (field) {

      const info =
        getSegmentInfo(
          event.target
        );


      if (!info) {
        return;
      }


      info.segment[field] =
        event.target.value;


      scheduleSave();

      renderHero();


      return;

    }


    const rawPassenger =
      event.target.dataset.uploadTicket;


    if (
      rawPassenger === undefined
    ) {
      return;
    }


    const info =
      getSegmentInfo(
        event.target
      );


    if (!info) {
      return;
    }


    const passengerIndex =
      Number(
        rawPassenger
      );


    const file =
      event.target.files &&
      event.target.files[0];


    if (!file) {
      return;
    }


    await uploadTicket(
      info.segment,
      passengerIndex,
      file
    );

  }
);


/* =========================
   BUTTON EVENTS
========================= */

segmentList.addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest(
        "[data-action]"
      );


    if (!button) {
      return;
    }


    const info =
      getSegmentInfo(
        button
      );


    if (!info) {
      return;
    }


    const {
      segment,
      index
    } =
      info;


    const action =
      button.dataset.action;


    if (
      action === "manage-booking"
    ) {

      if (
        !segment.manageUrl
      ) {

        alert(
          "請先填航空公司的管理訂位連結。"
        );


        return;

      }


      window.open(
        segment.manageUrl,
        "_blank",
        "noopener"
      );


      return;

    }


    if (
      action === "open-ticket"
    ) {

      const passengerIndex =
        Number(
          button.dataset.passenger
        );


      await openTicket(
        segment.tickets[
          passengerIndex
        ]
      );


      return;

    }


    if (
      action === "delete-ticket"
    ) {

      const passengerIndex =
        Number(
          button.dataset.passenger
        );


      await deleteTicket(
        segment.tickets[
          passengerIndex
        ]
      );


      return;

    }


    if (
      action === "up"
    ) {

      if (
        index === 0
      ) {
        return;
      }


      [
        flightData.segments[index - 1],
        flightData.segments[index]
      ] =
      [
        flightData.segments[index],
        flightData.segments[index - 1]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "down"
    ) {

      if (
        index >=
        flightData.segments.length - 1
      ) {
        return;
      }


      [
        flightData.segments[index],
        flightData.segments[index + 1]
      ] =
      [
        flightData.segments[index + 1],
        flightData.segments[index]
      ];


      scheduleSave();

      render();


      return;

    }


    if (
      action === "delete-segment"
    ) {

      if (
        !confirm(
          "確定要刪除這個航段，以及這一段四位乘客已上傳的機票嗎？"
        )
      ) {

        return;

      }


      const paths =
        segment.tickets
          .map(
            ticket =>
              ticket.path
          )
          .filter(Boolean);


      if (
        paths.length > 0
      ) {

        await supabaseClient
          .storage
          .from(
            BUCKET
          )
          .remove(
            paths
          );

      }


      flightData.segments.splice(
        index,
        1
      );


      await saveCloud();


      render();

    }

  }
);


/* =========================
   ADD
========================= */

document.getElementById(
  "addSegment"
).onclick =
  () => {

    flightData.segments.push(
      newSegment()
    );


    scheduleSave();

    render();

  };


/* =========================
   INITIAL
========================= */

async function initialize() {

  try {

    setStatus(
      "登入確認中…"
    );


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getSession();


    if (
      error ||
      !data.session
    ) {

      location.replace(
        "login.html"
      );


      return;

    }


    currentUser =
      data.session.user;


    setStatus(
      "讀取雲端…",
      "saving"
    );


    const row =
      await loadCloud();


    if (
      row &&
      row.data
    ) {

      flightData =
        normalizeData(
          row.data
        );

    }

    else {

      flightData =
        normalizeData(null);


      await saveCloud();

    }


    render();


    setStatus(
      "已同步 ☁️",
      "online"
    );

  }

  catch (
    error
  ) {

    console.error(
      error
    );


    setStatus(
      "載入失敗",
      "error"
    );


    showBanner(
      "⚠️ 航班資料載入失敗。",
      "error"
    );

  }

}


initialize();

</script>
